    <script>
      (function () {

        // --- PERSIAN DIGITS & TEXT NORMALIZATION ---
        const FA_DIGITS = ["۰", "۱", "۲", "۳", "۴", "۵", "۶", "۷", "۸", "۹"];
        function toFa(input) {
          if (input === null || input === undefined) return "";
          return String(input).replace(/\d/g, function (d) {
            return FA_DIGITS[Number(d)];
          });
        }

        function normalizeFa(str) {
          if (!str) return "";
          return String(str)
            .replace(/ي/g, "ی")
            .replace(/ك/g, "ک")
            .replace(/\u200c/g, "") // strip ZWNJ for resilient matching
            .replace(/[«»"'،؟?.!]/g, " ")
            .replace(/\s+/g, " ")
            .trim()
            .toLowerCase();
        }

        function escapeHtml(str) {
          if (str === null || str === undefined) return "";
          return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
        }

          { id: 3, title: "فصل ۳ «دست چپ و دو دست»", lessonIds: [9, 10, 11, 12] }
        ];

            steps: [
              "همه‌ی گروه‌های دوتایی رو با یه انگشت لمس کن.",

              "کلید سفیدِ سمت چپِ گروه دوتایی رو پیدا کردم؟"
            ],
            quiz: [
              {
                q: "«دو» کنار کدوم گروه کلید سیاهه؟",
                options: ["دوتایی", "سه‌تایی"],

        // --- LOCAL CALENDAR & STREAK HELPERS ---
        function getTodayStr() {
          const now = new Date();
          const y = now.getFullYear();
          const m = String(now.getMonth() + 1).padStart(2, "0");
          const d = String(now.getDate()).padStart(2, "0");
          return y + "-" + m + "-" + d;
        }

        function parseLocalDate(dateStr) {
          if (!dateStr) return null;
          const parts = dateStr.split("-").map(Number);
          if (parts.length !== 3 || isNaN(parts[0])) return null;
          return new Date(parts[0], parts[1] - 1, parts[2]);
        }

        function formatDateStr(dateObj) {
          const y = dateObj.getFullYear();
          const m = String(dateObj.getMonth() + 1).padStart(2, "0");
          const d = String(dateObj.getDate()).padStart(2, "0");
          return y + "-" + m + "-" + d;
        }

        function diffCalendarDays(dateStrA, dateStrB) {
          const a = parseLocalDate(dateStrA);
          const b = parseLocalDate(dateStrB);
          if (!a || !b) return null;
          const utcA = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
          const utcB = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
          return Math.round((utcB - utcA) / (1000 * 60 * 60 * 24));
        }

        // Week starts on Saturday (JS getDay(): Sunday=0 ... Saturday=6)
        // Offset from Saturday: (day + 1) % 7 -> Sat=0, Sun=1, Mon=2, Tue=3, Wed=4, Thu=5, Fri=6
        function getSaturdayWeekStart(dateStr) {
          const dt = parseLocalDate(dateStr) || new Date();
          const dayOffset = (dt.getDay() + 1) % 7;
          const sat = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() - dayOffset);
          return formatDateStr(sat);
        }

        function getCurrentWeekDays() {
          const todayStr = getTodayStr();
          const satStr = getSaturdayWeekStart(todayStr);
          const sat = parseLocalDate(satStr);
          const labels = ["ش", "ی", "د", "س", "چ", "پ", "ج"];
          const result = [];
          for (let i = 0; i < 7; i++) {
            const d = new Date(sat.getFullYear(), sat.getMonth(), sat.getDate() + i);
            const dStr = formatDateStr(d);
            result.push({
              label: labels[i],
              dateStr: dStr,
              isToday: dStr === todayStr
            });
          }
          return result;
        }

        // Reconcile Streak on App Load & Activity
        function evaluateStreakOnLoad() {
          const today = getTodayStr();
          const last = state.streak.lastActiveDate;
          if (!last) return;

          const diff = diffCalendarDays(last, today);
          if (diff === null || diff <= 1) return;

          const currentWeekKey = getSaturdayWeekStart(today);
          if (diff === 2 && state.streak.freeDayUsedWeek !== currentWeekKey) {
            // Missed exactly 1 day and this week's free day is available: use it automatically!
            state.streak.freeDayUsedWeek = currentWeekKey;
            saveState();
          } else if (diff >= 2) {
            // Missed more than 1 day, or free day already used this week
            if (diff > 2 || state.streak.freeDayUsedWeek !== currentWeekKey) {
              state.streak.count = 0;
              saveState();
            }
          }
        }

            state.streak.activeDates.push(today);

            return;

            state.streak.count += 1;
          } else if (diff === 2) {

              state.streak.count += 1;

          const saved = state.progress.lessonProgress[lessonId];
          return saved && typeof saved.stepIndex === "number" ? saved.stepIndex : 0;
        }

        function setSavedLessonStep(lessonId, stepIndex) {
          if (!state.progress.lessonProgress[lessonId]) {
            state.progress.lessonProgress[lessonId] = { stepIndex: 0, selfCheck: {} };
          }
          state.progress.lessonProgress[lessonId].stepIndex = stepIndex;
          saveState();
        }

        function toggleSelfCheckItem(lessonId, idx) {
          if (!state.progress.lessonProgress[lessonId]) {
            state.progress.lessonProgress[lessonId] = { stepIndex: 0, selfCheck: {} };
          }
          const current = !!state.progress.lessonProgress[lessonId].selfCheck[idx];
          state.progress.lessonProgress[lessonId].selfCheck[idx] = !current;
          saveState();
        }

        function markLessonComplete(lessonId) {
          if (!state.progress.completedLessons.includes(lessonId)) {
            state.progress.completedLessons.push(lessonId);
          }
          if (state.progress.lessonProgress[lessonId]) {
            state.progress.lessonProgress[lessonId].stepIndex = 0;
          }
          recordDailyCompletion();

          // Check if Lesson 1 was just finished for the first time
          if (
            lessonId === 1 &&
            !state.progress.lesson1SignupPromptShown &&
            !state.user.email

            state.progress.lesson1SignupPromptShown = true;
            ui.showLesson1SignupModal = true;

            steps.push({
              type: "quiz",
              title: "آزمونک (" + toFa(idx + 1) + " از " + toFa(lesson.quiz.length) + ")",
              quizIndex: idx,
              quizItem: qItem

        // --- ADVISOR MATCHER ---
        function getAdvisorResponse(userText) {
          const norm = normalizeFa(userText);
          if (!norm) return null;

          for (let i = 0; i < MISTAKES_LIST.length; i++) {
            const item = MISTAKES_LIST[i];
            const matched = item.keywords.some(function (kw) {
              return norm.includes(normalizeFa(kw));
            });
            if (matched) {
              if (item.isDynamicProgress) {
                const doneCount = state.progress.completedLessons.length;
                return {
                  matched: true,
                  isProgress: true,
                  text:
                    "تا اینجا " +
                    toFa(doneCount) +
                    " از ۱۲ درس رو جلو بردی و استریکت " +
                    toFa(state.streak.count) +
                    " روزه! پیشنهاد تمرین ۲ دقیقه‌ای: همین الان فقط پشت ساز بشین، چشم‌هات رو ببند و سه تا «دو» روی کیبورد پیدا کن.",
                  lessonId: getNextUnfinishedLessonId() || 1
                };
              }
              const lessonObj = LESSONS.find(function (l) {
                return l.id === item.lessonId;
              });
              return {
                matched: true,
                cause: item.cause,
                fix: item.fix,
                lessonId: item.lessonId,
                lessonTitle: lessonObj ? lessonObj.title : "درس " + toFa(item.lessonId)
              };
            }
          }

          return {
            matched: false,
            text: "این رو هنوز تو درس‌هام ندارم."
          };
        }

          for (let i = 1; i <= total; i++) {
            const cls = i === idx ? "dot active" : i < idx ? "dot done" : "dot";
            html += '<span class="' + cls + '"></span>';
          }
          html += "</div>";
          return html;
        }

        // --- MAIN TABS RENDERERS ---

          const todayLessons = getTodayRecommendedLessons();
          const completedCount = state.progress.completedLessons.length;
          const totalCount = LESSONS.length;
          const pct = Math.round((completedCount / totalCount) * 100);
          const nextLessonId = getNextUnfinishedLessonId();
          const currentLessonObj =
            LESSONS.find(function (l) {
              return l.id === (nextLessonId || 12);
            }) || LESSONS[0];
          const currentChapterObj =
            CHAPTERS.find(function (c) {
              return c.id === currentLessonObj.chapterId;
            }) || CHAPTERS[0];

          const currentWeekKey = getSaturdayWeekStart(getTodayStr());
          const freeDayUsedThisWeek = state.streak.freeDayUsedWeek === currentWeekKey;
          const weekDays = getCurrentWeekDays();

          let weekHtml = '<div class="week-days">';
          weekDays.forEach(function (wd) {
            const isDone = state.streak.activeDates.includes(wd.dateStr);
            const cls =
              "day-cell" + (wd.isToday ? " today" : "") + (isDone ? " done" : "");
            weekHtml +=
              '<div class="' +
              cls +
              '">' +
              "  <div>" + wd.label + "</div>" +
              '  <div style="font-size:0.75rem;margin-top:2px;">' + (isDone ? "✓" : "·") + "</div>" +

            todayListHtml =
              '<p style="color:var(--text-secondary);">همه‌ی ۱۲ درس این مسیر رو با موفقیت تموم کردی! می‌تونی هر درسی رو برای مرور باز کنی.</p>' +
              '<button type="button" class="btn btn-primary" style="margin-top:14px;" data-action="open-lesson" data-id="1">مرور از درس ۱</button>';

                '  <div>' +
                '    <div style="font-weight:700;">درس ' + toFa(l.id) + ": " + escapeHtml(l.title) + "</div>" +
                '    <div class="meta-quiet">مدت زمان: ' + toFa(l.minutes) + " دقیقه · " + escapeHtml(l.goal) + "</div>" +
                "  </div>" +
                "</div>";
            });
            todayListHtml +=
              '<button type="button" class="btn btn-primary" style="margin-top:14px;" data-action="open-lesson" data-id="' +
              todayLessons[0].id +
              '">شروع درس</button>';
          }

          return (
            '<div class="home-grid">' +
            '  <div class="card span-full">' +
            '    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">' +
            '      <h2 style="font-size:1.15rem;font-weight:800;">برنامه‌ی امروز</h2>' +
            '      <span class="meta-quiet">هدف روزانه: ' + toFa(state.preferences.dailyGoal) + " دقیقه</span>" +
            "    </div>" +
            todayListHtml +
            "  </div>" +
            '  <div class="card">' +
            '    <div style="display:flex;align-items:center;justify-content:space-between;">' +
            '      <h3 style="font-size:1.05rem;font-weight:800;">پیوستگی تمرین (استریک)</h3>' +
            '      <span style="color:var(--warm);font-weight:800;font-size:1.1rem;">' + toFa(state.streak.count) + " روز</span>" +
            "    </div>" +
            '    <p class="meta-quiet" style="margin-top:6px;color:var(--text-secondary);">' +
            (freeDayUsedThisWeek

            "  </div>" +
            '  <div class="card" style="display:flex;flex-direction:column;justify-content:space-between;gap:12px;">' +
            '    <div>' +

            '        <span style="font-weight:700;color:var(--accent-text);">' + toFa(completedCount) + " از ۱۲ درس</span>" +

            "  </button>" +
            "</div>"

        function renderPathTab() {
          let html = '<div style="display:flex;flex-direction:column;gap:22px;">';

          CHAPTERS.forEach(function (ch) {
            html +=
              '<section style="display:flex;flex-direction:column;gap:12px;">' +
              '  <h2 style="font-size:1.1rem;font-weight:800;color:var(--text-primary);">' +
              escapeHtml(ch.title) +
              "</h2>" +
              '  <div style="display:flex;flex-direction:column;gap:10px;">';

            ch.lessonIds.forEach(function (lid) {
              const lesson = LESSONS.find(function (l) {
                return l.id === lid;
              });
              if (!lesson) return;
              const status = getLessonStatus(lesson.id);
              const isCurrent = status === "current";
              const isDone = status === "done";
              const statusText = isDone
                ? "انجام‌شده"
                : isCurrent
                ? "درس فعلی"
                : "قفل";

              html +=
                '<button type="button" class="card-interactive ' +
                (isCurrent ? "selected" : "") +
                '" style="' +
                (status === "locked" ? "opacity:0.68;" : "") +
                '" data-action="tap-path-lesson" data-id="' +
                lesson.id +
                '">' +
                '  <div style="display:flex;align-items:center;gap:14px;">' +
                '    <div style="width:38px;height:38px;border-radius:10px;background:' +
                (isDone
                  ? "var(--success-soft);color:var(--success);"
                  : isCurrent
                  ? "var(--accent);color:#FFF;"
                  : "var(--bg-subtle);color:var(--text-muted);") +
                'display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;">' +
                (isDone ? ICONS.check : status === "locked" ? ICONS.lock : toFa(lesson.id)) +
                "    </div>" +
                '    <div style="display:flex;flex-direction:column;gap:2px;text-align:right;">' +
                '      <span style="font-weight:700;font-size:0.98rem;">درس ' +
                toFa(lesson.id) +
                ": " +
                escapeHtml(lesson.title) +
                "</span>" +
                '      <span class="meta-quiet">' +
                toFa(lesson.minutes) +
                " دقیقه · " +
                statusText +
                "</span>" +
                "    </div>" +
                "  </div>" +
                '  <span style="font-size:0.85rem;font-weight:700;color:' +
                (isCurrent ? "var(--accent-text)" : "var(--text-muted)") +
                ';">' +
                (status === "locked" ? "قفل" : "مشاهده") +
                "</span>" +
                "</button>";
            });

            html += "  </div></section>";
          });

          html += "</div>";
          return html;
        }

              "</div>";

        // --- LESSON MODAL / FULLSCREEN FLOW RENDERER ---
        function renderLessonFlowModal() {
          const modal = ui.activeLessonModal;
          if (!modal) return "";

          const lesson = LESSONS.find(function (l) {
            return l.id === modal.lessonId;
          });
          if (!lesson) return "";

          // 1) Intro Screen
          if (modal.mode === "intro") {
            return (
              '<div class="modal-backdrop">' +
              '  <div class="modal-sheet" style="max-width:540px;">' +
              '    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">' +
              '      <span class="meta-quiet" style="font-weight:700;color:var(--accent-text);">درس ' +
              toFa(lesson.id) +
              " از ۱۲</span>" +
              '      <button type="button" class="icon-btn" data-action="close-lesson" aria-label="بستن">' +
              ICONS.close +
              "</button>" +
              "    </div>" +
              '    <h2 style="font-size:1.5rem;font-weight:800;margin-bottom:10px;">' +
              escapeHtml(lesson.title) +
              "</h2>" +
              '    <p style="color:var(--text-secondary);font-size:1rem;margin-bottom:18px;">' +
              escapeHtml(lesson.goal) +
              "</p>" +
              '    <div class="helper-banner" style="margin-bottom:24px;display:flex;align-items:center;gap:8px;">' +
              ICONS.clock +
              '      <span>مدت زمان تقریبی: <strong>' +
              toFa(lesson.minutes) +
              " دقیقه</strong></span>" +
              "    </div>" +
              '    <div style="display:flex;flex-direction:column;gap:10px;">' +
              '      <button type="button" class="btn btn-primary" data-action="start-lesson-steps">شروع</button>' +
              '      <button type="button" class="btn btn-secondary" data-action="start-skip-quiz">اینو بلدم</button>' +
              "    </div>" +
              "  </div>" +
              "</div>"
            );
          }

          // 3) «اینو بلدم» (Skip Quiz: asks 2 of the lesson's quiz questions)
          if (modal.mode === "skipQuiz") {
            const skipQuestions = lesson.quiz.slice(0, 2);
            const qIdx = modal.skipQuizIndex || 0;
            const currentQ = skipQuestions[qIdx];

            let optsHtml = "";
            currentQ.options.forEach(function (opt, idx) {
              optsHtml +=
                '<button type="button" class="card-interactive" data-action="answer-skip-quiz" data-idx="' +
                idx +
                '">' +
                '  <span style="font-weight:700;">' + escapeHtml(opt) + "</span>" +
                "</button>";
            });

            return (
              '<div class="modal-backdrop">' +
              '  <div class="modal-sheet" style="max-width:540px;">' +
              '    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">' +
              '      <span style="font-weight:700;color:var(--accent-text);">سنجش سریع «اینو بلدم» (سؤال ' +
              toFa(qIdx + 1) +
              " از " +
              toFa(skipQuestions.length) +
              ")</span>" +
              '      <button type="button" class="icon-btn" data-action="close-lesson" aria-label="بستن">' +
              ICONS.close +
              "</button>" +
              "    </div>" +
              '    <h3 style="font-size:1.2rem;font-weight:800;margin-bottom:16px;">' +
              escapeHtml(currentQ.q) +
              "</h3>" +
              '    <div style="display:flex;flex-direction:column;gap:10px;">' +
              optsHtml +
              "    </div>" +
              "  </div>" +
              "</div>"
            );
          }

          if (modal.mode === "skipFailed") {
            return (
              '<div class="modal-backdrop">' +
              '  <div class="modal-sheet" style="max-width:480px;text-align:center;">' +
              '    <h3 style="font-size:1.3rem;font-weight:800;margin-bottom:10px;">بهتره یه نگاه به این درس بندازی</h3>' +
              '    <p style="color:var(--text-secondary);margin-bottom:22px;">مرور این درس فقط ' +
              toFa(lesson.minutes) +
              " دقیقه وقت می‌گیره و پایه‌ت رو محکم می‌کنه.</p>" +
              '    <button type="button" class="btn btn-primary" data-action="start-lesson-steps">ورود به درس</button>' +
              "  </div>" +
              "</div>"
            );
          }

          if (modal.mode === "skipSuccess") {
            return (
              '<div class="modal-backdrop">' +
              '  <div class="modal-sheet" style="max-width:480px;text-align:center;">' +
              '    <div style="width:56px;height:56px;border-radius:99px;background:var(--success-soft);color:var(--success);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;">' +
              ICONS.check +
              "    </div>" +
              '    <h3 style="font-size:1.35rem;font-weight:800;margin-bottom:8px;">آفرین! این درس رو کامل بلدی</h3>' +
              '    <p style="color:var(--text-secondary);margin-bottom:22px;">درس ' +
              toFa(lesson.id) +
              " تیک خورد و درس بعدی برات باز شد.</p>" +
              '    <button type="button" class="btn btn-primary" data-action="finish-skip-to-path">بازگشت به مسیر</button>' +
              "  </div>" +
              "</div>"
            );
          }

          // 2) Step-by-step Lesson Pages
          const steps = buildLessonSteps(lesson);
          const sIdx = Math.min(Math.max(0, modal.stepIndex || 0), steps.length - 1);
          const stepObj = steps[sIdx];
          const progressPct = Math.round(((sIdx + 1) / steps.length) * 100);

          let bodyHtml = "";

          // a) ببین و بشنو
          if (stepObj.type === "see") {
            bodyHtml =
              '<div style="display:flex;flex-direction:column;gap:16px;">' +
              '  <div class="media-placeholder">' +
              '    <span style="color:var(--accent);">' + ICONS.music + "</span>" +
              '    <span style="font-weight:700;color:var(--text-primary);">تصویر/صدای این درس به‌زودی</span>' +
              '    <span class="meta-quiet">کپشن راهنما در پایین درج شده است</span>' +
              "  </div>" +
              '  <div class="card" style="background:var(--bg-subtle);">' +
              '    <p style="font-size:1.02rem;line-height:1.75;font-weight:500;">' +
              escapeHtml(lesson.see) +
              "</p>" +
              "  </div>" +
              "</div>";
          }

          // b) تمرین روی سازت
          if (stepObj.type === "practice") {
            let stepsList = '<div style="display:flex;flex-direction:column;gap:12px;">';
            lesson.steps.forEach(function (st, idx) {
              stepsList +=
                '<div class="card" style="display:flex;align-items:flex-start;gap:12px;padding:16px;">' +
                '  <span style="width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent-text);display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;">' +
                toFa(idx + 1) +
                "</span>" +
                '  <span style="font-weight:600;line-height:1.65;">' + escapeHtml(st) + "</span>" +
                "</div>";
            });
            stepsList += "</div>";
            bodyHtml = stepsList;
          }

          // c) خودسنجی (optional checkboxes)
          if (stepObj.type === "selfCheck") {
            const savedChecks =
              (state.progress.lessonProgress[lesson.id] &&
                state.progress.lessonProgress[lesson.id].selfCheck) ||
              {};
            let checksHtml =
              '<p style="color:var(--text-secondary);font-size:0.92rem;margin-bottom:8px;">موارد زیر رو حین تمرین بررسی کن (اختیاری):</p>' +
              '<div style="display:flex;flex-direction:column;gap:10px;">';
            lesson.selfCheck.forEach(function (item, idx) {
              const checked = !!savedChecks[idx];
              checksHtml +=
                '<button type="button" class="card-interactive ' +
                (checked ? "selected" : "") +
                '" data-action="toggle-self-check" data-idx="' +
                idx +
                '">' +
                '  <span style="font-weight:700;">' + escapeHtml(item) + "</span>" +
                '  <span style="width:26px;height:26px;border-radius:7px;border:2px solid var(--accent);display:inline-flex;align-items:center;justify-content:center;background:' +
                (checked ? "var(--accent)" : "transparent") +
                ';color:#FFF;">' +
                (checked ? ICONS.check : "") +
                "</span>" +
                "</button>";
            });
            checksHtml += "</div>";
            bodyHtml = checksHtml;
          }

          // d) آزمونک (one question per page + WHY feedback + retry)
          if (stepObj.type === "quiz") {
            const qItem = stepObj.quizItem;
            const qKey = stepObj.quizIndex;
            const chosenIdx =
              modal.quizState && typeof modal.quizState[qKey] === "number"
                ? modal.quizState[qKey]
                : null;
            const isAnswered = chosenIdx !== null;
            const isRight = isAnswered && chosenIdx === qItem.correctIndex;

            let optsHtml = '<div style="display:flex;flex-direction:column;gap:10px;">';
            qItem.options.forEach(function (opt, idx) {
              let borderStyle = "";
              if (isAnswered && idx === chosenIdx) {
                borderStyle = isRight
                  ? "border-color:var(--success);background:var(--success-soft);"
                  : "border-color:var(--danger);background:var(--danger-soft);";
              }
              optsHtml +=
                '<button type="button" class="card-interactive" style="' +
                borderStyle +
                '" data-action="answer-step-quiz" data-qkey="' +
                qKey +
                '" data-idx="' +
                idx +
                '">' +
                '  <span style="font-weight:700;">' + escapeHtml(opt) + "</span>" +
                (isAnswered && idx === chosenIdx
                  ? '<span style="font-weight:800;color:' +
                    (isRight ? "var(--success)" : "var(--danger)") +
                    ';">' +
                    (isRight ? "✓ درست" : "✗ نادرست") +
                    "</span>"
                  : "") +
                "</button>";
            });
            optsHtml += "</div>";

            let feedbackHtml = "";
            if (isAnswered) {
              feedbackHtml =
                '<div class="helper-banner" style="margin-top:14px;border-color:' +
                (isRight ? "var(--success)" : "var(--danger)") +
                ";background:" +
                (isRight ? "var(--success-soft)" : "var(--danger-soft)") +
                ';color:var(--text-primary);">' +
                '  <div style="font-weight:800;margin-bottom:4px;">' +
                (isRight ? "آفرین، پاسخت درسته!" : "نه کاملاً؛ دوباره امتحان کن:") +
                "</div>" +
                '  <div>' + escapeHtml(isRight ? qItem.rightWhy : qItem.wrongWhy) + "</div>" +
                (!isRight
                  ? '<button type="button" class="btn btn-secondary" style="margin-top:10px;min-height:40px;" data-action="retry-step-quiz" data-qkey="' +
                    qKey +
                    '">تلاش دوباره</button>'
                  : "") +
                "</div>";
            }

            bodyHtml =
              '<div style="display:flex;flex-direction:column;gap:14px;">' +
              '  <h3 style="font-size:1.18rem;font-weight:800;">' + escapeHtml(qItem.q) + "</h3>" +
              optsHtml +
              feedbackHtml +
              "</div>";
          }

          // e) جمع‌بندی
          if (stepObj.type === "summary") {
            bodyHtml =
              '<div style="display:flex;flex-direction:column;gap:16px;">' +
              '  <div class="card" style="border-color:var(--accent);background:var(--accent-soft);">' +
              '    <div style="font-weight:800;font-size:1.1rem;color:var(--accent-text);margin-bottom:6px;">جمع‌بندی این درس</div>' +
              '    <p style="font-weight:600;">' + escapeHtml(lesson.summary) + "</p>" +
              "  </div>" +
              '  <div class="card">' +
              '    <span class="meta-quiet">گام بعدی</span>' +
              '    <div style="font-weight:800;margin-top:4px;">فردا: ' + escapeHtml(lesson.tomorrow) + "</div>" +
              "  </div>" +
              '  <div class="card" style="background:var(--bg-subtle);font-size:0.86rem;color:var(--text-secondary);">' +
              '    <div style="font-weight:700;color:var(--text-primary);margin-bottom:4px;">منبع محتوا</div>' +
              '    <div>سازنده: ' + escapeHtml(lesson.sourceCreator) + " | مجوز: " + escapeHtml(lesson.sourceLicense) + "</div>" +
              "  </div>" +
              "</div>";
          }

          const isLastStep = sIdx === steps.length - 1;

          return (
            '<div class="modal-backdrop">' +
            '  <div class="modal-sheet" style="max-width:580px;max-height:92vh;display:flex;flex-direction:column;justify-content:space-between;overflow-y:auto;">' +
            '    <div>' +
            '      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;">' +
            '        <span style="font-weight:800;font-size:0.95rem;color:var(--accent-text);">' +
            escapeHtml(stepObj.title) +
            "</span>" +
            '        <button type="button" class="icon-btn" data-action="close-lesson" aria-label="بستن">' +
            ICONS.close +
            "</button>" +
            "      </div>" +
            '      <div class="progress-track" style="margin-bottom:20px;">' +
            '        <div class="progress-fill" style="width:' + progressPct + '%;"></div>' +
            "      </div>" +
            bodyHtml +
            "    </div>" +
            '    <div style="display:flex;gap:10px;margin-top:24px;padding-top:14px;border-top:1px solid var(--border-subtle);">' +
            (sIdx > 0
              ? '<button type="button" class="btn btn-secondary" style="flex:1;" data-action="lesson-prev-step">قبلی</button>'
              : "") +
            (isLastStep
              ? '<button type="button" class="btn btn-primary" style="flex:2;" data-action="complete-lesson">تموم شد</button>'
              : '<button type="button" class="btn btn-primary" style="flex:2;" data-action="lesson-next-step">بعدی</button>') +
            "    </div>" +
            "  </div>" +
            "</div>"
          );
        }

              '" data-action="switch-tab" data-tab="' +
              t.id +
              '">' +
              "  <span>" + t.icon + "</span>" +
              '  <span class="nav-label">' + t.label + "</span>" +
              "</button>";
          });

          return (
            '<div class="main-layout">' +
            '  <nav class="nav-bar" aria-label="ناوبری اصلی">' +
            navItemsHtml +
            "  </nav>" +
            '  <div class="workspace-column">' +
            '    <header class="top-header">' +
            '      <div>' +
            (tab === "home"
              ? '<h1 style="font-size:1.2rem;font-weight:800;">سلام ' + escapeHtml(greetingName) + " 👋</h1>"
              : '<h1 style="font-size:1.2rem;font-weight:800;">' + titles[tab] + "</h1>") +
            "      </div>" +
            '      <div style="display:flex;align-items:center;gap:10px;">' +
            '        <div style="display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--warm);font-size:0.95rem;" title="استریک روزانه">' +
            ICONS.flame +
            "          <span>" + toFa(state.streak.count) + " روز</span>" +
            "        </div>" +
            "      </div>" +
            "    </header>" +
            '    <main class="page-body">' +
            tabBody +
            "    </main>" +
            "  </div>" +
            "</div>" +
            renderLessonFlowModal() +
            renderAuxiliaryModals() +
            (ui.toastMessage
              ? '<div style="position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:var(--text-primary);color:var(--bg-surface);padding:10px 18px;border-radius:12px;font-size:0.9rem;font-weight:600;z-index:80;box-shadow:var(--shadow-md);">' +
                escapeHtml(ui.toastMessage) +
                "</div>"
              : "")
          );
        }

        function render() {
          const root = document.getElementById("app");
          if (!root) return;

          if (!state.onboarded) {
            root.innerHTML = renderOnboarding();
          } else {
            root.innerHTML = renderMainApp();
          }

          // Scroll advisor chat to bottom if active
          const chatEl = document.getElementById("advisor-chat-box");
          if (chatEl) {
            chatEl.scrollTop = chatEl.scrollHeight;
          }
        }

        // --- GLOBAL EVENT DELEGATION ---
        document.addEventListener("click", function (e) {
          const target = e.target.closest("[data-action]");
          if (!target) return;
          const action = target.getAttribute("data-action");

          if (action === "skip-splash") {
            state.onboardStep = 2;
            saveState();
            render();
            return;
          }

          if (action === "onboard-goto") {
            const nextStep = target.getAttribute("data-step");
            state.onboardStep = nextStep === "signin" ? "signin" : Number(nextStep);
            ui.soonInstrumentTapped = null;
            saveState();
            render();
            return;
          }

          if (action === "signin-guest") {
            state.onboardStep = 3;
            saveState();
            render();
            return;
          }

          if (action === "pick-instrument") {
            const isActive = target.getAttribute("data-active") === "true";
            const instName = target.getAttribute("data-inst");
            if (isActive) {
              state.preferences.instrument = instName;
              ui.soonInstrumentTapped = null;
              saveState();
              render();
            } else {
              ui.soonInstrumentTapped = instName;
              render();
            }
            return;
          }

          if (action === "start-with-piano") {
            state.preferences.instrument = "پیانو/کیبورد";
            ui.soonInstrumentTapped = null;
            state.onboardStep = 4;
            saveState();
            render();
            return;
          }

          if (action === "set-access") {
            state.preferences.access = target.getAttribute("data-val");
            saveState();
            render();
            return;
          }

          if (action === "set-experience") {
            state.preferences.experience = target.getAttribute("data-val");
            saveState();
            render();
            return;
          }

          if (action === "set-goal") {
            state.preferences.dailyGoal = Number(target.getAttribute("data-val"));
            saveState();
            render();
            return;
          }

          if (action === "toggle-motive") {
            const val = target.getAttribute("data-val");
            const idx = state.preferences.motivations.indexOf(val);
            if (idx >= 0) {
              state.preferences.motivations.splice(idx, 1);
            } else {
              state.preferences.motivations.push(val);
            }
            saveState();
            render();
            return;
          }

          if (action === "save-reminder-next") {
            const timeInput = document.getElementById("reminder-time-input");
            if (timeInput && timeInput.value) {
              state.preferences.reminderTime = timeInput.value;
            }
            state.onboardStep = 9;
            saveState();
            render();
            return;
          }

          if (action === "skip-reminder-next") {
            state.preferences.reminderTime = "";
            state.onboardStep = 9;
            saveState();
            render();
            return;
          }

          if (action === "finish-onboarding") {
            state.onboarded = true;
            ui.activeTab = "home";
            saveState();
            render();
            return;
          }

          // Main App Navigation
          if (action === "switch-tab") {
            ui.activeTab = target.getAttribute("data-tab");
            render();
            return;
          }

          // Open Lesson Intro
          if (action === "open-lesson") {
            const lid = Number(target.getAttribute("data-id"));
            ui.activeLessonModal = {
              lessonId: lid,
              mode: "intro",
              stepIndex: getSavedLessonStep(lid),
              quizState: {},
              skipQuizIndex: 0
            };
            render();
            return;
          }

          if (action === "tap-path-lesson") {
            const lid = Number(target.getAttribute("data-id"));
            const status = getLessonStatus(lid);
            if (status === "locked") {
              showToast("اول درس قبلی رو تموم کن تا این درس باز بشه.");
              return;
            }
            ui.activeLessonModal = {
              lessonId: lid,
              mode: "intro",
              stepIndex: getSavedLessonStep(lid),
              quizState: {},
              skipQuizIndex: 0
            };
            render();
            return;
          }

          if (action === "close-lesson") {
            if (ui.activeLessonModal && ui.activeLessonModal.mode === "steps") {
              setSavedLessonStep(ui.activeLessonModal.lessonId, ui.activeLessonModal.stepIndex);
            }
            ui.activeLessonModal = null;
            render();
            return;
          }

          if (action === "start-lesson-steps") {
            if (!ui.activeLessonModal) return;
            const lid = ui.activeLessonModal.lessonId;
            ui.activeLessonModal.mode = "steps";
            ui.activeLessonModal.stepIndex = getSavedLessonStep(lid);
            render();
            return;
          }

          if (action === "lesson-prev-step") {
            if (!ui.activeLessonModal) return;
            ui.activeLessonModal.stepIndex = Math.max(0, ui.activeLessonModal.stepIndex - 1);
            setSavedLessonStep(ui.activeLessonModal.lessonId, ui.activeLessonModal.stepIndex);
            render();
            return;
          }

          if (action === "lesson-next-step") {
            if (!ui.activeLessonModal) return;
            ui.activeLessonModal.stepIndex += 1;
            setSavedLessonStep(ui.activeLessonModal.lessonId, ui.activeLessonModal.stepIndex);
            render();
            return;
          }

          if (action === "toggle-self-check") {
            if (!ui.activeLessonModal) return;
            const idx = Number(target.getAttribute("data-idx"));
            toggleSelfCheckItem(ui.activeLessonModal.lessonId, idx);
            render();
            return;
          }

          if (action === "answer-step-quiz") {
            if (!ui.activeLessonModal) return;
            const qKey = Number(target.getAttribute("data-qkey"));
            const idx = Number(target.getAttribute("data-idx"));
            ui.activeLessonModal.quizState[qKey] = idx;
            render();
            return;
          }

          if (action === "retry-step-quiz") {
            if (!ui.activeLessonModal) return;
            const qKey = Number(target.getAttribute("data-qkey"));
            delete ui.activeLessonModal.quizState[qKey];
            render();
            return;
          }

          if (action === "complete-lesson") {
            if (!ui.activeLessonModal) return;
            const lid = ui.activeLessonModal.lessonId;
            ui.activeLessonModal = null;
            markLessonComplete(lid);
            render();
            return;
          }

          // «اینو بلدم» (Skip Quiz Flow)
          if (action === "start-skip-quiz") {
            if (!ui.activeLessonModal) return;
            ui.activeLessonModal.mode = "skipQuiz";
            ui.activeLessonModal.skipQuizIndex = 0;
            render();
            return;
          }

          if (action === "answer-skip-quiz") {
            if (!ui.activeLessonModal) return;
            const lesson = LESSONS.find(function (l) {
              return l.id === ui.activeLessonModal.lessonId;
            });
            const skipQuestions = lesson.quiz.slice(0, 2);
            const qIdx = ui.activeLessonModal.skipQuizIndex || 0;
            const chosen = Number(target.getAttribute("data-idx"));
            const currentQ = skipQuestions[qIdx];

            if (chosen !== currentQ.correctIndex) {
              // Failed -> show message «بهتره یه نگاه به این درس بندازی» and open lesson
              ui.activeLessonModal.mode = "skipFailed";
              render();
              return;
            }

            if (qIdx + 1 < skipQuestions.length) {
              ui.activeLessonModal.skipQuizIndex = qIdx + 1;
              render();
            } else {
              // Both correct -> mark done, short congrats, back to Path
              markLessonComplete(lesson.id);
              ui.activeLessonModal.mode = "skipSuccess";
              render();
            }
            return;
          }

          if (action === "finish-skip-to-path") {
            ui.activeLessonModal = null;
            ui.activeTab = "path";
            render();
            return;
          }

          // Advisor Chip
          if (action === "ask-chip") {
            const qText = target.getAttribute("data-q");
            handleAdvisorQuestion(qText);
            return;
          }

          // Library Section Switch
          if (action === "lib-sec") {
            ui.librarySection = target.getAttribute("data-sec");
            render();
            return;
          }

          // Profile Theme & Modals
          if (action === "set-theme") {
            state.preferences.theme = target.getAttribute("data-theme");
            saveState();
            applyTheme();
            render();
            return;
          }

          if (action === "open-account-modal") {
            ui.showAccountModal = true;
            render();
            return;
          }

          if (action === "open-about-modal") {
            ui.showAboutModal = true;
            render();
            return;
          }

          if (action === "open-reset-modal") {
            ui.showResetConfirmModal = true;
            render();
            return;
          }

          if (action === "close-aux-modal") {
            ui.showAccountModal = false;
            ui.showAboutModal = false;
            ui.showResetConfirmModal = false;
            render();
            return;
          }

          if (action === "dismiss-l1-signup") {
            ui.showLesson1SignupModal = false;
            render();
            return;
          }

          if (action === "confirm-reset-all") {
            try {
              window.localStorage.removeItem(STORAGE_KEY);
            } catch (err) {}
            state = getDefaultState();
            state.onboardStep = 2; // go directly to Welcome screen on reset
            ui.showResetConfirmModal = false;
            ui.activeLessonModal = null;
            ui.activeTab = "home";
            applyTheme();
            render();
            return;
          }
        });

        // Handle Form Submissions
        document.addEventListener("submit", function (e) {
          if (e.target.id === "signin-form") {
            e.preventDefault();
            const emailInput = document.getElementById("signin-email");
            if (emailInput && emailInput.value.trim()) {
              state.user.email = emailInput.value.trim();
            }
            state.onboardStep = 3;
            saveState();
            render();
            return;
          }

          if (e.target.id === "advisor-form") {
            e.preventDefault();
            const inp = document.getElementById("advisor-input");
            if (!inp || !inp.value.trim()) return;
            const q = inp.value.trim();
            inp.value = "";
            handleAdvisorQuestion(q);
            return;
          }

          if (e.target.id === "lesson1-signup-form") {
            e.preventDefault();
            const n = document.getElementById("l1-name");
            const em = document.getElementById("l1-email");
            if (n) state.user.name = n.value.trim();
            if (em) state.user.email = em.value.trim();
            ui.showLesson1SignupModal = false;
            saveState();
            showToast("مشخصاتت ذخیره شد.");
            render();
            return;
          }

          if (e.target.id === "account-form") {
            e.preventDefault();
            const n = document.getElementById("acc-name");
            const em = document.getElementById("acc-email");
            if (n) state.user.name = n.value.trim();
            if (em) state.user.email = em.value.trim();
            ui.showAccountModal = false;
            saveState();
            showToast("حساب کاربری به‌روزرسانی شد.");
            render();
            return;
          }
        });

        // Handle Select & Input Changes in Profile & Library
        document.addEventListener("input", function (e) {
          if (e.target.id === "library-search-input") {
            ui.librarySearch = e.target.value;
            const pos = e.target.selectionStart;
            render();
            const newInput = document.getElementById("library-search-input");
            if (newInput) {
              newInput.focus();
              try {
                newInput.setSelectionRange(pos, pos);
              } catch (err) {}
            }
            return;
          }

          if (e.target.id === "reminder-time-input") {
            state.preferences.reminderTime = e.target.value;
            saveState();
            render();
            return;
          }
        });

        document.addEventListener("change", function (e) {
          if (e.target.id === "prof-access") {
            state.preferences.access = e.target.value;
            saveState();
            showToast("دسترسی به ساز ذخیره شد.");
            render();
          } else if (e.target.id === "prof-goal") {
            state.preferences.dailyGoal = Number(e.target.value);
            saveState();
            showToast("هدف روزانه به‌روز شد.");
            render();
          } else if (e.target.id === "prof-reminder") {
            state.preferences.reminderTime = e.target.value;
            saveState();
            showToast("ساعت یادآور ذخیره شد.");
            render();
          }
        });

        function handleAdvisorQuestion(qText) {
          state.advisorMessages.push({ role: "user", text: qText });
          const reply = getAdvisorResponse(qText);
          if (reply) {
            if (reply.matched && !reply.isProgress) {
              state.advisorMessages.push({
                role: "advisor",
                cause: reply.cause,
                fix: reply.fix,
                lessonId: reply.lessonId
              });
            } else {
              state.advisorMessages.push({
                role: "advisor",
                text: reply.text,
                lessonId: reply.lessonId || null
              });
            }
          }
          saveState();
          render();
        }

        // Initial Render
        render();
      })();
    </script>
  </body>
</html>
