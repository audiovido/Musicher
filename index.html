      function refreshLessonPianoMount(autoCenterSmooth = true) {
        const mount = document.getElementById("vpiano-lesson-mount");
        if (!mount) return;
        const lesson = LESSONS.find((l) => l.id === Number(ui.activeLessonId)) || LESSONS[0];
        if (!lesson || !lesson.practice) return;
        const wrapper = document.createElement("div");
        wrapper.innerHTML = renderLessonPracticeCard(lesson);
        const newCard = wrapper.firstElementChild;
        if (newCard) {
          const oldScroll = mount.querySelector(".vpiano-scroll-wrap");
          const prevScrollLeft = oldScroll ? oldScroll.scrollLeft : 0;
          mount.replaceWith(newCard);
          const newScroll = newCard.querySelector(".vpiano-scroll-wrap");
          if (newScroll) {
            newScroll.style.scrollBehavior = "auto";
            newScroll.scrollLeft = prevScrollLeft;
            newScroll.style.scrollBehavior = "";
          }
          if (autoCenterSmooth) {
            requestAnimationFrame(() => centerTargetKeyInScroll(true));
          }
        }
      }

      function startPianoWatchDemo() {
        const lesson = LESSONS.find((l) => l.id === Number(ui.activeLessonId)) || LESSONS[0];
        if (!lesson || !lesson.practice || !Array.isArray(lesson.practice.notes)) return;
        stopPianoWatchDemo();

        const notes = lesson.practice.notes;
        const tempo = Number(lesson.practice.tempo) || 60;
        const beatMs = Math.max(350, Math.round((60 / tempo) * 1000));
        const pp = ui.pianoPractice;
        pp.watchPlaying = true;
        pp.watchActiveIdx = 0;
        refreshLessonPianoMount(true);

        notes.forEach((noteName, idx) => {
          const tOn = setTimeout(() => {
            if (!pp.watchPlaying) return;
            pp.watchActiveIdx = idx;
            refreshLessonPianoMount(false);
            playPianoNoteSound(noteName, Math.min(1.2, (beatMs / 1000) * 0.92));
            const keyEl = document.querySelector(`.vpiano-key[data-note="${noteName}"]`);
            if (keyEl) keyEl.classList.add("is-pressed");
            centerTargetKeyInScroll(true);
          }, idx * beatMs);

          const tOff = setTimeout(() => {
            const keyEl = document.querySelector(`.vpiano-key[data-note="${noteName}"]`);
            if (keyEl) keyEl.classList.remove("is-pressed");
          }, idx * beatMs + Math.round(beatMs * 0.78));

          pp.watchTimers.push(tOn, tOff);
        });

        const tEnd = setTimeout(() => {
          pp.watchPlaying = false;
          pp.watchActiveIdx = -1;
          pp.watchTimers = [];
          refreshLessonPianoMount(false);
        }, notes.length * beatMs + 80);

        pp.watchTimers.push(tEnd);
      }

      function handlePianoNoteTriggered(noteName) {
        if (!noteName || !VPIANO_ALL_BY_NOTE[noteName]) return;
        playPianoNoteSound(noteName);

        if (ui.screen !== "lesson" || ui.lessonStepIndex !== 0) return;
        const lesson = LESSONS.find((l) => l.id === Number(ui.activeLessonId)) || LESSONS[0];
        if (!lesson || !lesson.practice || !Array.isArray(lesson.practice.notes)) return;

        const notes = lesson.practice.notes;
        const pp = ui.pianoPractice;

        if (pp.tab === "follow") {
          if (pp.followDone) return;
          const targetNote = notes[pp.followIdx];
          if (!targetNote) return;

          if (noteName === targetNote) {
            // Correct key pressed: hide any previous wrong-key hint immediately and move to next target key
            pp.followHint = "";
            pp.followIdx += 1;
            if (pp.followIdx >= notes.length) {
              pp.followDone = true;
              pp.completedByLesson[lesson.id] = true;
              ui.selfCheckState[0] = true;
              ui.selfCheckState[1] = true;
            }
            refreshLessonPianoMount(true);
            const pressedNow = document.querySelector(`.vpiano-key[data-note="${noteName}"]`);
            if (pressedNow) {
              pressedNow.classList.add("is-pressed");
              setTimeout(() => pressedNow.classList.remove("is-pressed"), 220);
            }
          } else {
            // Wrong key pressed: show "One key higher / lower" hint and soft red flash, keep current scroll
            const pressedMidi = VPIANO_ALL_BY_NOTE[noteName]?.midi || 60;
            const targetMidi = VPIANO_ALL_BY_NOTE[targetNote]?.midi || 60;
            pp.followHint = pressedMidi < targetMidi ? "higher" : "lower";
            refreshLessonPianoMount(true);
            const wrongEl = document.querySelector(`.vpiano-key[data-note="${noteName}"]`);
            if (wrongEl) {
              wrongEl.classList.add("is-wrong-flash");
              setTimeout(() => wrongEl.classList.remove("is-wrong-flash"), 450);
            }
          }
        } else if (pp.tab === "own") {
          if (pp.ownStatus === "success") return;
          if (pp.ownStatus === "fail") {
            pp.ownPlayed = [];
            pp.ownStatus = "idle";
          }
          pp.ownPlayed.push(noteName);
          if (pp.ownPlayed.length >= notes.length) {
            const allMatch = notes.every((expected, i) => pp.ownPlayed[i] === expected);
            if (allMatch) {
              pp.ownStatus = "success";
              pp.completedByLesson[lesson.id] = true;
              ui.selfCheckState[0] = true;
              ui.selfCheckState[1] = true;
            } else {
              pp.ownStatus = "fail";
            }
          }
          refreshLessonPianoMount(false);
          const pressedNow = document.querySelector(`.vpiano-key[data-note="${noteName}"]`);
          if (pressedNow) {
            pressedNow.classList.add("is-pressed");
            setTimeout(() => pressedNow.classList.remove("is-pressed"), 220);
          }
        }
      }

      /* ==========================================================================
         FIRST-RUN ONBOARDING FLOW (Steps 1..7)
         ========================================================================== */
      function renderOnboardingScreen() {
        const step = state.onboardingStep || 1;
        const totalSteps = 7;

        const dotsHtml = Array.from({ length: totalSteps }, (_, idx) => {
          const s = idx + 1;
          const cls = s === step ? "active" : s < step ? "done" : "";
          return `<span class="progress-dot ${cls}"></span>`;
        }).join("");

        let stepContent = "";

        if (step === 1) {
          const instruments = [
            { id: "piano", active: true },
            { id: "guitar", active: false },
            { id: "tar", active: false },
            { id: "setar", active: false },
            { id: "santur", active: false },
            { id: "violin", active: false },
            { id: "voice", active: false }
          ];

          stepContent = `
            <h1 class="serif-heading" style="font-size:1.55rem;margin-bottom:16px;">${escapeHtml(t("onboarding.instTitle"))}</h1>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;">
              ${instruments
                .map((inst) => {
                  const isSelected = inst.active && state.instrument === "piano";
                  return `
                    <button type="button" class="m-card interactive" style="text-align:center;padding:16px 10px;border-color:${isSelected ? "var(--primary)" : "var(--border-color)"};background-color:${isSelected ? "var(--primary-soft)" : "var(--bg-elevated)"};" data-action="select-onboard-inst" data-inst="${inst.id}" data-active="${inst.active}">
                      <div style="width:44px;height:44px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;color:var(--ink);">
                        ${getInstrumentSvg(inst.id)}
                      </div>
                      <div style="font-weight:700;font-size:0.95rem;margin-bottom:6px;">${escapeHtml(t(`instruments.${inst.id}`))}</div>
                      <span class="badge-saffron" style="font-size:0.68rem;padding:3px 10px;background-color:${inst.active ? "var(--secondary)" : "var(--accent)"};color:${inst.active ? "#FFF" : "#1F1A2E"};">
                        ${escapeHtml(inst.active ? t("onboarding.instReady") : t("onboarding.instSoon"))}
                      </span>
                    </button>
                  `;
                })
                .join("")}
            </div>
            ${
              ui.pendingOtherInstrument
                ? `<div class="m-card surface-fill" style="margin-bottom:16px;border-color:var(--accent);">
                    <p style="font-size:0.9rem;margin-bottom:12px;font-weight:600;">${escapeHtml(t("onboarding.instSoonNote"))}</p>
                    <button type="button" class="btn-pill btn-primary btn-block" data-action="onboard-next">
                      ${escapeHtml(t("onboarding.instStartPianoBtn"))}
                    </button>
                  </div>`
                : `<button type="button" class="btn-pill btn-primary btn-block" data-action="onboard-next">
                    ${escapeHtml(t("onboarding.instContinuePianoBtn"))}
                  </button>`
            }
          `;
        } else if (step === 2) {
          const opts = [
            { id: "yes", label: t("onboarding.accessYes"), helper: t("onboarding.accessYesHelper") },
            { id: "phone", label: t("onboarding.accessPhone"), helper: t("onboarding.accessPhoneHelper") },
            { id: "no", label: t("onboarding.accessNo"), helper: t("onboarding.accessNoHelper") }
          ];
          const activeHelper = opts.find((o) => o.id === state.access)?.helper || "";

          stepContent = `
            <h1 class="serif-heading" style="font-size:1.55rem;margin-bottom:16px;">${escapeHtml(t("onboarding.accessTitle"))}</h1>
            ${opts
              .map(
                (o) => `
                  <button type="button" class="m-card choice-card ${state.access === o.id ? "selected" : ""}" data-action="set-onboard-field" data-field="access" data-value="${o.id}">
                    <span style="font-weight:700;">${escapeHtml(o.label)}</span>
                    <span>${state.access === o.id ? "●" : "○"}</span>
                  </button>
                `
              )
              .join("")}
            <div class="m-card surface-fill" style="margin:12px 0 20px;padding:12px 16px;font-size:0.88rem;color:var(--secondary);font-weight:600;">
              💡 ${escapeHtml(activeHelper)}
            </div>
            <button type="button" class="btn-pill btn-primary btn-block" data-action="onboard-next">
              ${escapeHtml(t("onboarding.continue"))}
            </button>
          `;
        } else if (step === 3) {
          const opts = [
            { id: "none", label: t("onboarding.expNone") },
            { id: "little", label: t("onboarding.expLittle") },
            { id: "notes", label: t("onboarding.expNotes") }
          ];
          const showSkipHelper = state.experience === "little" || state.experience === "notes";

          stepContent = `
            <h1 class="serif-heading" style="font-size:1.55rem;margin-bottom:16px;">${escapeHtml(t("onboarding.expTitle"))}</h1>
            ${opts
              .map(
                (o) => `
                  <button type="button" class="m-card choice-card ${state.experience === o.id ? "selected" : ""}" data-action="set-onboard-field" data-field="experience" data-value="${o.id}">
                    <span style="font-weight:700;">${escapeHtml(o.label)}</span>
                    <span>${state.experience === o.id ? "●" : "○"}</span>
                  </button>
                `
              )
              .join("")}
            ${
              showSkipHelper
                ? `<div class="m-card surface-fill" style="margin:12px 0 20px;padding:12px 16px;font-size:0.88rem;color:var(--secondary);font-weight:600;">
                    ✨ ${escapeHtml(t("onboarding.expSkipHelper"))}
                  </div>`
                : `<div style="height:12px;"></div>`
            }
            <button type="button" class="btn-pill btn-primary btn-block" data-action="onboard-next">
              ${escapeHtml(t("onboarding.continue"))}
            </button>
          `;
        } else if (step === 4) {
          const goals = [
            { val: 5, title: t("onboarding.goal5"), desc: t("onboarding.goal5Desc") },
            { val: 15, title: t("onboarding.goal15"), desc: t("onboarding.goal15Desc") },
            { val: 30, title: t("onboarding.goal30"), desc: t("onboarding.goal30Desc") }
          ];

          stepContent = `
            <h1 class="serif-heading" style="font-size:1.55rem;margin-bottom:16px;">${escapeHtml(t("onboarding.goalTitle"))}</h1>
            ${goals
              .map(
                (g) => `
                  <button type="button" class="m-card choice-card ${Number(state.dailyGoal) === g.val ? "selected" : ""}" data-action="set-onboard-field" data-field="dailyGoal" data-value="${g.val}">
                    <div>
                      <div style="font-weight:700;font-size:1rem;">${escapeHtml(g.title)}</div>
                      <div style="font-size:0.83rem;color:var(--muted);">${escapeHtml(g.desc)}</div>
                    </div>
                    <span>${Number(state.dailyGoal) === g.val ? "●" : "○"}</span>
                  </button>
                `
              )
              .join("")}
            <button type="button" class="btn-pill btn-primary btn-block" style="margin-top:14px;" data-action="onboard-next">
              ${escapeHtml(t("onboarding.continue"))}
            </button>
          `;
        } else if (step === 5) {
          const motives = [
            { id: "self", label: t("onboarding.motiveSelf") },
            { id: "song", label: t("onboarding.motiveSong") },
            { id: "pro", label: t("onboarding.motivePro") },
            { id: "child", label: t("onboarding.motiveChild") }
          ];
          const curM = state.motivations || [];

          stepContent = `
            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
              <h1 class="serif-heading" style="font-size:1.5rem;">${escapeHtml(t("onboarding.motiveTitle"))}</h1>
              <button type="button" style="color:var(--secondary);font-weight:700;font-size:0.88rem;text-decoration:underline;" data-action="onboard-next">${escapeHtml(t("onboarding.skip"))}</button>
            </div>
            <p style="font-size:0.88rem;color:var(--muted);margin-bottom:18px;">${escapeHtml(t("onboarding.motiveSub"))}</p>
            <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px;">
              ${motives
                .map((m) => {
                  const sel = curM.includes(m.id);
                  return `
                    <button type="button" class="chip-btn ${sel ? "selected" : ""}" data-action="toggle-motive" data-motive="${m.id}">
                      <span>${sel ? "✓" : "+"}</span>
                      <span>${escapeHtml(m.label)}</span>
                    </button>
                  `;
                })
                .join("")}
            </div>
            <button type="button" class="btn-pill btn-primary btn-block" data-action="onboard-next">
              ${escapeHtml(t("onboarding.continue"))}
            </button>
          `;
        } else if (step === 6) {
          stepContent = `
            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
              <h1 class="serif-heading" style="font-size:1.5rem;">${escapeHtml(t("onboarding.reminderTitle"))}</h1>
              <button type="button" style="color:var(--secondary);font-weight:700;font-size:0.88rem;text-decoration:underline;" data-action="skip-reminder">${escapeHtml(t("onboarding.later"))}</button>
            </div>
            <p style="font-size:0.88rem;color:var(--muted);margin-bottom:18px;">${escapeHtml(t("onboarding.reminderSub"))}</p>
            <div class="m-card" style="margin-bottom:20px;text-align:center;">
              <label style="display:block;font-size:0.85rem;font-weight:700;color:var(--muted);margin-bottom:10px;">
                ${escapeHtml(t("onboarding.reminderLabel"))}
              </label>
              <input type="time" id="onboard-reminder-input" class="m-input" style="max-width:180px;margin:0 auto;text-align:center;font-size:1.25rem;font-weight:700;" value="${escapeHtml(state.reminderTime || "19:00")}" />
            </div>
            <button type="button" class="btn-pill btn-primary btn-block" data-action="save-onboard-reminder">
              ${escapeHtml(t("onboarding.reminderSaveBtn"))}
            </button>
          `;
        } else {
          const accessLabel =
            state.access === "yes"
              ? t("onboarding.accessYes")
              : state.access === "phone"
              ? t("onboarding.accessPhone")
              : t("onboarding.accessNo");

          stepContent = `
            <div class="m-card" style="text-align:center;padding:24px 18px;">
              <div style="width:136px;margin:0 auto 14px;">
                ${renderArchPlaceholder({ imageUrl: ASSETS.todayPlan, ratio: "compact", uid: "summary" })}
              </div>
              <h1 class="serif-heading" style="font-size:1.5rem;margin-bottom:8px;">${escapeHtml(t("onboarding.summaryTitle"))}</h1>
              <p style="font-size:0.95rem;color:var(--secondary);font-weight:700;margin-bottom:18px;">
                ${escapeHtml(t("onboarding.summaryPlanLine", { goal: state.dailyGoal }))}
              </p>

      /* ==========================================================================
         MOBILE HOME SCREEN (MOCKUP 1)

         - Weekly streak dots + Progress card with teal percentage pill inside bar
         - Bottom nav with 5 line icons

      function getNextUnlockedLesson() {
        for (const lesson of LESSONS) {
          if (!state.completedLessons.includes(lesson.id)) {
            return lesson;
          }
        }
        return null;
      }

      function renderHomeScreen() {
        const displayName = state.userName ? state.userName : t("home.defaultName");
        const nextLesson = getNextUnlockedLesson();
        const totalLessons = LESSONS.length || 24;
        const doneCount = state.completedLessons.length;
        const pct = Math.round((doneCount / totalLessons) * 100);
        const currentChapterLesson = nextLesson || LESSONS[LESSONS.length - 1];
        const currentChapterTitle = currentChapterLesson ? lField(currentChapterLesson.chapter) : "";

        // Weekly streak dots (7 days)
        const dayLabels = t("home.weekDays");
        const todayKey = getLocalDateKey();
        const weekSatKey = getWeekKey(todayKey);
        const satDate = parseDateKey(weekSatKey);

        const weekDotsHtml = Array.from({ length: 7 }, (_, i) => {
          const d = new Date(satDate.getFullYear(), satDate.getMonth(), satDate.getDate() + i);
          const dKey = getLocalDateKey(d);
          const isDone = state.activeDaysHistory.includes(dKey);
          const isToday = dKey === todayKey;
          const lbl = Array.isArray(dayLabels) ? dayLabels[i] : "";
          const dotClass = isDone ? "active" : isToday ? "today-dot" : "";
          return `
            <div class="week-day-col">
              <span>${escapeHtml(lbl)}</span>
              <span class="week-dot ${dotClass}"></span>
            </div>
          `;
        }).join("");

        const streakCount = state.streakCount || 0;
        const hasStreak = streakCount >= 1;
        const hasEverCompleted =
          (Array.isArray(state.completedLessons) && state.completedLessons.length > 0) ||
          Boolean(state.lastCompletedDate);
        const weeklyStreakText =
          !hasEverCompleted || !hasStreak
            ? t("home.streakStartHint")
            : isFreeDayUsedThisWeek()
            ? `${t("home.freeDayUsed")} 🔥`
            : `${t("home.freeDayAvailable")} 🔥`;

        const rawGreetingTpl = String(t("home.greeting", { name: "__NAME_TOKEN__" }));
        const greetingParts = rawGreetingTpl.split("__NAME_TOKEN__");
        const greetingHtml =
          greetingParts.length > 1
            ? `${escapeHtml(greetingParts[0])}<span class="saffron-accent">${escapeHtml(displayName)}</span>${escapeHtml(greetingParts.slice(1).join(""))}`
            : `<span class="saffron-accent">${escapeHtml(t("home.greeting", { name: displayName }))}</span>`;

        return `

                ${escapeHtml(t("nav.langToggle"))}
              </button>
            </header>

            <main class="screen-body">

                  <h1 class="home-greeting-title">${greetingHtml}</h1>
                  <p class="home-greeting-sub">${escapeHtml(t("home.subtitle"))}</p>
                </div>
                <div class="streak-pill-wrap" title="Streak">

                    ${
                      hasStreak

                  </div>
                </div>
              </div>

              <!-- Responsive 2-Column Home Layout on Desktop (>=1100px):

                   Right/End: Weekly streak, Progress, and Quick Advisor stacked -->
              <div class="home-layout-grid">
                <div class="home-col-main">
                  <!-- TODAY'S PLAN Card (Mockup 1) -->
                  <section class="m-card todays-plan-card">
                    <div class="kicker-staff-row">
                      <span class="kicker-label">${escapeHtml(t("home.todaysPlanKicker"))}</span>
                      <div class="staff-5lines-bar"></div>
                    </div>

                    <!-- Subtle traditional wave/cloud watermark in bottom corner (Mockup 1) -->
                    <svg class="todays-plan-clouds" viewBox="0 0 180 80" fill="none" aria-hidden="true">
                      <path d="M 0 80 A 28 28 0 0 1 56 80 M 8 80 A 20 20 0 0 1 48 80 M 44 80 A 32 32 0 0 1 108 80 M 54 80 A 22 22 0 0 1 98 80 M 96 80 A 26 26 0 0 1 148 80" stroke="var(--ink)" stroke-width="1.3" />
                    </svg>

                    ${

                            <div style="min-width:0;">
                              <div class="todays-plan-meta">
                                <span class="lesson-num-badge">${escapeHtml(t("lesson.kicker", { id: nextLesson.id }))}</span>

                              </div>
                              <h2 class="todays-plan-title">${escapeHtml(lField(nextLesson.title))}</h2>
                              <div>
                                <button type="button" class="btn-pill btn-primary" data-action="open-lesson" data-lesson-id="${nextLesson.id}">
                                  <span>${escapeHtml(t("home.startLessonBtn"))}</span>
                                  <span class="dir-flip">▶</span>
                                </button>
                              </div>
                            </div>
                            <div style="min-width:0;">
                              ${renderArchPlaceholder({
                                imageUrl: nextLesson.imageUrl || ASSETS.todayPlan,
                                ratio: "compact",
                                uid: "home-today"
                              })}
                            </div>
                          </div>`
                        : `<div style="position:relative;z-index:2;">
                            <p style="font-size:0.95rem;margin-bottom:14px;font-weight:600;">
                              🎉 ${escapeHtml(t("home.allDoneText", { total: totalLessons }))}
                            </p>
                            <button type="button" class="btn-pill btn-primary" data-action="open-lesson" data-lesson-id="1">
                              ${escapeHtml(t("home.reviewFromFirstBtn"))}
                            </button>
                          </div>`
                    }
                  </section>

                  <!-- Decorative 5-Line Curved Music Staff Divider (Mockup 1) -->
                  ${renderHomeStaffDivider()}
                </div>

                <div class="home-col-side">
                  <!-- Weekly Streak & Progress Grid (2 cols on tablet, stacked on desktop right col) -->
                  <div class="home-stats-grid">
                    <div class="m-card" style="padding:16px;min-width:0;">
                      <h3 class="stat-card-title">${escapeHtml(t("home.weeklyStreakTitle"))}</h3>
                      <div class="week-dots-row">
                        ${weekDotsHtml}
                      </div>
                      <p style="font-size:0.82rem;color:var(--ink);font-weight:500;">
                        ${escapeHtml(weeklyStreakText)}
                      </p>
                    </div>

                    <div class="m-card interactive" style="padding:16px;min-width:0;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;" data-action="nav-tab" data-tab="path">
                      <div style="min-width:0;">
                        <h3 class="stat-card-title">${escapeHtml(t("home.progressTitle"))}</h3>
                        <p style="font-size:0.9rem;color:var(--ink);margin-bottom:2px;">
                          ${escapeHtml(t("home.progressCount", { done: doneCount, total: totalLessons }))}
                        </p>
                        <p style="font-size:0.84rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                          ${escapeHtml(currentChapterTitle)}
                        </p>
                      </div>
                      <div class="progress-bar-row">
                        <div class="progress-pill-track">
                          ${
                            pct > 0
                              ? `<div class="progress-pill-fill" style="width:${pct}%;">
                                  ${pct >= 25 ? `${toLocaleDigits(pct)}%` : ""}
                                </div>`
                              : ""
                          }
                        </div>
                        ${pct < 25 ? `<span class="progress-pct-outside">${toLocaleDigits(pct)}%</span>` : ""}
                      </div>
                    </div>
                  </div>

                  <!-- Quick Advisor Card -->
                  <button type="button" class="m-card surface-fill interactive" style="width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:start;padding:16px 18px;min-height:64px;" data-action="nav-tab" data-tab="advisor">
                    <div style="min-width:0;">
                      <div style="font-weight:700;font-size:0.95rem;">${escapeHtml(t("home.askAdvisorTitle"))}</div>
                      <div style="font-size:0.82rem;color:var(--muted);">${escapeHtml(t("home.askAdvisorSub"))}</div>
                    </div>
                    <span style="font-weight:700;color:var(--secondary);white-space:nowrap;">${escapeHtml(t("home.askAdvisorAction"))}</span>
                  </button>
                </div>
              </div>
            </main>

            ${renderBottomNav("home")}
          </div>
        `;
      }

      /* ==========================================================================
         MOBILE LEARNING PATH SCREEN (MOCKUP 4)
         - Chapter headings
         - Lesson cards with line-art instrument/music icons, teal checkmarks,
           pomegranate border + saffron "NOW" badge on current lesson, padlock on locked
         - Decorative 5-line staves with colored notes & pomegranates between chapters
         ========================================================================== */
      function renderPathScreen() {
        const nextLesson = getNextUnlockedLesson();
        const currentLessonId = nextLesson ? nextLesson.id : -1;

        const chapters = [];
        for (const lesson of LESSONS) {
          const chName = lField(lesson.chapter);
          let group = chapters.find((c) => c.name === chName);
          if (!group) {
            group = { name: chName, lessons: [] };
            chapters.push(group);
          }
          group.lessons.push(lesson);
        }

        const iconCycle = ["drum", "keyboard", "setar", "piano", "tar", "santur", "violin"];

        const chaptersHtml = chapters
          .map((ch, chIdx) => {
            const cards = ch.lessons
              .map((lesson) => {
                const isDone = state.completedLessons.includes(lesson.id);
                const isCurrent = lesson.id === currentLessonId;
                const isUnlocked =
                  isDone ||
                  isCurrent ||
                  state.completedLessons.includes(lesson.id - 1) ||
                  lesson.id === 1;
                const statusClass = isCurrent ? "current" : !isUnlocked ? "locked" : "";
                const iconKey = iconCycle[(lesson.id - 1) % iconCycle.length];

                let statusBadge = "";
                if (isDone) {
                  statusBadge = `<span class="path-status-circle done" title="${escapeHtml(t("path.statusDone"))}">✓</span>`;
                } else if (isCurrent) {
                  statusBadge = `<span class="path-status-circle current" title="${escapeHtml(t("path.statusCurrent"))}"><span class="dir-flip">▶</span></span>`;
                } else {
                  statusBadge = `
                    <span class="path-status-circle locked" title="${escapeHtml(t("path.statusLocked"))}">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2Zm-7-2a2 2 0 1 1 4 0v2h-4V7Z"/></svg>
                    </span>
                  `;
                }

                return `
                  <button type="button" class="m-card path-lesson-card ${statusClass}" data-action="path-lesson-tap" data-lesson-id="${lesson.id}" data-unlocked="${isUnlocked}">
                    ${
                      isCurrent
                        ? `<div class="panel-girih path-now-strip">
                            <span class="saffron-accent" aria-hidden="true">♪</span>
                            <span class="saffron-accent">${escapeHtml(t("path.statusCurrent"))}</span>
                          </div>`
                        : ""
                    }
                    <div class="path-icon-box">
                      ${renderArchPlaceholder({
                        imageUrl: lesson.imageUrl || getDefaultLessonImage(lesson.id),
                        ratio: "compact",
                        uid: `path-lesson-${lesson.id}`
                      })}
                    </div>
                    <div style="flex:1;min-width:0;">
                      <div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:5px;">
                        <span class="lesson-num-badge">${escapeHtml(t("lesson.kicker", { id: lesson.id }))}</span>
                        <span style="font-size:0.8rem;color:var(--muted);font-weight:500;">
                          · ${toLocaleDigits(lesson.minutes)} ${escapeHtml(t("path.minutesUnit"))}
                        </span>
                      </div>
                      <div class="serif-heading" style="font-size:1.12rem;font-weight:600;">
                        ${escapeHtml(lField(lesson.title))}
                      </div>
                    </div>
                    ${statusBadge}
                  </button>
                `;
              })
              .join("");

            return `
              <section class="chapter-block">
                <h2 class="chapter-heading serif-heading">${escapeHtml(ch.name)}</h2>
                <div class="chapter-lessons-grid">
                  ${cards}
                </div>
                ${chIdx < chapters.length - 1 ? renderStaffDividerWithPomegranates() : ""}
              </section>
            `;
          })
          .join("");

        return `
          <div class="mobile-shell">
            <header class="mobile-topbar">
              <div class="brand-logo">MUSICHER</div>
              <button type="button" class="lang-switch-pill" style="min-height:44px;padding:6px 12px;font-size:0.78rem;" data-action="toggle-lang">
                ${escapeHtml(t("nav.langToggle"))}
              </button>
            </header>
            <main class="screen-body">
              <h1 class="serif-heading" style="font-size:clamp(1.65rem, 2.5vw, 2.15rem);margin-bottom:18px;">${escapeHtml(t("path.title"))}</h1>
              ${chaptersHtml}
            </main>
            ${renderBottomNav("path")}
          </div>
        `;
      }

      /* ==========================================================================
         MOBILE LESSON SCREEN (MOCKUP 5)
         - Top progress bar + close button
         - Small "LESSON 1" label in teal caps
         - Centered serif title
         - Shouldered Persian ogee arch frame with italic caption
         - "PRACTICE STEPS" heading with 5-line staff decoration
         - Note-head bullets (1, 2, 3)
         - Red "Next ↗" pill and underlined "I know this"
         ========================================================================== */
      function renderCornerOrnamentSvg(posClass) {
        return `
          <svg class="lesson-corner-ornament ${posClass}" viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <path d="M 38 2 A 22 22 0 0 1 16 24" stroke="#1F6F6B" stroke-width="1.4" stroke-linecap="round" opacity="0.55" />
            <path d="M 38 8 A 14 14 0 0 1 24 22" stroke="#F2B33D" stroke-width="1.6" stroke-linecap="round" opacity="0.75" />
            <circle cx="33" cy="7" r="2.2" fill="#F2B33D" opacity="0.85" />
          </svg>
        `;
      }

      function renderLessonScreen() {
        const lesson = LESSONS.find((l) => l.id === Number(ui.activeLessonId)) || LESSONS[0];
        if (!lesson) return renderHomeScreen();

        const stepIdx = ui.lessonStepIndex; // 0..4
        const totalSteps = 5;
        const pct = Math.round(((stepIdx + 1) / totalSteps) * 100);

        const stepsArr = lField(lesson.steps) || [];
        const checksArr = lField(lesson.selfCheck) || [];
        const quizzes = lesson.quiz || [];

        let rightColHtml = "";

        if (stepIdx === 0) {
          // Step 0: See & Hear (+ optional keyboard diagram) + Practice Steps + Next + I know this
          rightColHtml = `
            <div class="kicker-staff-row" style="margin-top:6px;">
              <span class="kicker-label underlined">${escapeHtml(t("lesson.stepSeeTitle"))}</span>
              <div class="staff-5lines-bar"></div>
            </div>

            <div class="m-card" style="margin-bottom:18px;">
              <p style="font-size:0.96rem;line-height:1.6;">${formatBidiText(lField(lesson.see))}</p>
              ${lesson.diagram ? drawKeyboard(lesson.diagram) : ""}
            </div>

            <!-- PRACTICE STEPS Heading with 5-Line Staff Bar (Mockup 5) -->
            <div class="kicker-staff-row" style="margin-top:6px;">
              <span class="kicker-label underlined">${escapeHtml(t("lesson.stepPracticeTitle"))}</span>
              <div class="staff-5lines-bar"></div>
            </div>

            <!-- Note-Head Numbered Steps (Mockup 5) -->
            <ol class="practice-steps-list">
              ${stepsArr
                .map(
                  (st, idx) => `
                    <li class="practice-step-item">
                      ${renderEighthNoteBadge(idx + 1)}
                      <span style="padding-top:3px;">${escapeHtml(st)}</span>
                    </li>
                  `
                )
                .join("")}
            </ol>

            <!-- Interactive Virtual Piano Practice Mode (shown when lesson.practice exists) -->
            ${
              lesson.practice
                ? renderLessonPracticeCard(lesson)
                : `<div style="margin-bottom:16px;text-align:end;">
                    <button type="button" class="vpiano-pill-btn" data-action="open-free-piano">
                      <span>🎹</span>
                      <span>${escapeHtml(t("piano.openFreePlayBtn"))}</span>
                    </button>
                  </div>`
            }

            <!-- Red "Next ↗" Pill & Underlined "I know this" (Mockup 5) -->
            <button type="button" class="btn-pill btn-primary btn-block" style="min-height:54px;font-size:1.08rem;font-family:var(--font-heading);" data-action="lesson-next-step">
              <span>${escapeHtml(t("lesson.nextBtn"))}</span>
              <span>↗</span>
            </button>

            <div style="text-align:center;margin-top:12px;">
              <button type="button" style="min-height:44px;display:inline-flex;align-items:center;font-family:var(--font-heading);font-weight:600;font-size:1.02rem;color:var(--ink);" data-action="start-skip-quiz" data-lesson-id="${lesson.id}">
                <span style="padding-bottom:2px;border-bottom:1.5px solid var(--ink);">${escapeHtml(t("lesson.skipBtn"))}</span>
              </button>
            </div>
          `;
        } else if (stepIdx === 1) {
          // Step 1: See & Hear + Self-Check
          rightColHtml = `
            <div class="kicker-staff-row">
              <span class="kicker-label underlined">${escapeHtml(t("lesson.stepSeeTitle"))}</span>
              <div class="staff-5lines-bar"></div>
            </div>

            <div class="m-card" style="margin-bottom:20px;">
              <p style="font-size:0.98rem;line-height:1.6;">${formatBidiText(lField(lesson.see))}</p>
              ${lesson.diagram ? drawKeyboard(lesson.diagram) : ""}
            </div>

            <div class="kicker-staff-row">
              <span class="kicker-label underlined">${escapeHtml(t("lesson.stepSelfCheckTitle"))}</span>
              <div class="staff-5lines-bar"></div>
            </div>
            <p style="font-size:0.86rem;color:var(--muted);margin-bottom:10px;">${escapeHtml(t("lesson.selfCheckHint"))}</p>
            <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:22px;">
              ${checksArr
                .map((chk, idx) => {
                  const checked = !!ui.selfCheckState[idx];
                  return `
                    <button type="button" class="m-card choice-card ${checked ? "selected" : ""}" style="margin-bottom:0;" data-action="toggle-self-check" data-index="${idx}">
                      <span style="font-weight:600;font-size:0.94rem;">${escapeHtml(chk)}</span>
                      <span style="font-weight:700;">${checked ? "☑" : "☐"}</span>
                    </button>
                  `;
                })
                .join("")}
            </div>

            <div style="display:flex;gap:10px;">
              <button type="button" class="btn-pill btn-surface" data-action="lesson-prev-step">${escapeHtml(t("lesson.prevBtn"))}</button>
              <button type="button" class="btn-pill btn-primary" style="flex:1;" data-action="lesson-next-step">
                <span>${escapeHtml(t("lesson.nextBtn"))}</span>
                <span>↗</span>
              </button>
            </div>
          `;
        } else if (stepIdx === 2 || stepIdx === 3) {
          // Step 2 & 3: Mini-Quiz Q1 & Q2
          const qIndex = stepIdx - 2;
          const qObj = quizzes[qIndex] || quizzes[0];
          const qText = lField(qObj.question);
          const qOptions = lField(qObj.options) || [];

          rightColHtml = `
            <div class="kicker-staff-row">
              <span class="kicker-label underlined">${escapeHtml(t("lesson.stepQuizTitle", { current: qIndex + 1, total: quizzes.length }))}</span>
              <div class="staff-5lines-bar"></div>
            </div>
            <h2 class="serif-heading" style="font-size:clamp(1.28rem, 1.8vw, 1.5rem);margin-bottom:16px;">${escapeHtml(qText)}</h2>

            <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:18px;">
              ${qOptions
                .map((opt, idx) => {
                  const isSel = ui.quizSelected === idx;
                  let borderStyle = "";
                  if (ui.quizAnswered && isSel) {
                    borderStyle = ui.quizIsRight
                      ? "border-color:var(--secondary);background-color:var(--secondary-soft);"
                      : "border-color:var(--primary);background-color:var(--primary-soft);";
                  }
                  return `
                    <button type="button" class="m-card choice-card" style="margin-bottom:0;${borderStyle}" data-action="answer-lesson-quiz" data-q-index="${qIndex}" data-opt-index="${idx}">
                      <span style="font-weight:700;">${escapeHtml(opt)}</span>
                      <span>${
                        ui.quizAnswered && isSel
                          ? ui.quizIsRight
                            ? escapeHtml(t("lesson.quizRightBadge"))
                            : escapeHtml(t("lesson.quizWrongBadge"))
                          : "○"
                      }</span>
                    </button>
                  `;
                })
                .join("")}
            </div>

      function findAdvisorReply(queryText) {
        const norm = String(queryText || "").trim().toLowerCase();
        for (const item of MISTAKES) {
          const matched = (item.keywords || []).some((kw) => norm.includes(String(kw).toLowerCase()));
          if (matched) {
            return {
              found: true,
              cause: lField(item.cause),
              fix: lField(item.fix),
              lessonId: item.lessonId
            };
          }
        }
        return { found: false };
      }

      /* ==========================================================================
         MAIN RENDER & EVENT HANDLERS
         ========================================================================== */
      function render() {
        applyDocumentLangAndTheme();
        const root = document.getElementById("app-root");
        if (!root) return;

        let screenHtml = "";
        switch (ui.screen) {
          case "splash":
            screenHtml = renderSplashScreen();
            break;
          case "welcome":
            screenHtml = renderWelcomeScreen();
            break;
          case "signin":
            screenHtml = renderSignInScreen();
            break;
          case "onboarding":
            screenHtml = renderOnboardingScreen();
            break;
          case "home":
            screenHtml = renderHomeScreen();
            break;
          case "path":
            screenHtml = renderPathScreen();
            break;
          case "lesson":
            screenHtml = renderLessonScreen();
            break;
          case "skipQuiz":
            screenHtml = renderSkipQuizScreen();
            break;
          case "advisor":
            screenHtml = renderAdvisorScreen();
            break;
          case "library":
            screenHtml = renderLibraryScreen();
            break;
          case "profile":
            screenHtml = renderProfileScreen();
            break;
          default:
            screenHtml = renderHomeScreen();
        }

        const toastHtml = ui.toastMessage
          ? `<div class="toast-banner" role="status">${escapeHtml(ui.toastMessage)}</div>`
          : "";

        root.innerHTML = screenHtml + renderModal() + toastHtml;
        requestAnimationFrame(() => centerTargetKeyInScroll(false));
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && ui.modal) {
          ui.modal = null;
          render();
        }
      });

      document.addEventListener("click", (e) => {
        if (ui.modal && e.target && e.target.classList && e.target.classList.contains("modal-backdrop")) {
          ui.modal = null;
          render();
          return;
        }
        const btn = e.target.closest("[data-action]");
        if (!btn) return;
        const action = btn.getAttribute("data-action");

        switch (action) {
          case "toggle-lang":
            toggleLanguage();
            break;

          case "set-lang": {
            const newLang = btn.getAttribute("data-lang");
            if (newLang === "en" || newLang === "fa") {
              state.lang = newLang;
              saveState();
              render();
            }
            break;
          }

          case "start-onboarding":
            state.onboardingStep = 1;
            ui.pendingOtherInstrument = null;
            ui.screen = "onboarding";
            saveState();
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
            break;

          case "go-signin":
            ui.screen = "signin";
            render();
            break;

          case "back-to-welcome":
            ui.screen = "welcome";
            render();
            break;

          case "continue-guest":
            state.isGuest = true;
            ui.screen = state.onboardingComplete ? "home" : "onboarding";
            saveState();
            render();
            break;

          case "onboard-back":
            if (state.onboardingStep > 1) {
              state.onboardingStep -= 1;
              saveState();
              render();
            } else {
              ui.screen = "welcome";
              render();
            }
            break;

          case "select-onboard-inst": {
            const isAct = btn.getAttribute("data-active") === "true";
            if (isAct) {
              state.instrument = "piano";
              ui.pendingOtherInstrument = null;
            } else {
              ui.pendingOtherInstrument = btn.getAttribute("data-inst");
            }
            saveState();
            render();
            break;
          }

          case "onboard-next":
            state.instrument = "piano";
            ui.pendingOtherInstrument = null;
            if (state.onboardingStep < 7) {
              state.onboardingStep += 1;
            }
            saveState();
            render();
            break;

          case "set-onboard-field": {
            const field = btn.getAttribute("data-field");
            const val = btn.getAttribute("data-value");
            state[field] = field === "dailyGoal" ? Number(val) : val;
            saveState();
            render();
            break;
          }

          case "toggle-motive": {
            const m = btn.getAttribute("data-motive");
            const list = state.motivations || [];
            if (list.includes(m)) {
              state.motivations = list.filter((x) => x !== m);
            } else {
              state.motivations = [...list, m];
            }
            saveState();
            render();
            break;
          }

          case "save-onboard-reminder": {
            const inp = document.getElementById("onboard-reminder-input");
            if (inp && inp.value) state.reminderTime = inp.value;
            state.onboardingStep = 7;
            saveState();
            render();
            break;
          }

          case "skip-reminder":
            state.reminderTime = "";
            state.onboardingStep = 7;
            saveState();
            render();
            break;

          case "finish-onboarding":
            state.onboardingComplete = true;
            ui.screen = "home";
            saveState();
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
            break;

          case "nav-tab": {
            stopPianoWatchDemo();
            const tab = btn.getAttribute("data-tab");
            ui.screen = tab;
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
            break;
          }

          case "open-lesson": {
            stopPianoWatchDemo();
            const lid = Number(btn.getAttribute("data-lesson-id")) || 1;
            ui.activeLessonId = lid;
            ui.lessonStepIndex = 0;
            ui.selfCheckState = {};
            ui.quizSelected = null;
            ui.quizAnswered = false;
            ui.pianoPractice.lessonId = null;
            ui.screen = "lesson";
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
            break;
          }

          case "path-lesson-tap": {
            const unlocked = btn.getAttribute("data-unlocked") === "true";
            const lid = Number(btn.getAttribute("data-lesson-id"));
            if (!unlocked) {
              showToast(t("path.lockedToast"));
              return;
            }
            stopPianoWatchDemo();
            ui.activeLessonId = lid;
            ui.lessonStepIndex = 0;
            ui.selfCheckState = {};
            ui.quizSelected = null;
            ui.quizAnswered = false;
            ui.pianoPractice.lessonId = null;
            ui.screen = "lesson";
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
            break;
          }

          case "close-lesson":
            stopPianoWatchDemo();
            ui.screen = "home";
            render();
            break;

          case "lesson-next-step":
            stopPianoWatchDemo();
            ui.lessonStepIndex = Math.min(4, ui.lessonStepIndex + 1);
            ui.quizSelected = null;
            ui.quizAnswered = false;
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
            break;

          case "lesson-prev-step":
            stopPianoWatchDemo();
            ui.lessonStepIndex = Math.max(0, ui.lessonStepIndex - 1);
            ui.quizSelected = null;
            ui.quizAnswered = false;
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
            break;

          case "vpiano-unlock-audio":
            unlockPianoAudio();
            playPianoNoteSound("C4", 0.5);
            break;

          case "vpiano-toggle-labels":
            ui.pianoShowLabels = !ui.pianoShowLabels;
            if (ui.screen === "lesson" && document.getElementById("vpiano-lesson-mount")) {
              refreshLessonPianoMount();
            } else {
              render();
            }
            break;

          case "vpiano-set-tab": {
            const newTab = btn.getAttribute("data-tab") || "follow";
            stopPianoWatchDemo();
            ui.pianoPractice.tab = newTab;
            ui.pianoPractice.followIdx = 0;
            ui.pianoPractice.followHint = "";
            ui.pianoPractice.followDone = false;
            ui.pianoPractice.ownPlayed = [];
            ui.pianoPractice.ownStatus = "idle";
            refreshLessonPianoMount();
            if (newTab === "watch") {
              startPianoWatchDemo();
            }
            break;
          }

          case "vpiano-watch-toggle":
            if (ui.pianoPractice.watchPlaying) {
              stopPianoWatchDemo();
              refreshLessonPianoMount();
            } else {
              startPianoWatchDemo();
            }
            break;

          case "vpiano-reset-mode":
            stopPianoWatchDemo();
            ui.pianoPractice.followIdx = 0;
            ui.pianoPractice.followHint = "";
            ui.pianoPractice.followDone = false;
            ui.pianoPractice.ownPlayed = [];
            ui.pianoPractice.ownStatus = "idle";
            refreshLessonPianoMount();
            break;

          case "open-free-piano":
            stopPianoWatchDemo();
            ui.screen = "library";
            ui.libraryTab = "piano";
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
            break;

          case "toggle-self-check": {
            const idx = Number(btn.getAttribute("data-index"));
            ui.selfCheckState[idx] = !ui.selfCheckState[idx];
            render();
            break;
          }

          case "answer-lesson-quiz": {
            const qIdx = Number(btn.getAttribute("data-q-index"));
            const optIdx = Number(btn.getAttribute("data-opt-index"));
            const lesson = LESSONS.find((l) => l.id === Number(ui.activeLessonId)) || LESSONS[0];
            const qObj = lesson.quiz?.[qIdx];
            ui.quizSelected = optIdx;
            ui.quizAnswered = true;
            ui.quizIsRight = qObj ? optIdx === Number(qObj.correctIndex) : true;
            render();
            break;
          }

          case "complete-and-go-home": {
            stopPianoWatchDemo();
            const lid = Number(btn.getAttribute("data-lesson-id"));
            const nameInp = document.getElementById("l1-name-input");
            const emailInp = document.getElementById("l1-name-input") ? document.getElementById("l1-email-input") : null;
            if (nameInp && nameInp.value.trim()) {
              state.userName = nameInp.value.trim();
              state.isGuest = false;
            }
            if (emailInp && emailInp.value.trim()) {
              state.userEmail = emailInp.value.trim();
            }
            recordLessonCompletion(lid);
            ui.screen = "home";
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
            break;
          }

          case "complete-and-exit-lesson": {
            stopPianoWatchDemo();
            const lid = Number(btn.getAttribute("data-lesson-id"));
            const nameInp = document.getElementById("l1-name-input");
            const emailInp = document.getElementById("l1-email-input");
            if (nameInp && nameInp.value.trim()) {
              state.userName = nameInp.value.trim();
              state.isGuest = false;
            }
            if (emailInp && emailInp.value.trim()) {
              state.userEmail = emailInp.value.trim();
            }
            recordLessonCompletion(lid);
            ui.screen = "path";
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
            break;
          }

          case "start-skip-quiz": {
            stopPianoWatchDemo();
            const lid = Number(btn.getAttribute("data-lesson-id"));
            ui.activeLessonId = lid;
            ui.skipQuizIndex = 0;
            ui.skipQuizFailed = false;
            ui.skipQuizPassed = false;
            ui.screen = "skipQuiz";
            render();
            break;
          }

          case "answer-skip-quiz": {
            const optIdx = Number(btn.getAttribute("data-opt-index"));
            const lesson = LESSONS.find((l) => l.id === Number(ui.activeLessonId)) || LESSONS[0];
            const quizzes = lesson.quiz || [];
            const qObj = quizzes[ui.skipQuizIndex];
            if (qObj && optIdx === Number(qObj.correctIndex)) {
              if (ui.skipQuizIndex + 1 < quizzes.length) {
                ui.skipQuizIndex += 1;
              } else {
                recordLessonCompletion(lesson.id);
                ui.skipQuizPassed = true;
              }
            } else {
              ui.skipQuizFailed = true;
            }
            render();
            break;
          }

          case "advisor-chip": {
            const q = btn.getAttribute("data-query");
            const res = findAdvisorReply(q);
            state.advisorHistory = [...(state.advisorHistory || []), { query: q, ...res }];
            saveState();
            render();
            break;
          }

          case "set-library-tab": {
            stopPianoWatchDemo();
            ui.libraryTab = btn.getAttribute("data-tab");
            render();
            break;
          }

          case "toggle-teacher-inst": {
            const inst = btn.getAttribute("data-inst");
            const cur = state.teacherNotifyInstruments || [];
            if (cur.includes(inst)) {
              state.teacherNotifyInstruments = cur.filter((x) => x !== inst);
            } else {
              state.teacherNotifyInstruments = [...cur, inst];
            }
            ui.teacherSavedBanner = false;
            saveState();
            render();
            break;
          }

          case "save-teacher-notify": {
            const cur = state.teacherNotifyInstruments || [];
            if (cur.length === 0) {
              showToast(t("library.selectInstHint"));
              return;
            }
            ui.teacherSavedBanner = true;
            saveState();
            render();
            break;
          }

          case "set-theme": {
            state.theme = btn.getAttribute("data-theme-val");
            state.userChoseTheme = true;
            saveState();
            render();
            break;
          }

          case "open-modal":
            ui.modal = btn.getAttribute("data-modal");
            render();
            break;

          case "close-modal":
            ui.modal = null;
            render();
            break;

          case "confirm-reset": {
            stopPianoWatchDemo();
            const keepLang = state.lang;
            try {
              window.localStorage.removeItem(STORAGE_KEY);
              const keysToRemove = [];
              for (let i = 0; i < window.localStorage.length; i++) {
                const k = window.localStorage.key(i);
                if (k && k.toLowerCase().includes("musicher")) {
                  keysToRemove.push(k);
                }
              }
              for (const k of keysToRemove) {
                window.localStorage.removeItem(k);
              }
            } catch (err) {
              // Ignore storage error
            }
            state = {
              ...DEFAULT_STATE,
              lang: keepLang,
              motivations: [...DEFAULT_STATE.motivations],
              completedLessons: [],
              activeDaysHistory: [],
              teacherNotifyInstruments: [...DEFAULT_STATE.teacherNotifyInstruments],
              advisorHistory: [],
              theme: "light",
              userChoseTheme: false
            };
            ui.modal = null;
            ui.screen = "welcome";
            ui.activeLessonId = 1;
            ui.lessonStepIndex = 0;
            ui.selfCheckState = {};
            ui.quizSelected = null;
            ui.quizAnswered = false;
            ui.quizIsRight = false;
            ui.skipQuizIndex = 0;
            ui.skipQuizFailed = false;
            ui.skipQuizPassed = false;
            ui.pendingOtherInstrument = null;
            ui.teacherSavedBanner = false;
            ui.librarySearch = "";
            ui.libraryTab = "lessons";
            ui.pianoPractice.lessonId = null;
            ui.pianoPractice.completedByLesson = {};
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
            break;
          }
        }
      });

      /* ==========================================================================
         VIRTUAL PIANO MULTI-TOUCH, MOUSE & COMPUTER KEYBOARD LISTENERS
         ========================================================================== */
      let isMouseDownOnPiano = false;
      let activeMousePianoNote = null;
      let lastPianoTouchTime = 0;
      const activeTouchMap = new Map();
      const activeComputerKeys = new Set();

      document.addEventListener("mousedown", (e) => {
        if (Date.now() - lastPianoTouchTime < 650) return;
        if (e.button !== undefined && e.button !== 0) return;
        const keyEl = e.target.closest(".vpiano-key");
        if (!keyEl) return;
        e.preventDefault();
        isMouseDownOnPiano = true;
        const note = keyEl.getAttribute("data-note");
        activeMousePianoNote = note;
        keyEl.classList.add("is-pressed");
        handlePianoNoteTriggered(note);
      });

      document.addEventListener("mouseover", (e) => {
        if (!isMouseDownOnPiano || Date.now() - lastPianoTouchTime < 650) return;
        // Only glide across keys in free-play mode so holding mouse during practice step transitions doesn't double-trigger
        if (ui.screen === "lesson") return;
        const keyEl = e.target.closest(".vpiano-key");
        if (!keyEl) return;
        const note = keyEl.getAttribute("data-note");
        if (note && note !== activeMousePianoNote) {
          document.querySelectorAll(".vpiano-key.is-pressed").forEach((el) => el.classList.remove("is-pressed"));
          activeMousePianoNote = note;
          keyEl.classList.add("is-pressed");
          handlePianoNoteTriggered(note);
        }
      });

      window.addEventListener("mouseup", () => {
        if (isMouseDownOnPiano) {
          isMouseDownOnPiano = false;
          activeMousePianoNote = null;
          document.querySelectorAll(".vpiano-key.is-pressed").forEach((el) => el.classList.remove("is-pressed"));
        }
      });

      document.addEventListener("touchstart", (e) => {
        if (!ui.pianoAudioUnlocked) {
          unlockPianoAudio();
        }
        const keyEl = e.target.closest(".vpiano-key");
        if (!keyEl) return;
        lastPianoTouchTime = Date.now();

        for (let i = 0; i < e.changedTouches.length; i++) {
          const tPoint = e.changedTouches[i];
          const el = document.elementFromPoint(tPoint.clientX, tPoint.clientY);
          const touchedKey = (el ? el.closest(".vpiano-key") : null) || keyEl;
          const note = touchedKey ? touchedKey.getAttribute("data-note") : null;
          if (note) {
            activeTouchMap.set(tPoint.identifier, note);
            touchedKey.classList.add("is-pressed");
            handlePianoNoteTriggered(note);
          }
        }
      }, { passive: false });

      document.addEventListener("touchmove", (e) => {
        if (activeTouchMap.size === 0) return;
        lastPianoTouchTime = Date.now();
        // Only glide on touchmove in free-play mode; in lesson practice mode allow horizontal scroll or discrete taps
        if (ui.screen === "lesson") return;
        if (!e.target.closest(".vpiano-keyboard")) return;
        e.preventDefault();

        for (let i = 0; i < e.changedTouches.length; i++) {
          const tPoint = e.changedTouches[i];
          const prevNote = activeTouchMap.get(tPoint.identifier);
          const el = document.elementFromPoint(tPoint.clientX, tPoint.clientY);
          const touchedKey = el ? el.closest(".vpiano-key") : null;
          const nextNote = touchedKey ? touchedKey.getAttribute("data-note") : null;
          if (nextNote && nextNote !== prevNote) {
            if (prevNote) {
              const oldEl = document.querySelector(`.vpiano-key[data-note="${prevNote}"]`);
              if (oldEl) oldEl.classList.remove("is-pressed");
            }
            activeTouchMap.set(tPoint.identifier, nextNote);
            touchedKey.classList.add("is-pressed");
            handlePianoNoteTriggered(nextNote);
          }
        }
      }, { passive: false });

      document.addEventListener("touchend", (e) => {
        if (activeTouchMap.size === 0) return;
        lastPianoTouchTime = Date.now();
        for (let i = 0; i < e.changedTouches.length; i++) {
          const tPoint = e.changedTouches[i];
          const note = activeTouchMap.get(tPoint.identifier);
          activeTouchMap.delete(tPoint.identifier);
          if (note) {
            const oldEl = document.querySelector(`.vpiano-key[data-note="${note}"]`);
            if (oldEl) oldEl.classList.remove("is-pressed");
          }
        }
      }, { passive: false });

      document.addEventListener("touchcancel", () => {
        activeTouchMap.clear();
        document.querySelectorAll(".vpiano-key.is-pressed").forEach((el) => el.classList.remove("is-pressed"));
      });

      document.addEventListener("keydown", (e) => {
        if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
        const tag = (e.target && e.target.tagName ? e.target.tagName : "").toLowerCase();
        if (tag === "input" || tag === "textarea" || tag === "select") return;
        if (!document.querySelector(".vpiano-keyboard")) return;

        const k = String(e.key || "").toLowerCase();
        const mappedNote = VPIANO_COMPUTER_KEYMAP[k];
        if (mappedNote && !activeComputerKeys.has(k)) {
          activeComputerKeys.add(k);
          const keyEl = document.querySelector(`.vpiano-key[data-note="${mappedNote}"]`);
          if (keyEl) keyEl.classList.add("is-pressed");
          handlePianoNoteTriggered(mappedNote, keyEl);
        }
      });

      document.addEventListener("keyup", (e) => {
        const k = String(e.key || "").toLowerCase();
        const mappedNote = VPIANO_COMPUTER_KEYMAP[k];
        if (mappedNote) {
          activeComputerKeys.delete(k);
          const keyEl = document.querySelector(`.vpiano-key[data-note="${mappedNote}"]`);
          if (keyEl) keyEl.classList.remove("is-pressed");
        }
      });

      document.addEventListener("change", (e) => {
        const sel = e.target.closest("[data-action='profile-select']");
        if (!sel) return;
        const field = sel.getAttribute("data-field");
        if (field === "dailyGoal") {
          state[field] = Number(sel.value);
        } else if (field === "reminderTime") {
          const normalized = String(sel.value || "")
            .trim()
            .replace(/[۰-۹]/g, (d) => String(FA_DIGITS.indexOf(d)));
          if (/^([01]?\d|2[0-3]):[0-5]\d$/.test(normalized)) {
            const [hh, mm] = normalized.split(":");
            state.reminderTime = `${hh.padStart(2, "0")}:${mm}`;
          }
          render();
        } else {
          state[field] = sel.value;
        }
        saveState();
        showToast(t("profile.savedToast"));
      });

      document.addEventListener("input", (e) => {
        if (e.target.id === "library-search-input") {
          ui.librarySearch = e.target.value;
          render();
          const inp = document.getElementById("library-search-input");
          if (inp) {
            inp.focus();
            inp.setSelectionRange(inp.value.length, inp.value.length);
          }
        }
      });

      document.addEventListener("submit", (e) => {
        if (e.target.id === "signin-form") {
          e.preventDefault();
          const fd = new FormData(e.target);
          const email = String(fd.get("email") || "").trim();
          if (email) state.userEmail = email;
          state.isGuest = true;
          saveState();
          ui.screen = state.onboardingComplete ? "home" : "onboarding";
          render();
        } else if (e.target.id === "advisor-form") {
          e.preventDefault();
          const inp = document.getElementById("advisor-input");
          const q = inp ? inp.value.trim() : "";
          if (!q) return;
          const res = findAdvisorReply(q);
          state.advisorHistory = [...(state.advisorHistory || []), { query: q, ...res }];
          saveState();
          render();
        } else if (e.target.id === "modal-account-form") {
          e.preventDefault();
          const fd = new FormData(e.target);
          state.userName = String(fd.get("userName") || "").trim();
          state.userEmail = String(fd.get("userEmail") || "").trim();
          state.isGuest = !state.userName && !state.userEmail;
          saveState();
          ui.modal = null;
          showToast(t("profile.savedToast"));
        }
      });

      /* ==========================================================================
         BOOTSTRAP
         ========================================================================== */
      async function bootstrapApp() {
        loadState();
        applyDocumentLangAndTheme();

        try {
          const [enRes, faRes, mistakesRes] = await Promise.all([
            fetch("locales/en.json", { cache: "no-store" }),
            fetch("locales/fa.json", { cache: "no-store" }),
            fetch("content/mistakes.json", { cache: "no-store" })
          ]);
          if (enRes.ok) {
            const enData = await enRes.json();
            LOCALES.en = mergeLocaleData(FALLBACK_LOCALES.en, enData);
          }
          if (faRes.ok) {
            const faData = await faRes.json();
            LOCALES.fa = mergeLocaleData(FALLBACK_LOCALES.fa, faData);
          }
          if (mistakesRes.ok) MISTAKES = await mistakesRes.json();

          const lessonPromises = Array.from({ length: 24 }, (_, idx) => {
            const num = String(idx + 1).padStart(2, "0");
            return fetch(`content/lessons/lesson-${num}.json`).then((r) => (r.ok ? r.json() : null));
          });
          const loadedLessons = (await Promise.all(lessonPromises)).filter(Boolean);
          if (loadedLessons.length > 0) {
            LESSONS = loadedLessons.sort((a, b) => a.id - b.id);
          }
        } catch (err) {
          // Offline safety
        }

        evaluateStreakOnLoad();

        if (state.onboardingComplete) {
          ui.screen = "home";
          render();
        } else {
          ui.screen = "splash";
          render();
          setTimeout(() => {
            if (ui.screen === "splash") {
              ui.screen = "welcome";
              render();
            }
          }, 950);
        }
      }

      bootstrapApp();
    </script>
  </body>
</html>
