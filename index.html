<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>MUSICHER — Step-by-Step Music Learning Companion</title>
    <meta name="description" content="MUSICHER: Learn music from scratch, a few minutes a day, with an always-there practice advisor." />
    <meta property="og:title" content="MUSICHER — Step-by-Step Music Learning Companion" />
    <meta property="og:description" content="Learn music from scratch, a few minutes a day, with an always-there practice advisor." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* ==========================================================================
         MUSICHER — BRAND DESIGN TOKENS & BASE STYLES
         100% Self-Contained (No External CDN / Fonts / Scripts)
         ========================================================================== */
      :root {
        --bg: #FBF7F0;
        --bg-elevated: #FFFDF9;
        --surface: #F2ECE2;
        --surface-hover: #EAE2D6;
        --ink: #1F1A2E;
        --muted: #6B6475;
        --primary: #D9473F;
        --primary-hover: #C23830;
        --primary-soft: rgba(217, 71, 63, 0.12);
        --accent: #F2B33D;
        --accent-soft: rgba(242, 179, 61, 0.22);
        --secondary: #1F6F6B;
        --secondary-hover: #185956;
        --secondary-soft: rgba(31, 111, 107, 0.12);
        --dark-banner: #17141F;
        --dark-banner-card: #FFFDF9;
        --border-color: #1F1A2E;
        --border-subtle: rgba(31, 26, 46, 0.16);
        --card-radius: 20px;
        --card-border: 1.5px solid var(--border-color);
        --card-shadow: 4px 4px 0 rgba(31, 26, 46, 0.12);
        --card-shadow-sm: 2.5px 2.5px 0 rgba(31, 26, 46, 0.12);
        --pill-radius: 9999px;
        --staff-line: rgba(31, 26, 46, 0.18);
        --arch-outer: #1F1A2E;
        --arch-inner: #D5C7B2;
        --font-serif-en: "Playfair Display", "Iowan Old Style", "Palatino Linotype", "URW Palladio L", Georgia, serif;
        --font-sans-en: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --font-fa: Vazirmatn, Tahoma, "Segoe UI", sans-serif;
        --font-heading: var(--font-fa);
        --font-body: var(--font-fa);
        --dir-sign: -1;
        --transition: 200ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      html[lang="en"] {
        --font-heading: var(--font-serif-en);
        --font-body: var(--font-sans-en);
        --dir-sign: 1;
      }

      html[lang="fa"] {
        --font-heading: var(--font-fa);
        --font-body: var(--font-fa);
        --dir-sign: -1;
      }

      [data-theme="dark"] {
        --bg: #17141F;
        --bg-elevated: #211D2C;
        --surface: #2A2438;
        --surface-hover: #352E46;
        --ink: #FBF7F0;
        --muted: #B8B0C4;
        --primary: #E55A52;
        --primary-hover: #F06B63;
        --primary-soft: rgba(229, 90, 82, 0.18);
        --accent: #F2B33D;
        --accent-soft: rgba(242, 179, 61, 0.2);
        --secondary: #2FA39D;
        --secondary-hover: #3BB8B1;
        --secondary-soft: rgba(47, 163, 157, 0.18);
        --dark-banner: #110E17;
        --dark-banner-card: #211D2C;
        --border-color: #463E59;
        --border-subtle: rgba(251, 247, 240, 0.14);
        --card-shadow: 4px 4px 0 rgba(0, 0, 0, 0.45);
        --card-shadow-sm: 2.5px 2.5px 0 rgba(0, 0, 0, 0.4);
        --staff-line: rgba(251, 247, 240, 0.18);
        --arch-outer: #F2B33D;
        --arch-inner: #463E59;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      html, body {
        min-height: 100%;
        background-color: var(--bg);
        color: var(--ink);
        font-family: var(--font-body);
        line-height: 1.6;
        transition: background-color var(--transition), color var(--transition);
        overflow-x: hidden;
      }

      h1, h2, h3, .serif-heading {
        font-family: var(--font-heading);
        line-height: 1.22;
        letter-spacing: -0.01em;
      }

      html[lang="fa"] h1,
      html[lang="fa"] h2,
      html[lang="fa"] h3,
      html[lang="fa"] .serif-heading {
        letter-spacing: 0;
        line-height: 1.4;
      }

      button, input, select, textarea {
        font-family: inherit;
        font-size: inherit;
        color: inherit;
      }

      button {
        cursor: pointer;
        border: none;
        background: none;
      }

      /* Mirroring helper for directional icons & offset shadows in RTL */
      html[dir="rtl"] .dir-flip {
        transform: scaleX(-1);
      }
      html[dir="rtl"] .m-card {
        box-shadow: -4px 4px 0 rgba(31, 26, 46, 0.12);
      }
      html[dir="rtl"][data-theme="dark"] .m-card {
        box-shadow: -4px 4px 0 rgba(0, 0, 0, 0.45);
      }

      /* ==========================================================================
         LAYOUT SHELLS (Landing Wide Container + Mobile App Shell)
         ========================================================================== */
      #app-root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Wide responsive container for Landing Hero & Teachers Section */
      .landing-shell {
        width: 100%;
        max-width: 1120px;
        margin: 0 auto;
        padding: 0 20px 64px;
      }

      /* Mobile-first app shell matching Mockups 1, 2, 5 */
      .mobile-shell {
        width: 100%;
        max-width: 480px;
        min-height: 100vh;
        margin: 0 auto;
        background-color: var(--bg);
        position: relative;
        display: flex;
        flex-direction: column;
        border-inline: 1px solid var(--border-subtle);
      }

      .screen-body {
        flex: 1;
        padding: 16px 20px 104px;
        animation: fadeSlideIn 220ms ease-out;
      }

      .screen-body.no-bottom-nav {
        padding-bottom: 36px;
      }

      @keyframes fadeSlideIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* ==========================================================================
         BRAND COMPONENTS: CARDS, PILL BUTTONS, ARCH FRAMES, STAFF DIVIDERS
         ========================================================================== */
      .m-card {
        background-color: var(--bg-elevated);
        border: var(--card-border);
        border-radius: var(--card-radius);
        box-shadow: var(--card-shadow);
        padding: 18px;
        transition: transform 140ms ease, box-shadow 140ms ease, background-color var(--transition);
      }

      .m-card.surface-fill {
        background-color: var(--surface);
      }

      .m-card.interactive:hover {
        transform: translateY(-1px);
      }

      .m-card.interactive:active {
        transform: translateY(1px);
      }

      /* Pill Buttons */
      .btn-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 48px;
        padding: 11px 24px;
        border-radius: var(--pill-radius);
        font-weight: 700;
        font-size: 0.98rem;
        border: 1.5px solid var(--border-color);
        transition: transform 120ms ease, background-color 150ms ease, opacity 150ms ease;
        text-decoration: none;
        user-select: none;
      }

      .btn-pill:active {
        transform: scale(0.98);
      }

      .btn-primary {
        background-color: var(--primary);
        color: #FFFFFF;
        box-shadow: var(--card-shadow-sm);
      }

      .btn-primary:hover {
        background-color: var(--primary-hover);
      }

      .btn-secondary {
        background-color: var(--secondary);
        color: #FFFFFF;
        box-shadow: var(--card-shadow-sm);
      }

      .btn-secondary:hover {
        background-color: var(--secondary-hover);
      }

      .btn-surface {
        background-color: var(--surface);
        color: var(--ink);
      }

      .btn-surface:hover {
        background-color: var(--surface-hover);
      }

      .btn-outline {
        background-color: transparent;
        color: var(--ink);
        border: 1.5px solid var(--border-color);
      }

      .btn-outline:hover {
        background-color: var(--surface);
      }

      .btn-block {
        width: 100%;
      }

      /* Saffron Badge Pill */
      .badge-saffron {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background-color: var(--accent);
        color: #1F1A2E;
        border: 1.5px solid #1F1A2E;
        border-radius: var(--pill-radius);
        padding: 5px 13px;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.03em;
        box-shadow: 2px 2px 0 rgba(31, 26, 46, 0.14);
        white-space: nowrap;
      }

      .badge-teal {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background-color: var(--secondary);
        color: #FFFFFF;
        border-radius: var(--pill-radius);
        padding: 3px 10px;
        font-size: 0.75rem;
        font-weight: 700;
      }

      /* Section Kicker + 5-Line Staff Header (as in Mockups 1 & 2) */
      .kicker-staff-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
      }

      .kicker-label {
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--secondary);
        white-space: nowrap;
      }

      html[lang="fa"] .kicker-label {
        letter-spacing: 0;
        font-size: 0.84rem;
      }

      .staff-5lines-bar {
        flex: 1;
        height: 14px;
        background-image: repeating-linear-gradient(
          to bottom,
          var(--staff-line) 0px,
          var(--staff-line) 1px,
          transparent 1px,
          transparent 3.2px
        );
        opacity: 0.85;
      }

      /* Decorative Curved 5-Line Staff Divider with Musical Notes (Max 1 per section) */
      .staff-wave-divider {
        width: 100%;
        height: 54px;
        margin: 12px 0;
        overflow: visible;
        display: block;
      }

      /* ==========================================================================
         PERSIAN OGEE ARCH IMAGE PLACEHOLDERS
         Empty arch-shaped placeholders with soft surface color & configurable src
         ========================================================================== */
      .arch-frame-wrap {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
      }

      .arch-svg-container {
        width: 100%;
        height: auto;
        display: block;
        filter: drop-shadow(0 6px 14px rgba(31, 26, 46, 0.08));
      }

      /* ==========================================================================
         1. LANDING HERO & TEACHERS SECTION (MOCKUPS 4 & 3)
         ========================================================================== */
      .landing-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 0;
        border-bottom: 1px solid var(--border-subtle);
        gap: 12px;
        flex-wrap: wrap;
      }

      .brand-logo {
        font-family: var(--font-serif-en);
        font-size: 1.35rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: var(--ink);
        text-transform: uppercase;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .landing-nav-links {
        display: flex;
        align-items: center;
        gap: 24px;
      }

      .landing-nav-link {
        font-size: 0.94rem;
        font-weight: 600;
        color: var(--ink);
        opacity: 0.85;
        transition: opacity 150ms;
      }

      .landing-nav-link:hover {
        opacity: 1;
        color: var(--primary);
      }

      .landing-nav-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .lang-switch-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 6px 12px;
        border-radius: var(--pill-radius);
        border: 1.5px solid var(--border-color);
        background-color: var(--surface);
        font-size: 0.82rem;
        font-weight: 700;
      }

      .hero-grid {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 36px;
        align-items: center;
        padding: 36px 0 28px;
        position: relative;
      }

      @media (max-width: 820px) {
        .hero-grid {
          grid-template-columns: 1fr;
          text-align: center;
          gap: 28px;
          padding: 24px 0 20px;
        }
        .landing-nav-links {
          display: none;
        }
        .hero-cta-row {
          justify-content: center !important;
        }
      }

      .hero-headline {
        font-size: clamp(2.1rem, 4.5vw, 3.35rem);
        font-weight: 800;
        color: var(--ink);
        margin-bottom: 16px;
      }

      .hero-highlight {
        position: relative;
        display: inline-block;
        color: var(--ink);
        z-index: 1;
      }

      .hero-highlight::after {
        content: "";
        position: absolute;
        inset-inline: -4px;
        bottom: 4px;
        height: 12px;
        background-color: var(--accent);
        border-radius: 6px;
        z-index: -1;
        opacity: 0.85;
      }

      .hero-subheadline {
        font-size: 1.08rem;
        color: var(--muted);
        max-width: 520px;
        margin-bottom: 26px;
      }

      @media (max-width: 820px) {
        .hero-subheadline {
          margin-inline: auto;
        }
      }

      .hero-cta-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
        margin-bottom: 16px;
      }

      .hero-secondary-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-weight: 700;
        color: var(--secondary);
        padding: 8px 4px;
        border-bottom: 2px solid transparent;
      }

      .hero-secondary-link:hover {
        border-bottom-color: var(--secondary);
      }

      .benefits-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
        margin-top: 24px;
      }

      @media (max-width: 768px) {
        .benefits-grid {
          grid-template-columns: 1fr;
        }
      }

      .benefit-card {
        display: flex;
        align-items: flex-start;
        gap: 14px;
      }

      .benefit-icon-box {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        background-color: var(--surface);
        border: 1.5px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        color: var(--secondary);
      }

      /* Teachers Section (Mockup 3) */
      .teachers-banner {
        background-color: var(--dark-banner);
        color: #FBF7F0;
        border-radius: 28px;
        border: 1.5px solid var(--border-color);
        padding: 36px 32px;
        margin-top: 48px;
        position: relative;
        overflow: hidden;
        box-shadow: var(--card-shadow);
      }

      @media (max-width: 768px) {
        .teachers-banner {
          padding: 24px 18px;
          margin-top: 32px;
        }
      }

      .teachers-grid {
        display: grid;
        grid-template-columns: 1.08fr 0.92fr;
        gap: 28px;
        align-items: center;
        position: relative;
        z-index: 2;
      }

      @media (max-width: 860px) {
        .teachers-grid {
          grid-template-columns: 1fr;
        }
      }

      .teachers-title {
        font-size: clamp(1.85rem, 3.5vw, 2.75rem);
        margin-bottom: 10px;
        color: #FBF7F0;
      }

      .teachers-title .saffron-word {
        color: var(--accent);
        display: block;
      }

      .teachers-desc {
        color: rgba(251, 247, 240, 0.8);
        font-size: 0.95rem;
        margin-bottom: 20px;
        max-width: 480px;
      }

      /* White/surface card with Notify Me INSIDE the card (Fix #2 vs Mockup) */
      .teachers-picker-card {
        background-color: var(--dark-banner-card);
        color: var(--ink);
        border: 1.5px solid var(--border-color);
        border-radius: var(--card-radius);
        padding: 20px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
      }

      .teachers-inst-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(74px, 1fr));
        gap: 8px;
        margin: 12px 0 18px;
      }

      .teacher-inst-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        padding: 10px 6px;
        border-radius: 14px;
        border: 1.5px solid var(--border-subtle);
        background-color: var(--surface);
        color: var(--ink);
        font-size: 0.76rem;
        font-weight: 700;
        transition: all 140ms ease;
      }

      .teacher-inst-btn.selected {
        border-color: var(--primary);
        background-color: var(--primary-soft);
        color: var(--primary);
        box-shadow: 2px 2px 0 rgba(217, 71, 63, 0.2);
      }

      .teachers-arches-pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        align-items: end;
      }

      /* ==========================================================================
         2. MOBILE HOME & LEARNING PATH & LESSON SCREEN (MOCKUPS 2, 5, 1)
         ========================================================================== */
      .mobile-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px 10px;
      }

      .mobile-topbar-center {
        justify-content: center;
        position: relative;
      }

      .home-greeting-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin: 8px 0 18px;
      }

      .home-greeting-title {
        font-size: 1.65rem;
        font-weight: 800;
      }

      .home-greeting-sub {
        font-size: 0.9rem;
        color: var(--muted);
        margin-top: 2px;
      }

      /* Today's Plan Card (Mockup 2) */
      .todays-plan-card {
        padding: 18px;
        position: relative;
      }

      .todays-plan-body {
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: 14px;
        align-items: center;
      }

      .todays-plan-title {
        font-size: 1.38rem;
        font-weight: 800;
        margin-bottom: 4px;
      }

      .todays-plan-meta {
        font-size: 0.86rem;
        color: var(--muted);
        margin-bottom: 14px;
      }

      /* 2-Column Streak & Progress Row (Mockup 2) */
      .home-stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 16px;
      }

      @media (max-width: 370px) {
        .home-stats-grid {
          grid-template-columns: 1fr;
        }
      }

      .week-dots-row {
        display: flex;
        justify-content: space-between;
        gap: 4px;
        margin: 10px 0 8px;
      }

      .week-day-col {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        font-size: 0.7rem;
        font-weight: 700;
        color: var(--muted);
      }

      .week-dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 1.5px solid var(--border-color);
        background-color: var(--surface);
      }

      .week-dot.active {
        background-color: var(--accent);
      }

      .week-dot.today-ring {
        box-shadow: 0 0 0 2px var(--primary);
      }

      .progress-track {
        width: 100%;
        height: 10px;
        background-color: var(--surface);
        border: 1.5px solid var(--border-color);
        border-radius: var(--pill-radius);
        overflow: hidden;
        margin: 10px 0 8px;
      }

      .progress-fill {
        height: 100%;
        background-color: var(--secondary);
        border-radius: var(--pill-radius);
        transition: width 300ms ease;
      }

      /* Learning Path Cards (Mockup 5) */
      .chapter-block {
        margin-bottom: 22px;
      }

      .chapter-heading {
        font-size: 1.2rem;
        font-weight: 800;
        margin-bottom: 12px;
        color: var(--ink);
      }

      .path-lesson-card {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
        margin-bottom: 12px;
        position: relative;
        width: 100%;
        text-align: start;
      }

      .path-lesson-card.current {
        border: 2px solid var(--primary);
        background-color: var(--bg-elevated);
      }

      .path-lesson-card.locked {
        opacity: 0.64;
        background-color: var(--surface);
        box-shadow: none;
      }

      .path-now-badge {
        position: absolute;
        top: -11px;
        inset-inline-end: 14px;
        background-color: var(--accent);
        color: #1F1A2E;
        border: 1.5px solid #1F1A2E;
        border-radius: var(--pill-radius);
        padding: 1px 10px;
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      .path-icon-box {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        border: 1.5px solid var(--border-color);
        background-color: var(--surface);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .path-status-circle {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        border: 1.5px solid var(--border-color);
      }

      .path-status-circle.done {
        background-color: var(--secondary);
        color: #FFFFFF;
        border-color: var(--secondary);
      }

      .path-status-circle.current {
        background-color: var(--primary);
        color: #FFFFFF;
        border-color: var(--border-color);
      }

      .path-status-circle.locked {
        background-color: transparent;
        color: var(--muted);
        border-color: var(--border-subtle);
      }

      /* Lesson Screen (Mockup 1) */
      .lesson-topbar {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 20px 8px;
        position: relative;
        z-index: 2;
      }

      .lesson-close-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 1.5px solid var(--border-color);
        background-color: var(--bg-elevated);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .lesson-progress-track {
        flex: 1;
        height: 10px;

      /* Form Inputs */

  <body>
    <div id="app-root"></div>

    <script>
      /* ==========================================================================
         MUSICHER — CONFIGURABLE ILLUSTRATION PATHS & APPLICATION LOGIC
         ========================================================================== */
      const ASSETS = {
        hero: "assets/hero.png",
        teachers1: "assets/teachers-1.png",
        teachers2: "assets/teachers-2.png",
        todayPlan: "assets/lesson-01.png"
      };

      const STORAGE_KEY = "musicher_app_state_v2";

      const DEFAULT_STATE = {
        lang: "fa",
        onboardingComplete: false,
        onboardingStep: 1,
        instrument: "piano",
        access: "yes",
        experience: "none",
        dailyGoal: 15,
        motivations: ["self"],
        reminderTime: "19:00",
        completedLessons: [],
        streakCount: 0,
        lastCompletedDate: null,
        freeDayUsedWeekKey: null,
        activeDaysHistory: [],
        userName: "",
        userEmail: "",
        isGuest: true,
        theme: "system",
        teacherNotifyInstruments: ["piano"],
        advisorHistory: []
      };

      let state = { ...DEFAULT_STATE };

      // Transient UI state (not persisted)
      let ui = {
        screen: "splash", // splash | welcome | signin | onboarding | home | path | advisor | library | profile | lesson | skipQuiz
        libraryTab: "lessons", // lessons | teachers
        librarySearch: "",
        activeLessonId: 1,
        lessonStepIndex: 0, // 0: Intro/See, 1: Practice Steps, 2: Self-Check, 3: Quiz Q1, 4: Quiz Q2, 5: Summary
        selfCheckState: {},
        quizSelected: null,
        quizAnswered: false,
        quizIsRight: false,
        skipQuizIndex: 0,
        skipQuizFailed: false,
        skipQuizPassed: false,
        pendingOtherInstrument: null,
        toastMessage: null,
        toastTimer: null,
        modal: null, // null | "about" | "reset" | "account"
        teacherSavedBanner: false
      };

      let LOCALES = { en: {}, fa: {} };
      let LESSONS = [];
      let MISTAKES = [];

      /* ==========================================================================
         SAFE LOCALSTORAGE & PERSIAN DIGIT HELPERS
         ========================================================================== */
      function loadState() {
        try {
          const raw = window.localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            state = { ...DEFAULT_STATE, ...parsed };
          }
        } catch (err) {
          // Work seamlessly if localStorage is blocked
        }
      }

      function saveState() {
        try {
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (err) {
          // Ignore storage errors
        }
      }

      const FA_DIGITS = ["۰", "۱", "۲", "۳", "۴", "۵", "۶", "۷", "۸", "۹"];
      function toLocaleDigits(val) {
        const str = String(val ?? "");
        if (state.lang !== "fa") return str;
        return str.replace(/\d/g, (d) => FA_DIGITS[Number(d)]);
      }

      function t(path, params = {}) {
        const parts = path.split(".");
        let cur = LOCALES[state.lang] || LOCALES.en;
        for (const p of parts) {
          cur = cur?.[p];
        }
        if (cur === undefined) {
          let fb = LOCALES.en;
          for (const p of parts) fb = fb?.[p];
          cur = fb !== undefined ? fb : path;
        }
        if (typeof cur !== "string") return cur;
        return cur.replace(/\{(\w+)\}/g, (_, k) =>
          params[k] !== undefined ? toLocaleDigits(params[k]) : ""
        );
      }

      function lField(fieldObj) {
        if (fieldObj === null || fieldObj === undefined) return "";
        if (typeof fieldObj === "string" || Array.isArray(fieldObj)) return fieldObj;
        if (typeof fieldObj === "object") {
          return fieldObj[state.lang] !== undefined
            ? fieldObj[state.lang]
            : fieldObj.en !== undefined
            ? fieldObj.en
            : "";
        }
        return String(fieldObj);
      }

      function applyDocumentLangAndTheme() {
        const html = document.documentElement;
        html.lang = state.lang === "en" ? "en" : "fa";
        html.dir = state.lang === "en" ? "ltr" : "rtl";

        let effectiveTheme = state.theme;
        if (effectiveTheme === "system") {
          const prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          effectiveTheme = prefersDark ? "dark" : "light";
        }
        html.setAttribute("data-theme", effectiveTheme);
      }

      function toggleLanguage() {
        state.lang = state.lang === "fa" ? "en" : "fa";
        saveState();
        applyDocumentLangAndTheme();
        render();
      }

      function showToast(msg) {
        ui.toastMessage = msg;
        if (ui.toastTimer) clearTimeout(ui.toastTimer);
        render();
        ui.toastTimer = setTimeout(() => {
          ui.toastMessage = null;
          render();
        }, 3000);
      }

      /* ==========================================================================
         STREAK & WEEKLY FREE-DAY LOGIC
         Rule: A missed single day keeps the streak only if this week's free day
         is still unused; if the free day was already used this week (for any
         earlier gap), a missed day resets the streak to 0.
         Applied both on app load and when recording a completion.
         ========================================================================== */
      function getLocalDateKey(dateObj = new Date()) {
        const y = dateObj.getFullYear();
        const m = String(dateObj.getMonth() + 1).padStart(2, "0");
        const d = String(dateObj.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      }

      function parseDateKey(key) {
        const [y, m, d] = key.split("-").map(Number);
        return new Date(y, m - 1, d);
      }

      function diffDays(dateKeyA, dateKeyB) {
        const a = parseDateKey(dateKeyA);
        const b = parseDateKey(dateKeyB);
        const msPerDay = 24 * 60 * 60 * 1000;
        return Math.round((b - a) / msPerDay);
      }

      // Week key starting Saturday (standard Persian week & consistent 7-day window)
      function getWeekKey(dateKey) {
        const dt = parseDateKey(dateKey);
        const day = dt.getDay(); // 0 Sun .. 6 Sat
        const offsetSinceSat = (day + 1) % 7;
        const sat = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() - offsetSinceSat);
        return getLocalDateKey(sat);
      }

      function evaluateStreakOnLoad() {
        if (!state.lastCompletedDate) return;
        const today = getLocalDateKey();
        const currentWeekKey = getWeekKey(today);
        const gap = diffDays(state.lastCompletedDate, today);

        if (gap <= 1) {
          return; // Completed today or yesterday: streak intact
        }
        if (gap === 2) {
          // Missed exactly 1 day (yesterday)
          const missedDateObj = parseDateKey(today);
          missedDateObj.setDate(missedDateObj.getDate() - 1);
          const missedWeekKey = getWeekKey(getLocalDateKey(missedDateObj));
          if (state.freeDayUsedWeekKey !== missedWeekKey) {
            state.freeDayUsedWeekKey = missedWeekKey;
            saveState();
          } else {
            state.streakCount = 0;
            saveState();
          }
        } else if (gap > 2) {
          // Missed 2 or more days -> reset streak to 0
          state.streakCount = 0;
          saveState();
        }
      }

      function recordLessonCompletion(lessonId) {
        if (!state.completedLessons.includes(lessonId)) {
          state.completedLessons.push(lessonId);
        }
        const today = getLocalDateKey();
        if (!state.activeDaysHistory.includes(today)) {
          state.activeDaysHistory.push(today);
        }

        if (!state.lastCompletedDate) {
          state.streakCount = 1;
          state.lastCompletedDate = today;
        } else {
          const gap = diffDays(state.lastCompletedDate, today);
          if (gap === 0) {
            if (state.streakCount === 0) state.streakCount = 1;
          } else if (gap === 1) {
            state.streakCount = (state.streakCount || 0) + 1;
            state.lastCompletedDate = today;
          } else if (gap === 2) {
            const missedDateObj = parseDateKey(today);
            missedDateObj.setDate(missedDateObj.getDate() - 1);
            const missedWeekKey = getWeekKey(getLocalDateKey(missedDateObj));
            if (state.freeDayUsedWeekKey !== missedWeekKey) {
              state.freeDayUsedWeekKey = missedWeekKey;
              state.streakCount = (state.streakCount || 0) + 1;
            } else {
              // Free day already used this week -> missed day resets streak to 0, then today starts at 1
              state.streakCount = 0;
            }
            state.lastCompletedDate = today;
          } else {
            state.streakCount = 0;
            state.lastCompletedDate = today;
          }
        }
        saveState();
      }

      function isFreeDayUsedThisWeek() {
        const todayWeek = getWeekKey(getLocalDateKey());
        return state.freeDayUsedWeekKey === todayWeek;
      }

      /* ==========================================================================
         PERSIAN OGEE ARCH PLACEHOLDER & DECORATIVE SVG HELPERS
         ========================================================================== */
      function renderArchPlaceholder({ imageUrl, ratio = "tall", caption = "", uid = "arch" }) {
        const vbWidth = 280;
        const vbHeight = ratio === "compact" ? 260 : 350;
        // Pointed Persian ogee arch path (matching the 5 mockups)
        const outerPath =
          ratio === "compact"
            ? "M 140 10 C 175 34, 254 68, 254 140 L 254 246 C 254 250, 250 252, 246 252 L 34 252 C 30 252, 26 250, 26 246 L 26 140 C 26 68, 105 34, 140 10 Z"
            : "M 140 12 C 180 42, 262 84, 262 172 L 262 332 C 262 337, 258 340, 252 340 L 28 340 C 22 340, 18 337, 18 332 L 18 172 C 18 84, 100 42, 140 12 Z";

        const innerPath =
          ratio === "compact"
            ? "M 140 20 C 172 42, 244 74, 244 142 L 244 242 L 36 242 L 36 142 C 36 74, 108 42, 140 20 Z"
            : "M 140 24 C 176 52, 250 90, 250 174 L 250 328 L 30 328 L 30 174 C 30 90, 104 52, 140 24 Z";

        const clipId = `arch-clip-${uid}`;
        const safeCaption = caption ? escapeHtml(caption) : "";

        return `
          <div class="arch-frame-wrap">
            <svg class="arch-svg-container" viewBox="0 0 ${vbWidth} ${vbHeight}" role="img" aria-label="MUSICHER Illustration Frame">
              <defs>
                <clipPath id="${clipId}">
                  <path d="${innerPath}" />
                </clipPath>
              </defs>
              <!-- Soft surface fill inside the arch -->
              <path d="${outerPath}" fill="var(--surface)" stroke="var(--arch-outer)" stroke-width="2.5" />
              <path d="${innerPath}" fill="var(--surface)" stroke="var(--arch-inner)" stroke-width="1.4" />
              <!-- Subtle arch watermark motif when image is empty -->
              <g clip-path="url(#${clipId})">
                <circle cx="140" cy="${ratio === "compact" ? 115 : 150}" r="36" fill="var(--accent-soft)" />
                <path d="M 30 ${vbHeight - 55} Q 140 ${vbHeight - 85} 250 ${vbHeight - 55}" fill="none" stroke="var(--staff-line)" stroke-width="1.2" />
                <path d="M 30 ${vbHeight - 47} Q 140 ${vbHeight - 77} 250 ${vbHeight - 47}" fill="none" stroke="var(--staff-line)" stroke-width="1.2" />
                <path d="M 30 ${vbHeight - 39} Q 140 ${vbHeight - 69} 250 ${vbHeight - 39}" fill="none" stroke="var(--staff-line)" stroke-width="1.2" />
                ${
                  imageUrl
                    ? `<image href="${escapeHtml(imageUrl)}" x="18" y="12" width="${vbWidth - 36}" height="${vbHeight - 24}" preserveAspectRatio="xMidYMid slice" onerror="this.style.display='none'" />`
                    : ""
                }
              </g>
              ${
                safeCaption
                  ? `<foreignObject x="38" y="${vbHeight - 76}" width="204" height="58">
                      <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:11.5px;line-height:1.35;color:var(--muted);text-align:center;font-style:italic;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">
                        ${safeCaption}
                      </div>
                    </foreignObject>`
                  : ""
              }
            </svg>
          </div>
        `;
      }

      // Decorative Curved 5-Line Staff Divider with Musical Notes (at most 1 per section)
      function renderStaffWaveDivider() {
        return `
          <svg class="staff-wave-divider" viewBox="0 0 400 52" fill="none" aria-hidden="true">
            <g stroke="var(--staff-line)" stroke-width="1.15">
              <path d="M 0 18 C 110 4, 290 34, 400 16" />

      // Eighth-note step number badge (Mockup 1: number inside the notehead)

      // Custom line-art icons for instruments & lessons
      function getInstrumentSvg(key) {
        const icons = {

          guitar: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m19 3-5 5M16 3h3v3"/><circle cx="10.5" cy="13.5" r="5.5"/><circle cx="10.5" cy="13.5" r="1.5"/></svg>`,
          tar: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 3 11 10"/><circle cx="8" cy="16" r="4"/><circle cx="11.5" cy="12.5" r="2.5"/></svg>`,
          setar: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 3 10 12"/><path d="M6 13c-2 2-2 5 0 7s5 2 7 0 1-5-1-7-4-2-6 0Z"/></svg>`,

          violin: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 3 9 12"/><circle cx="8.5" cy="15.5" r="4.5"/><path d="M14 6l4 4"/></svg>`
        };
        return icons[key] || icons.piano;
      }

      function escapeHtml(str) {
        return String(str ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      /* ==========================================================================
         TEACHERS SECTION COMPONENT (MOCKUP 3 — Notify Me button INSIDE card)
         ========================================================================== */
      function renderTeachersSection() {
        const instKeys = ["piano", "voice", "guitar", "tar", "setar", "santur", "violin"];
        const selectedList = state.teacherNotifyInstruments || [];

        const instButtons = instKeys
          .map((k) => {
            const isSel = selectedList.includes(k);
            return `
              <button type="button" class="teacher-inst-btn ${isSel ? "selected" : ""}" data-action="toggle-teacher-inst" data-inst="${k}">
                ${getInstrumentSvg(k)}
                <span>${escapeHtml(t(`instruments.${k === "piano" ? "pianoShort" : k}`))}</span>
              </button>
            `;
          })
          .join("");

        const savedNames = selectedList
          .map((k) => t(`instruments.${k === "piano" ? "pianoShort" : k}`))
          .join(state.lang === "fa" ? "، " : ", ");

        return `
          <section class="teachers-banner" id="teachers-section">
            <div class="teachers-grid">
              <div>
                <h2 class="teachers-title serif-heading">
                  <span class="saffron-word">${escapeHtml(t("library.teachersHeadline1"))}</span>
                  <span>${escapeHtml(t("library.teachersHeadline2"))}</span>
                </h2>
                <p class="teachers-desc">${escapeHtml(t("library.teachersDesc"))}</p>

                <!-- Inner surface card with Notify Me button strictly INSIDE the card -->
                <div class="teachers-picker-card">
                  <div class="kicker-staff-row" style="margin-bottom:8px;">
                    <span class="kicker-label">${escapeHtml(t("library.chooseInstLabel"))}</span>
                    <div class="staff-5lines-bar"></div>
                  </div>
                  <div class="teachers-inst-grid">
                    ${instButtons}
                  </div>
                  <button type="button" class="btn-pill btn-primary btn-block" data-action="save-teacher-notify">
                    <span>${escapeHtml(t("library.notifyMeBtn"))}</span>

      /* ==========================================================================
         FIRST-RUN ONBOARDING FLOW (Steps 1..7, progress dots, back button, lang switch on Step 1)
         ========================================================================== */
      function renderOnboardingScreen() {
        const step = state.onboardingStep || 1;
        const totalSteps = 7;

        const dotsHtml = Array.from({ length: totalSteps }, (_, idx) => {
          const s = idx + 1;
          const cls = s === step ? "active" : s < step ? "done" : "";
          return `<span class="progress-dot ${cls}"></span>`;
        }).join("");

        let stepContent = "";

        if (step === 1) {
          const instruments = [
            { id: "piano", active: true },
            { id: "guitar", active: false },
            { id: "tar", active: false },
            { id: "setar", active: false },
            { id: "santur", active: false },
            { id: "violin", active: false },
            { id: "voice", active: false }
          ];

          stepContent = `
            <h1 class="serif-heading" style="font-size:1.5rem;margin-bottom:16px;">${escapeHtml(t("onboarding.instTitle"))}</h1>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;">
              ${instruments
                .map((inst) => {
                  const isSelected = inst.active && state.instrument === "piano";
                  return `
                    <button type="button" class="m-card interactive" style="text-align:center;padding:16px 10px;border-color:${isSelected ? "var(--primary)" : "var(--border-color)"};background-color:${isSelected ? "var(--primary-soft)" : "var(--bg-elevated)"};" data-action="select-onboard-inst" data-inst="${inst.id}" data-active="${inst.active}">
                      <div style="width:44px;height:44px;margin:0 auto 8px;border-radius:12px;background:var(--surface);border:1.5px solid var(--border-color);display:flex;align-items:center;justify-content:center;color:var(--secondary);">
                        ${getInstrumentSvg(inst.id)}
                      </div>
                      <div style="font-weight:800;font-size:0.95rem;margin-bottom:4px;">${escapeHtml(t(`instruments.${inst.id}`))}</div>
                      <span class="${inst.active ? "badge-teal" : "badge-saffron"}" style="font-size:0.68rem;padding:2px 8px;">
                        ${escapeHtml(inst.active ? t("onboarding.instReady") : t("onboarding.instSoon"))}
                      </span>
                    </button>
                  `;
                })
                .join("")}
            </div>
            ${
              ui.pendingOtherInstrument
                ? `<div class="m-card surface-fill" style="margin-bottom:16px;border-color:var(--accent);">
                    <p style="font-size:0.9rem;margin-bottom:12px;font-weight:600;">${escapeHtml(t("onboarding.instSoonNote"))}</p>
                    <button type="button" class="btn-pill btn-primary btn-block" data-action="onboard-next">
                      ${escapeHtml(t("onboarding.instStartPianoBtn"))}
                    </button>
                  </div>`
                : `<button type="button" class="btn-pill btn-primary btn-block" data-action="onboard-next">
                    ${escapeHtml(t("onboarding.instContinuePianoBtn"))}
                  </button>`
            }
          `;
        } else if (step === 2) {
          const opts = [
            { id: "yes", label: t("onboarding.accessYes"), helper: t("onboarding.accessYesHelper") },
            { id: "phone", label: t("onboarding.accessPhone"), helper: t("onboarding.accessPhoneHelper") },
            { id: "no", label: t("onboarding.accessNo"), helper: t("onboarding.accessNoHelper") }
          ];
          const activeHelper = opts.find((o) => o.id === state.access)?.helper || "";

          stepContent = `
            <h1 class="serif-heading" style="font-size:1.5rem;margin-bottom:16px;">${escapeHtml(t("onboarding.accessTitle"))}</h1>
            ${opts
              .map(
                (o) => `
                  <button type="button" class="m-card choice-card ${state.access === o.id ? "selected" : ""}" data-action="set-onboard-field" data-field="access" data-value="${o.id}">
                    <span style="font-weight:700;">${escapeHtml(o.label)}</span>
                    <span>${state.access === o.id ? "●" : "○"}</span>
                  </button>
                `
              )
              .join("")}
            <div class="m-card surface-fill" style="margin:12px 0 20px;padding:12px 16px;font-size:0.88rem;color:var(--secondary);font-weight:600;">
              💡 ${escapeHtml(activeHelper)}
            </div>
            <button type="button" class="btn-pill btn-primary btn-block" data-action="onboard-next">
              ${escapeHtml(t("onboarding.continue"))}
            </button>
          `;
        } else if (step === 3) {
          // Never show or store a "level" label
          const opts = [
            { id: "none", label: t("onboarding.expNone") },
            { id: "little", label: t("onboarding.expLittle") },
            { id: "notes", label: t("onboarding.expNotes") }
          ];
          const showSkipHelper = state.experience === "little" || state.experience === "notes";

          stepContent = `
            <h1 class="serif-heading" style="font-size:1.5rem;margin-bottom:16px;">${escapeHtml(t("onboarding.expTitle"))}</h1>
            ${opts
              .map(
                (o) => `
                  <button type="button" class="m-card choice-card ${state.experience === o.id ? "selected" : ""}" data-action="set-onboard-field" data-field="experience" data-value="${o.id}">
                    <span style="font-weight:700;">${escapeHtml(o.label)}</span>
                    <span>${state.experience === o.id ? "●" : "○"}</span>
                  </button>
                `
              )
              .join("")}
            ${
              showSkipHelper
                ? `<div class="m-card surface-fill" style="margin:12px 0 20px;padding:12px 16px;font-size:0.88rem;color:var(--secondary);font-weight:600;">
                    ✨ ${escapeHtml(t("onboarding.expSkipHelper"))}
                  </div>`
                : `<div style="height:12px;"></div>`
            }
            <button type="button" class="btn-pill btn-primary btn-block" data-action="onboard-next">
              ${escapeHtml(t("onboarding.continue"))}
            </button>
          `;
        } else if (step === 4) {
          const goals = [
            { val: 5, title: t("onboarding.goal5"), desc: t("onboarding.goal5Desc") },
            { val: 15, title: t("onboarding.goal15"), desc: t("onboarding.goal15Desc") },
            { val: 30, title: t("onboarding.goal30"), desc: t("onboarding.goal30Desc") }
          ];

          stepContent = `
            <h1 class="serif-heading" style="font-size:1.5rem;margin-bottom:16px;">${escapeHtml(t("onboarding.goalTitle"))}</h1>
            ${goals
              .map(
                (g) => `
                  <button type="button" class="m-card choice-card ${Number(state.dailyGoal) === g.val ? "selected" : ""}" data-action="set-onboard-field" data-field="dailyGoal" data-value="${g.val}">
                    <div>
                      <div style="font-weight:800;font-size:1rem;">${escapeHtml(g.title)}</div>
                      <div style="font-size:0.83rem;color:var(--muted);">${escapeHtml(g.desc)}</div>
                    </div>
                    <span>${Number(state.dailyGoal) === g.val ? "●" : "○"}</span>
                  </button>
                `
              )
              .join("")}
            <button type="button" class="btn-pill btn-primary btn-block" style="margin-top:14px;" data-action="onboard-next">
              ${escapeHtml(t("onboarding.continue"))}
            </button>
          `;
        } else if (step === 5) {
          const motives = [
            { id: "self", label: t("onboarding.motiveSelf") },
            { id: "song", label: t("onboarding.motiveSong") },
            { id: "pro", label: t("onboarding.motivePro") },
            { id: "child", label: t("onboarding.motiveChild") }
          ];
          const curM = state.motivations || [];

          stepContent = `
            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
              <h1 class="serif-heading" style="font-size:1.45rem;">${escapeHtml(t("onboarding.motiveTitle"))}</h1>
              <button type="button" style="color:var(--secondary);font-weight:700;font-size:0.88rem;text-decoration:underline;" data-action="onboard-next">${escapeHtml(t("onboarding.skip"))}</button>
            </div>
            <p style="font-size:0.88rem;color:var(--muted);margin-bottom:18px;">${escapeHtml(t("onboarding.motiveSub"))}</p>
            <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px;">
              ${motives
                .map((m) => {
                  const sel = curM.includes(m.id);
                  return `
                    <button type="button" class="chip-btn ${sel ? "selected" : ""}" data-action="toggle-motive" data-motive="${m.id}">
                      <span>${sel ? "✓" : "+"}</span>
                      <span>${escapeHtml(m.label)}</span>
                    </button>
                  `;
                })
                .join("")}
            </div>
            <button type="button" class="btn-pill btn-primary btn-block" data-action="onboard-next">
              ${escapeHtml(t("onboarding.continue"))}
            </button>
          `;
        } else if (step === 6) {
          stepContent = `
            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
              <h1 class="serif-heading" style="font-size:1.45rem;">${escapeHtml(t("onboarding.reminderTitle"))}</h1>
              <button type="button" style="color:var(--secondary);font-weight:700;font-size:0.88rem;text-decoration:underline;" data-action="skip-reminder">${escapeHtml(t("onboarding.later"))}</button>
            </div>
            <p style="font-size:0.88rem;color:var(--muted);margin-bottom:18px;">${escapeHtml(t("onboarding.reminderSub"))}</p>
            <div class="m-card" style="margin-bottom:20px;text-align:center;">
              <label style="display:block;font-size:0.85rem;font-weight:700;color:var(--muted);margin-bottom:10px;">
                ${escapeHtml(t("onboarding.reminderLabel"))}
              </label>
              <input type="time" id="onboard-reminder-input" class="m-input" style="max-width:180px;margin:0 auto;text-align:center;font-size:1.25rem;font-weight:800;" value="${escapeHtml(state.reminderTime || "19:00")}" />
            </div>
            <button type="button" class="btn-pill btn-primary btn-block" data-action="save-onboard-reminder">
              ${escapeHtml(t("onboarding.reminderSaveBtn"))}
            </button>
          `;
        } else {
          // Step 7: Summary
          const accessLabel =
            state.access === "yes"
              ? t("onboarding.accessYes")
              : state.access === "phone"
              ? t("onboarding.accessPhone")
              : t("onboarding.accessNo");

          stepContent = `
            <div class="m-card" style="text-align:center;padding:24px 18px;">
              <div style="width:128px;margin:0 auto 14px;">
                ${renderArchPlaceholder({ imageUrl: ASSETS.todayPlan, ratio: "compact", uid: "summary" })}
              </div>
              <h1 class="serif-heading" style="font-size:1.48rem;margin-bottom:8px;">${escapeHtml(t("onboarding.summaryTitle"))}</h1>
              <p style="font-size:0.95rem;color:var(--secondary);font-weight:700;margin-bottom:18px;">
                ${escapeHtml(t("onboarding.summaryPlanLine", { goal: state.dailyGoal }))}
              </p>

              <div class="m-card surface-fill" style="text-align:start;margin-bottom:20px;box-shadow:none;font-size:0.88rem;display:flex;flex-direction:column;gap:8px;">
                <div style="display:flex;justify-content:space-between;">
                  <span style="color:var(--muted);">${escapeHtml(t("onboarding.summaryInst"))}</span>
                  <strong>${escapeHtml(t("instruments.piano"))}</strong>
                </div>
                <div style="display:flex;justify-content:space-between;">
                  <span style="color:var(--muted);">${escapeHtml(t("onboarding.summaryAccess"))}</span>
                  <strong>${escapeHtml(accessLabel)}</strong>
                </div>
                <div style="display:flex;justify-content:space-between;">
                  <span style="color:var(--muted);">${escapeHtml(t("onboarding.summaryGoal"))}</span>
                  <strong>${escapeHtml(t("onboarding.summaryGoalVal", { goal: state.dailyGoal }))}</strong>
                </div>
                <div style="display:flex;justify-content:space-between;">
                  <span style="color:var(--muted);">${escapeHtml(t("onboarding.summaryReminder"))}</span>
                  <strong>${escapeHtml(state.reminderTime ? toLocaleDigits(state.reminderTime) : t("onboarding.summaryReminderNotSet"))}</strong>
                </div>
              </div>

              <button type="button" class="btn-pill btn-primary btn-block" data-action="finish-onboarding">
                ${escapeHtml(t("onboarding.goToHomeBtn"))}
              </button>
            </div>
          `;
        }

        return `
          <div class="mobile-shell">
            <div class="onboard-header">
              <button type="button" class="btn-pill btn-surface" style="min-height:36px;padding:6px 12px;font-size:0.82rem;" data-action="onboard-back">
                ${escapeHtml(t("onboarding.back"))}
              </button>
              <div class="progress-dots" aria-label="Onboarding Progress">
                ${dotsHtml}
              </div>
              ${
                step === 1
                  ? `<button type="button" class="lang-switch-pill" data-action="toggle-lang">🌐 ${escapeHtml(t("nav.langToggle"))}</button>`
                  : `<div style="width:52px;"></div>`
              }
            </div>
            <div class="screen-body no-bottom-nav">
              ${stepContent}
            </div>
          </div>
        `;
      }

      /* ==========================================================================
         MOBILE HOME SCREEN (MOCKUP 2)
         ========================================================================== */
      function getNextUnlockedLesson() {
        for (const lesson of LESSONS) {
          if (!state.completedLessons.includes(lesson.id)) {
            return lesson;
          }
        }
        return null;

      /* ==========================================================================
         MOBILE LEARNING PATH SCREEN (MOCKUP 5)
         ========================================================================== */
      function renderPathScreen() {
        const nextLesson = getNextUnlockedLesson();
        const currentLessonId = nextLesson ? nextLesson.id : -1;

        // Group lessons by chapter
        const chapters = [];
        for (const lesson of LESSONS) {
          const chName = lField(lesson.chapter);
          let group = chapters.find((c) => c.name === chName);
          if (!group) {
            group = { name: chName, lessons: [] };
            chapters.push(group);
          }
          group.lessons.push(lesson);
        }

        const chaptersHtml = chapters
          .map((ch, chIdx) => {
            const cards = ch.lessons
              .map((lesson) => {
                const isDone = state.completedLessons.includes(lesson.id);
                const isCurrent = lesson.id === currentLessonId;
                const isUnlocked = isDone || isCurrent || state.completedLessons.includes(lesson.id - 1) || lesson.id === 1;
                const statusClass = isCurrent ? "current" : !isUnlocked ? "locked" : "";

                let statusBadge = "";
                if (isDone) {
                  statusBadge = `<span class="path-status-circle done" title="${escapeHtml(t("path.statusDone"))}">✓</span>`;
                } else if (isCurrent) {
                  statusBadge = `<span class="path-status-circle current" title="${escapeHtml(t("path.statusCurrent"))}"><span class="dir-flip">▶</span></span>`;
                } else {
                  statusBadge = `<span class="path-status-circle locked" title="${escapeHtml(t("path.statusLocked"))}">🔒</span>`;
                }

                return `
                  <button type="button" class="m-card path-lesson-card ${statusClass}" data-action="path-lesson-tap" data-lesson-id="${lesson.id}" data-unlocked="${isUnlocked}">
                    ${isCurrent ? `<span class="path-now-badge">${escapeHtml(t("path.statusCurrent"))}</span>` : ""}
                    <div class="path-icon-box">
                      ${getInstrumentSvg("piano")}
                    </div>
                    <div style="flex:1;min-width:0;">
                      <div style="font-weight:800;font-size:0.98rem;">
                        ${toLocaleDigits(lesson.id)}. ${escapeHtml(lField(lesson.title))}
                      </div>
                      <div style="font-size:0.8rem;color:var(--muted);">
                        ${toLocaleDigits(lesson.minutes)} ${escapeHtml(t("path.minutesUnit"))} · ${escapeHtml(
                          isDone ? t("path.statusDone") : isCurrent ? t("path.statusCurrent") : t("path.statusLocked")
                        )}
                      </div>
                    </div>
                    ${statusBadge}
                  </button>
                `;
              })
              .join("");

            return `
              <section class="chapter-block">
                <h2 class="chapter-heading serif-heading">${escapeHtml(ch.name)}</h2>
                ${cards}
                ${chIdx < chapters.length - 1 ? renderStaffWaveDivider() : ""}
              </section>
            `;
          })
          .join("");

        return `
          <div class="mobile-shell">
            <header class="mobile-topbar mobile-topbar-center">
              <div class="brand-logo">MUSICHER</div>
            </header>
            <main class="screen-body">
              <h1 class="serif-heading" style="font-size:1.65rem;margin-bottom:18px;">${escapeHtml(t("path.title"))}</h1>
              ${chaptersHtml}
            </main>
            ${renderBottomNav("path")}
          </div>
        `;
      }

            <circle cx="44" cy="24" r="3" fill="currentColor"/>

         ========================================================================== */
      function findAdvisorReply(queryText) {
        const norm = String(queryText || "").trim().toLowerCase();
        for (const item of MISTAKES) {
          const matched = (item.keywords || []).some((kw) => norm.includes(String(kw).toLowerCase()));
          if (matched) {
            return {
              found: true,
              cause: lField(item.cause),
              fix: lField(item.fix),
              lessonId: item.lessonId
            };
          }
        }
        return { found: false };
      }

      /* ==========================================================================
         MAIN RENDER & EVENT DELEGATION
         ========================================================================== */
      function render() {
        applyDocumentLangAndTheme();
        const root = document.getElementById("app-root");
        if (!root) return;

        let screenHtml = "";
        switch (ui.screen) {
          case "splash":
            screenHtml = renderSplashScreen();
            break;
          case "welcome":
            screenHtml = renderWelcomeScreen();
            break;
          case "signin":
            screenHtml = renderSignInScreen();
            break;
          case "onboarding":
            screenHtml = renderOnboardingScreen();
            break;
          case "home":
            screenHtml = renderHomeScreen();
            break;
          case "path":
            screenHtml = renderPathScreen();
            break;
          case "lesson":
            screenHtml = renderLessonScreen();
            break;
          case "skipQuiz":
            screenHtml = renderSkipQuizScreen();
            break;
          case "advisor":
            screenHtml = renderAdvisorScreen();
            break;
          case "library":
            screenHtml = renderLibraryScreen();
            break;
          case "profile":
            screenHtml = renderProfileScreen();
            break;
          default:
            screenHtml = renderHomeScreen();
        }

        const toastHtml = ui.toastMessage
          ? `<div class="toast-banner" role="status">${escapeHtml(ui.toastMessage)}</div>`
          : "";

        root.innerHTML = screenHtml + renderModal() + toastHtml;
      }

      // Global click & form handlers
      document.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-action]");
        if (!btn) return;
        const action = btn.getAttribute("data-action");

        switch (action) {
          case "toggle-lang":
            toggleLanguage();
            break;

          case "set-lang": {
            const newLang = btn.getAttribute("data-lang");
            if (newLang === "en" || newLang === "fa") {
              state.lang = newLang;
              saveState();
              render();
            }
            break;
          }

          case "start-onboarding":
            state.onboardingStep = 1;
            ui.pendingOtherInstrument = null;
            ui.screen = "onboarding";
            saveState();
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
            break;

          case "go-signin":
            ui.screen = "signin";
            render();
            break;

          case "back-to-welcome":
            ui.screen = "welcome";
            render();
            break;

          case "continue-guest":
            state.isGuest = true;
            ui.screen = state.onboardingComplete ? "home" : "onboarding";
            saveState();
            render();
            break;

          case "onboard-back":
            if (state.onboardingStep > 1) {
              state.onboardingStep -= 1;
              saveState();
              render();
            } else {
              ui.screen = "welcome";
              render();
            }
            break;

          case "select-onboard-inst": {
            const isAct = btn.getAttribute("data-active") === "true";
            if (isAct) {
              state.instrument = "piano";
              ui.pendingOtherInstrument = null;
            } else {
              ui.pendingOtherInstrument = btn.getAttribute("data-inst");
            }
            saveState();
            render();
            break;
          }

          case "onboard-next":
            state.instrument = "piano";
            ui.pendingOtherInstrument = null;
            if (state.onboardingStep < 7) {
              state.onboardingStep += 1;
            }
            saveState();
            render();
            break;

          case "set-onboard-field": {
            const field = btn.getAttribute("data-field");
            const val = btn.getAttribute("data-value");
            state[field] = field === "dailyGoal" ? Number(val) : val;
            saveState();
            render();
            break;
          }

          case "toggle-motive": {
            const m = btn.getAttribute("data-motive");
            const list = state.motivations || [];
            if (list.includes(m)) {
              state.motivations = list.filter((x) => x !== m);
            } else {
              state.motivations = [...list, m];
            }
            saveState();
            render();
            break;
          }

          case "save-onboard-reminder": {
            const inp = document.getElementById("onboard-reminder-input");
            if (inp && inp.value) state.reminderTime = inp.value;
            state.onboardingStep = 7;
            saveState();
            render();
            break;
          }

          case "skip-reminder":
            state.reminderTime = "";
            state.onboardingStep = 7;
            saveState();
            render();
            break;

          case "finish-onboarding":
            state.onboardingComplete = true;
            ui.screen = "home";
            saveState();
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
            break;

          case "nav-tab": {
            const tab = btn.getAttribute("data-tab");
            ui.screen = tab;
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
            break;
          }

          case "open-lesson": {
            const lid = Number(btn.getAttribute("data-lesson-id")) || 1;
            ui.activeLessonId = lid;
            ui.lessonStepIndex = 0;
            ui.selfCheckState = {};
            ui.quizSelected = null;
            ui.quizAnswered = false;
            ui.screen = "lesson";
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
            break;
          }

          case "path-lesson-tap": {
            const unlocked = btn.getAttribute("data-unlocked") === "true";
            const lid = Number(btn.getAttribute("data-lesson-id"));
            if (!unlocked) {
              showToast(t("path.lockedToast"));
              return;
            }
            ui.activeLessonId = lid;
            ui.lessonStepIndex = 0;
            ui.selfCheckState = {};
            ui.quizSelected = null;
            ui.quizAnswered = false;
            ui.screen = "lesson";
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
            break;
          }

          case "close-lesson":
            ui.screen = "home";
            render();
            break;

          case "lesson-next-step":
            ui.lessonStepIndex = Math.min(4, ui.lessonStepIndex + 1);
            ui.quizSelected = null;
            ui.quizAnswered = false;
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
            break;

          case "lesson-prev-step":
            ui.lessonStepIndex = Math.max(0, ui.lessonStepIndex - 1);
            ui.quizSelected = null;
            ui.quizAnswered = false;
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
            break;

          case "toggle-self-check": {
            const idx = Number(btn.getAttribute("data-index"));
            ui.selfCheckState[idx] = !ui.selfCheckState[idx];
            render();
            break;
          }

          case "answer-lesson-quiz": {
            const qIdx = Number(btn.getAttribute("data-q-index"));
            const optIdx = Number(btn.getAttribute("data-opt-index"));
            const lesson = LESSONS.find((l) => l.id === Number(ui.activeLessonId)) || LESSONS[0];
            const qObj = lesson.quiz?.[qIdx];
            ui.quizSelected = optIdx;
            ui.quizAnswered = true;
            ui.quizIsRight = qObj ? optIdx === Number(qObj.correctIndex) : true;
            render();
            break;
          }

          case "complete-and-exit-lesson": {
            const lid = Number(btn.getAttribute("data-lesson-id"));
            const nameInp = document.getElementById("l1-name-input");
            const emailInp = document.getElementById("l1-email-input");
            if (nameInp && nameInp.value.trim()) {
              state.userName = nameInp.value.trim();
              state.isGuest = false;
            }
            if (emailInp && emailInp.value.trim()) {
              state.userEmail = emailInp.value.trim();
            }
            recordLessonCompletion(lid);
            ui.screen = "path";
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
            break;
          }

          case "start-skip-quiz": {
            const lid = Number(btn.getAttribute("data-lesson-id"));
            ui.activeLessonId = lid;
            ui.skipQuizIndex = 0;
            ui.skipQuizFailed = false;
            ui.skipQuizPassed = false;
            ui.screen = "skipQuiz";
            render();
            break;
          }

          case "answer-skip-quiz": {
            const optIdx = Number(btn.getAttribute("data-opt-index"));
            const lesson = LESSONS.find((l) => l.id === Number(ui.activeLessonId)) || LESSONS[0];
            const quizzes = lesson.quiz || [];
            const qObj = quizzes[ui.skipQuizIndex];
            if (qObj && optIdx === Number(qObj.correctIndex)) {
              if (ui.skipQuizIndex + 1 < quizzes.length) {
                ui.skipQuizIndex += 1;
              } else {
                recordLessonCompletion(lesson.id);
                ui.skipQuizPassed = true;
              }
            } else {
              ui.skipQuizFailed = true;
            }
            render();
            break;
          }

          case "advisor-chip": {
            const q = btn.getAttribute("data-query");
            const res = findAdvisorReply(q);
            state.advisorHistory = [...(state.advisorHistory || []), { query: q, ...res }];
            saveState();
            render();
            break;
          }

          case "set-library-tab": {
            ui.libraryTab = btn.getAttribute("data-tab");
            render();
            break;
          }

          case "toggle-teacher-inst": {
            const inst = btn.getAttribute("data-inst");
            const cur = state.teacherNotifyInstruments || [];
            if (cur.includes(inst)) {
              state.teacherNotifyInstruments = cur.filter((x) => x !== inst);
            } else {
              state.teacherNotifyInstruments = [...cur, inst];
            }
            ui.teacherSavedBanner = false;
            saveState();
            render();
            break;
          }

          case "save-teacher-notify": {
            const cur = state.teacherNotifyInstruments || [];
            if (cur.length === 0) {
              showToast(t("library.selectInstHint"));
              return;
            }
            ui.teacherSavedBanner = true;
            saveState();
            render();
            break;
          }

          case "set-theme": {
            state.theme = btn.getAttribute("data-theme-val");
            saveState();
            render();
            break;
          }

          case "open-modal":
            ui.modal = btn.getAttribute("data-modal");
            render();
            break;

          case "close-modal":
            ui.modal = null;
            render();
            break;

          case "confirm-reset": {
            const keepLang = state.lang;
            state = { ...DEFAULT_STATE, lang: keepLang };
            saveState();
            ui.modal = null;
            ui.screen = "welcome";
            render();
            break;
          }
        }
      });

      document.addEventListener("change", (e) => {
        const sel = e.target.closest("[data-action='profile-select']");
        if (!sel) return;
        const field = sel.getAttribute("data-field");
        state[field] = field === "dailyGoal" ? Number(sel.value) : sel.value;
        saveState();
        showToast(t("profile.savedToast"));
      });

      document.addEventListener("input", (e) => {
        if (e.target.id === "library-search-input") {
          ui.librarySearch = e.target.value;
          render();
          const inp = document.getElementById("library-search-input");
          if (inp) {
            inp.focus();
            inp.setSelectionRange(inp.value.length, inp.value.length);
          }
        }
      });

      document.addEventListener("submit", (e) => {
        if (e.target.id === "signin-form") {
          e.preventDefault();
          const fd = new FormData(e.target);
          const email = String(fd.get("email") || "").trim();
          if (email) state.userEmail = email;
          state.isGuest = true;
          saveState();
          ui.screen = state.onboardingComplete ? "home" : "onboarding";
          render();
        } else if (e.target.id === "advisor-form") {
          e.preventDefault();
          const inp = document.getElementById("advisor-input");
          const q = inp ? inp.value.trim() : "";
          if (!q) return;
          const res = findAdvisorReply(q);
          state.advisorHistory = [...(state.advisorHistory || []), { query: q, ...res }];
          saveState();
          render();
        } else if (e.target.id === "modal-account-form") {
          e.preventDefault();
          const fd = new FormData(e.target);
          state.userName = String(fd.get("userName") || "").trim();
          state.userEmail = String(fd.get("userEmail") || "").trim();
          state.isGuest = !state.userName && !state.userEmail;
          saveState();
          ui.modal = null;
          showToast(t("profile.savedToast"));
        }
      });

      /* ==========================================================================
         STARTUP LOADER (Fetch locales + 12 lessons + mistakes.json)
         ========================================================================== */
      async function bootstrapApp() {
        loadState();
        applyDocumentLangAndTheme();

        try {
          const [enRes, faRes, mistakesRes] = await Promise.all([
            fetch("locales/en.json"),
            fetch("locales/fa.json"),
            fetch("content/mistakes.json")
          ]);
          if (enRes.ok) LOCALES.en = await enRes.json();
          if (faRes.ok) LOCALES.fa = await faRes.json();
          if (mistakesRes.ok) MISTAKES = await mistakesRes.json();

          const lessonPromises = Array.from({ length: 12 }, (_, idx) => {
            const num = String(idx + 1).padStart(2, "0");
            return fetch(`content/lessons/lesson-${num}.json`).then((r) => (r.ok ? r.json() : null));
          });
          const loadedLessons = (await Promise.all(lessonPromises)).filter(Boolean);
          if (loadedLessons.length > 0) {
            LESSONS = loadedLessons.sort((a, b) => a.id - b.id);
          }
        } catch (err) {
          // Offline / file fallback safety
        }

        evaluateStreakOnLoad();

        // Returning users skip onboarding and land directly on Home
        if (state.onboardingComplete) {
          ui.screen = "home";
          render();
        } else {
          ui.screen = "splash";
          render();
          setTimeout(() => {
            if (ui.screen === "splash") {
              ui.screen = "welcome";
              render();
            }
          }, 950);
        }
      }

      bootstrapApp();
    </script>
  </body>
</html>
