      let LOCALES = {
        en: JSON.parse(JSON.stringify(FALLBACK_LOCALES.en)),
        fa: JSON.parse(JSON.stringify(FALLBACK_LOCALES.fa))
      };
      let LESSONS = [];
      let MISTAKES = [];

      function mergeLocaleData(baseObj, loadedObj) {
        if (!loadedObj || typeof loadedObj !== "object") return baseObj;
        const result = { ...baseObj, ...loadedObj };
        for (const k of Object.keys(baseObj)) {
          if (
            baseObj[k] &&
            typeof baseObj[k] === "object" &&
            !Array.isArray(baseObj[k]) &&
            loadedObj[k] &&
            typeof loadedObj[k] === "object" &&
            !Array.isArray(loadedObj[k])
          ) {
            result[k] = { ...baseObj[k], ...loadedObj[k] };
          }
        }
        return result;
      }

      /* ==========================================================================
         MULTI-COURSE HELPERS & PER-COURSE PROGRESS SYNC
         ========================================================================== */
      function getCourseMeta(courseId = state.activeCourseId || "piano") {
        return COURSES.find((c) => c.id === courseId) || COURSES[0] || DEFAULT_COURSES[0];
      }

      function getCourseLessons(courseId = state.activeCourseId || "piano") {
        const list = COURSE_LESSONS[courseId];
        return Array.isArray(list) ? list : [];
      }

      function isCourseVisible(course) {
        if (!course) return false;
        if (course.visible === false) return false;
        return getCourseLessons(course.id).length > 0;
      }

      function getVisibleCourses() {
        return [...COURSES]
          .filter((c) => isCourseVisible(c))
          .sort((a, b) => (a.order || 99) - (b.order || 99));
      }

      function isLessonUnlocked(lesson, completedLessons = state.completedLessons, currentLessonId = -1) {
        if (UNLOCK_ALL) return true;
        if (!lesson) return false;
        return (
          completedLessons.includes(lesson.id) ||
          lesson.id === currentLessonId ||
          completedLessons.includes(lesson.id - 1) ||
          lesson.id === 1
        );
      }

      function ensureCourseProgressMap() {
        if (!state.courseProgress || typeof state.courseProgress !== "object") {
          state.courseProgress = {};
        }
        if (!state.activeCourseId) {
          state.activeCourseId = "piano";
        }
        // Migrate existing Piano top-level state into courseProgress.piano if not yet present
        if (!state.courseProgress.piano) {
          state.courseProgress.piano = {
            completedLessons: Array.isArray(state.completedLessons) ? [...state.completedLessons] : [],
            streakCount: Number(state.streakCount) || 0,
            lastCompletedDate: state.lastCompletedDate || null,
            freeDayUsedWeekKey: state.freeDayUsedWeekKey || null,
            activeDaysHistory: Array.isArray(state.activeDaysHistory) ? [...state.activeDaysHistory] : []
          };
        }
        for (const c of COURSES) {
          if (!state.courseProgress[c.id]) {
            state.courseProgress[c.id] = {
              completedLessons: [],
              streakCount: 0,
              lastCompletedDate: null,
              freeDayUsedWeekKey: null,
              activeDaysHistory: []
            };
          }
        }
      }

      function syncTopLevelFromActiveCourse() {
        ensureCourseProgressMap();
        const cid = state.activeCourseId || "piano";
        const cp = state.courseProgress[cid];
        state.completedLessons = Array.isArray(cp.completedLessons) ? [...cp.completedLessons] : [];
        state.streakCount = Number(cp.streakCount) || 0;
        state.lastCompletedDate = cp.lastCompletedDate || null;
        state.freeDayUsedWeekKey = cp.freeDayUsedWeekKey || null;
        state.activeDaysHistory = Array.isArray(cp.activeDaysHistory) ? [...cp.activeDaysHistory] : [];
        LESSONS = getCourseLessons(cid);
      }

      function syncActiveCourseFromTopLevel() {
        ensureCourseProgressMap();
        const cid = state.activeCourseId || "piano";
        state.courseProgress[cid] = {
          completedLessons: Array.isArray(state.completedLessons) ? [...state.completedLessons] : [],
          streakCount: Number(state.streakCount) || 0,
          lastCompletedDate: state.lastCompletedDate || null,
          freeDayUsedWeekKey: state.freeDayUsedWeekKey || null,
          activeDaysHistory: Array.isArray(state.activeDaysHistory) ? [...state.activeDaysHistory] : []
        };
      }

      function setActiveCourse(courseId, shouldRender = false) {
        const visibleList = getVisibleCourses();
        let targetId = courseId;
        if (!targetId || !COURSES.some((c) => c.id === targetId)) {
          targetId = "piano";
        }
        const targetMeta = getCourseMeta(targetId);
        if (!isCourseVisible(targetMeta) && visibleList.length > 0) {
          targetId = visibleList[0].id;
        }
        syncActiveCourseFromTopLevel();
        state.activeCourseId = targetId;
        state.instrument = targetId;
        syncTopLevelFromActiveCourse();
        evaluateStreakOnLoad();
        saveState();
        if (shouldRender) render();
      }

      /* ==========================================================================
         STORAGE, DIGITS & THEME (Always Light on First Visit)
         ========================================================================== */
      function loadState() {
        try {
          const raw = window.localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            state = { ...DEFAULT_STATE, ...parsed };
            if (!state.userChoseTheme) {
              state.theme = "light";
            }
          }
        } catch (err) {
          // Fallback to default light state
        }
        ensureCourseProgressMap();
        syncTopLevelFromActiveCourse();
      }

      function saveState() {
        try {
          syncActiveCourseFromTopLevel();
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (err) {
          // Ignore storage error
        }
      }

      const FA_DIGITS = ["۰", "۱", "۲", "۳", "۴", "۵", "۶", "۷", "۸", "۹"];
      function toLocaleDigits(val) {
        const str = String(val ?? "");
        if (state.lang !== "fa") return str;
        return str.replace(/\d/g, (d) => FA_DIGITS[Number(d)]);
      }

      function lookupLocalePath(obj, parts) {
        let cur = obj;
        for (const p of parts) {
          cur = cur?.[p];
        }
        return cur;
      }

      function t(path, params = {}) {
        const parts = String(path || "").split(".");
        let cur = lookupLocalePath(LOCALES[state.lang], parts);
        if (cur === undefined || cur === null || cur === "") {
          cur = lookupLocalePath(LOCALES.en, parts);
        }
        if (cur === undefined || cur === null || cur === "") {
          cur = lookupLocalePath(FALLBACK_LOCALES[state.lang], parts);
        }
        if (cur === undefined || cur === null || cur === "") {
          cur = lookupLocalePath(FALLBACK_LOCALES.en, parts);
        }
        if (cur === undefined || cur === null) {
          return "";
        }
        if (typeof cur !== "string") return cur;
        return cur.replace(/\{(\w+)\}/g, (_, k) =>
          params[k] !== undefined ? toLocaleDigits(params[k]) : ""
        );
      }

      function lField(fieldObj) {
        if (fieldObj === null || fieldObj === undefined) return "";
        if (typeof fieldObj === "string" || Array.isArray(fieldObj)) return fieldObj;
        if (typeof fieldObj === "object") {
          return fieldObj[state.lang] !== undefined
            ? fieldObj[state.lang]
            : fieldObj.en !== undefined
            ? fieldObj.en
            : "";
        }
        return String(fieldObj);
      }

      function applyDocumentLangAndTheme() {
        const html = document.documentElement;
        html.lang = state.lang === "en" ? "en" : "fa";
        html.dir = state.lang === "en" ? "ltr" : "rtl";

        let effectiveTheme = "light";
        if (state.userChoseTheme) {
          if (state.theme === "dark") {
            effectiveTheme = "dark";
          } else if (state.theme === "system") {
            const prefersDark =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches;
            effectiveTheme = prefersDark ? "dark" : "light";
          }
        }
        html.setAttribute("data-theme", effectiveTheme);
      }

      function toggleLanguage() {
        state.lang = state.lang === "fa" ? "en" : "fa";
        saveState();
        applyDocumentLangAndTheme();
        render();
      }

      function showToast(msg) {
        ui.toastMessage = msg;
        if (ui.toastTimer) clearTimeout(ui.toastTimer);
        render();
        ui.toastTimer = setTimeout(() => {
          ui.toastMessage = null;
          render();
        }, 3000);
      }

      /* ==========================================================================
         STREAK & WEEKLY FREE-DAY LOGIC
         ========================================================================== */
      function getLocalDateKey(dateObj = new Date()) {
        const y = dateObj.getFullYear();
        const m = String(dateObj.getMonth() + 1).padStart(2, "0");
        const d = String(dateObj.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      }

      function parseDateKey(key) {
        const [y, m, d] = key.split("-").map(Number);
        return new Date(y, m - 1, d);
      }

      function diffDays(dateKeyA, dateKeyB) {
        const a = parseDateKey(dateKeyA);
        const b = parseDateKey(dateKeyB);
        return Math.round((b - a) / (24 * 60 * 60 * 1000));
      }

      function getWeekKey(dateKey) {
        const dt = parseDateKey(dateKey);
        const day = dt.getDay();
        const offsetSinceSat = (day + 1) % 7;
        const sat = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() - offsetSinceSat);
        return getLocalDateKey(sat);
      }

      function evaluateStreakOnLoad() {
        if (!state.lastCompletedDate) return;
        const today = getLocalDateKey();
        const gap = diffDays(state.lastCompletedDate, today);

        if (gap <= 1) return;
        if (gap === 2) {
          const missedDateObj = parseDateKey(today);
          missedDateObj.setDate(missedDateObj.getDate() - 1);
          const missedWeekKey = getWeekKey(getLocalDateKey(missedDateObj));
          if (state.freeDayUsedWeekKey !== missedWeekKey) {
            state.freeDayUsedWeekKey = missedWeekKey;
            saveState();
          } else {
            state.streakCount = 0;
            saveState();
          }
        } else if (gap > 2) {
          state.streakCount = 0;
          saveState();
        }
      }

      function recordLessonCompletion(lessonId) {
        if (!state.completedLessons.includes(lessonId)) {
          state.completedLessons.push(lessonId);
        }
        const today = getLocalDateKey();
        if (!state.activeDaysHistory.includes(today)) {
          state.activeDaysHistory.push(today);
        }

        if (!state.lastCompletedDate) {
          state.streakCount = 1;
          state.lastCompletedDate = today;
        } else {
          const gap = diffDays(state.lastCompletedDate, today);
          if (gap === 0) {
            if (state.streakCount === 0) state.streakCount = 1;
          } else if (gap === 1) {
            state.streakCount = (state.streakCount || 0) + 1;
            state.lastCompletedDate = today;
          } else if (gap === 2) {
            const missedDateObj = parseDateKey(today);
            missedDateObj.setDate(missedDateObj.getDate() - 1);
            const missedWeekKey = getWeekKey(getLocalDateKey(missedDateObj));
            if (state.freeDayUsedWeekKey !== missedWeekKey) {
              state.freeDayUsedWeekKey = missedWeekKey;
              state.streakCount = (state.streakCount || 0) + 1;
            } else {
              state.streakCount = 0;
            }
            state.lastCompletedDate = today;
          } else {
            state.streakCount = 0;
            state.lastCompletedDate = today;
          }
        }
        saveState();
      }

      function isFreeDayUsedThisWeek() {
        const todayWeek = getWeekKey(getLocalDateKey());
        return state.freeDayUsedWeekKey === todayWeek;
      }

                <line x1="358" y1="96" x2="382" y2="96" stroke="${INK}" stroke-width="1.6" />
                <ellipse cx="370" cy="96" rx="6.6" ry="4.7" transform="rotate(-18 370 96)" fill="${INK}" />

                <!-- D4 (space below 1st line at y=90, stem up) -->

                <line x1="428" y1="88" x2="428" y2="53" stroke="${INK}" stroke-width="1.7" stroke-linecap="round" />
                <text x="422" y="25" text-anchor="middle" fill="${INK}" font-size="10.5" font-weight="700">D4</text>

                <!-- E4 (1st line from bottom at y=84, stem up) -->
                <ellipse cx="474" cy="84" rx="6.6" ry="4.7" transform="rotate(-18 474 84)" fill="${INK}" />
                <line x1="480" y1="82" x2="480" y2="47" stroke="${INK}" stroke-width="1.7" stroke-linecap="round" />
                <text x="474" y="25" text-anchor="middle" fill="${INK}" font-size="10.5" font-weight="700">E4</text>

                <!-- Slur curving smoothly under C4 - D4 - E4 -->
                <path d="M 366 104 C 398 116, 448 110, 478 92" fill="none" stroke="${TEAL}" stroke-width="2.2" stroke-linecap="round" />

                <!-- Slur Label -->
                <text x="406" y="136" text-anchor="middle" direction="${textDir}" fill="${INK}" font-family="var(--font-body)" font-size="12" font-weight="700">${slurLbl}</text>
              </svg>
            </div>
          `;
        }

        // Lesson 29 notation diagram: Bass Clef (5-line staff, two dots straddling line 4 = F3, landmark notes C3, F3, G3, C4)
        if (type === "bass-clef") {
          const isFa = state.lang === "fa";
          const textDir = isFa ? "rtl" : "ltr";
          const captionLbl = escapeHtml(t("diagrams.bassClefCaption") || "Bass clef (F clef): two dots surround line 4 (F3) · Left-hand notes");
          const dotsLbl = escapeHtml(t("diagrams.bassClefDotsLabel") || "Line 4 = F3");
          // 5 staff lines from top (line 5, y=46) to bottom (line 1, y=94), step = 12px (half-space = 6px)
          // Line 5 (top): y=46 (A3)
          // Space 4: y=52 (G3)
          // Line 4: y=58 (F3)  <-- highlighted between the two bass-clef dots
          // Space 3: y=64 (E3)
          // Line 3: y=70 (D3)
          // Space 2: y=76 (C3) <-- low C
          // Line 2: y=82 (B2)
          // Space 1: y=88 (A2)
          // Line 1 (bottom): y=94 (G2)
          // Ledger line above staff: y=34 (Middle C = C4)
          const staffLines = [46, 58, 70, 82, 94]
            .map((y) => {
              const isLine4 = y === 58;
              return `<line x1="28" y1="${y}" x2="512" y2="${y}" stroke="${isLine4 ? RED : INK}" stroke-width="${isLine4 ? "1.9" : "1.35"}" stroke-opacity="${isLine4 ? "0.95" : "0.78"}" />`;
            })
            .join("");

          return `
            <div class="keyboard-diagram-wrap" dir="ltr" style="direction:ltr;width:100%;max-width:560px;margin:14px auto 0;">
              <svg viewBox="0 0 540 166" width="540" height="166" dir="ltr" style="direction:ltr;width:100%;max-width:560px;height:auto;display:block;margin:0 auto;font-family:var(--font-body);" role="img" aria-label="${escapeHtml(t("diagrams.bassClefAria"))}">
                <rect x="8" y="8" width="524" height="150" rx="10" fill="${PAPER}" stroke="${INK}" stroke-width="1.6" />
                ${staffLines}

                <!-- Bass Clef symbol + two prominent red dots straddling Line 4 (y=58) -->
                <circle cx="52" cy="58" r="5" fill="${INK}" />
                <path d="M 52 58 C 46 44, 68 42, 70 58 C 72 74, 56 88, 44 93" fill="none" stroke="${INK}" stroke-width="3.2" stroke-linecap="round" />
                <circle cx="80" cy="52" r="3.4" fill="${RED}" />
                <circle cx="80" cy="64" r="3.4" fill="${RED}" />
                <rect x="92" y="15" width="84" height="20" rx="10" fill="${PAPER}" stroke="${RED}" stroke-width="1.3" />
                <text x="134" y="29" text-anchor="middle" direction="${textDir}" fill="${RED}" font-size="10.5" font-weight="800">${dotsLbl}</text>
                <path d="M 110 35 L 86 50" stroke="${RED}" stroke-width="1.2" stroke-dasharray="2 2" />

                <!-- C3 in 2nd space from bottom (y=76), stem up -->
                <ellipse cx="186" cy="76" rx="7.2" ry="5.1" transform="rotate(-18 186 76)" fill="${SAFFRON}" stroke="${INK}" stroke-width="2" />
                <line x1="192.5" y1="74" x2="192.5" y2="40" stroke="${INK}" stroke-width="1.8" stroke-linecap="round" />
                <text x="186" y="116" text-anchor="middle" fill="${INK}" font-size="11.5" font-weight="800">${isFa ? "C3 (دو بم)" : "C3 (Low C)"}</text>

                <!-- F3 on 4th line from bottom (y=58), stem down -->
                <ellipse cx="282" cy="58" rx="7.2" ry="5.1" transform="rotate(-18 282 58)" fill="${RED}" stroke="${INK}" stroke-width="2" />
                <line x1="275.5" y1="60" x2="275.5" y2="94" stroke="${INK}" stroke-width="1.8" stroke-linecap="round" />
                <text x="282" y="116" text-anchor="middle" fill="${RED}" font-size="11.5" font-weight="800">${isFa ? "F3 (فا · خط ۴)" : "F3 (Line 4)"}</text>

                <!-- G3 in top space (y=52), stem down -->
                <ellipse cx="376" cy="52" rx="7.2" ry="5.1" transform="rotate(-18 376 52)" fill="${TEAL}" stroke="${INK}" stroke-width="2" />
                <line x1="369.5" y1="54" x2="369.5" y2="88" stroke="${INK}" stroke-width="1.8" stroke-linecap="round" />
                <text x="376" y="116" text-anchor="middle" fill="${TEAL}" font-size="11.5" font-weight="800">${isFa ? "G3 (سل)" : "G3 (Top space)"}</text>

                <!-- Middle C (C4) on ledger line above bass staff (y=34), stem down -->
                <line x1="454" y1="34" x2="486" y2="34" stroke="${INK}" stroke-width="1.8" />
                <ellipse cx="470" cy="34" rx="7.2" ry="5.1" transform="rotate(-18 470 34)" fill="${SAFFRON}" stroke="${INK}" stroke-width="2" />
                <line x1="463.5" y1="36" x2="463.5" y2="70" stroke="${INK}" stroke-width="1.8" stroke-linecap="round" />
                <text x="470" y="116" text-anchor="middle" fill="${INK}" font-size="11.5" font-weight="800">${isFa ? "C4 (دوی وسط)" : "C4 (Middle C)"}</text>

                <!-- Bottom Caption -->
                <text x="270" y="143" text-anchor="middle" direction="${textDir}" fill="${INK}" font-family="var(--font-body)" font-size="12" font-weight="700">${captionLbl}</text>
              </svg>
            </div>
          `;
        }

        // Lesson 30 notation diagram: Grand Staff (Treble staff + Bass staff joined by brace, Middle C on ledger line between them)
        if (type === "grand-staff") {
          const isFa = state.lang === "fa";
          const textDir = isFa ? "rtl" : "ltr";
          const captionLbl = escapeHtml(t("diagrams.grandStaffCaption") || "Grand Staff: Treble (right hand) + Bass (left hand) joined at Middle C (C4)");
          const trebleLbl = escapeHtml(t("diagrams.grandStaffTrebleLabel") || "Treble · Right hand");
          const bassLbl = escapeHtml(t("diagrams.grandStaffBassLabel") || "Bass · Left hand");
          const midCLbl = escapeHtml(t("diagrams.grandStaffMiddleCLabel") || "Middle C (C4)");

          // Top staff (Treble): 5 lines at y = 26, 36, 46, 56, 66 (10px spacing, 5px per step)
          //   Line 1 (bottom): E4 = 66, Line 2: G4 = 56, Space 3: C5 = 41
          // Middle C (C4): ledger line right in the middle at y = 86
          // Bottom staff (Bass): 5 lines at y = 106, 116, 126, 136, 146 (10px spacing, 5px per step)
          //   Line 4: F3 = 116, Space 2: C3 = 131
          const trebleLines = [26, 36, 46, 56, 66]
            .map((y) => `<line x1="48" y1="${y}" x2="512" y2="${y}" stroke="${INK}" stroke-width="1.25" stroke-opacity="0.78" />`)
            .join("");
          const bassLines = [106, 116, 126, 136, 146]
            .map((y) => `<line x1="48" y1="${y}" x2="512" y2="${y}" stroke="${INK}" stroke-width="1.25" stroke-opacity="0.78" />`)
            .join("");

          return `
            <div class="keyboard-diagram-wrap" dir="ltr" style="direction:ltr;width:100%;max-width:560px;margin:14px auto 0;">
              <svg viewBox="0 0 540 194" width="540" height="194" dir="ltr" style="direction:ltr;width:100%;max-width:560px;height:auto;display:block;margin:0 auto;font-family:var(--font-body);" role="img" aria-label="${escapeHtml(t("diagrams.grandStaffAria"))}">
                <rect x="8" y="8" width="524" height="178" rx="10" fill="${PAPER}" stroke="${INK}" stroke-width="1.6" />

                <!-- Left connecting barline and curved piano brace -->
                <line x1="48" y1="26" x2="48" y2="146" stroke="${INK}" stroke-width="2.2" />
                <path d="M 42 26 C 28 32, 34 76, 22 86 C 34 96, 28 140, 42 146" fill="none" stroke="${INK}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

                ${trebleLines}
                ${bassLines}

                <!-- Treble Clef on top staff -->
                <text x="55" y="61" fill="${INK}" font-size="42" font-family="serif">𝄞</text>

                <!-- Bass Clef on bottom staff -->
                <circle cx="62" cy="116" r="4.2" fill="${INK}" />
                <path d="M 62 116 C 57 104, 75 103, 77 116 C 79 129, 65 140, 55 145" fill="none" stroke="${INK}" stroke-width="2.8" stroke-linecap="round" />
                <circle cx="85" cy="111" r="2.6" fill="${RED}" />
                <circle cx="85" cy="121" r="2.6" fill="${RED}" />

                <!-- Staff role badges on right -->
                <text x="506" y="21" text-anchor="end" direction="${textDir}" fill="${TEAL}" font-size="10.5" font-weight="800">${trebleLbl}</text>
                <text x="506" y="160" text-anchor="end" direction="${textDir}" fill="${TEAL}" font-size="10.5" font-weight="800">${bassLbl}</text>

                <!-- Bass landmark C3 (space 2, y=131) -->
                <ellipse cx="146" cy="131" rx="6.5" ry="4.6" transform="rotate(-18 146 131)" fill="${INK}" />
                <line x1="152" y1="129" x2="152" y2="101" stroke="${INK}" stroke-width="1.6" />
                <text x="146" y="159" text-anchor="middle" fill="${INK}" font-size="10.5" font-weight="800">C3</text>

                <!-- Bass landmark F3 (line 4, y=116) -->
                <ellipse cx="212" cy="116" rx="6.5" ry="4.6" transform="rotate(-18 212 116)" fill="${RED}" />
                <line x1="206" y1="118" x2="206" y2="144" stroke="${INK}" stroke-width="1.6" />
                <text x="212" y="159" text-anchor="middle" fill="${RED}" font-size="10.5" font-weight="800">F3</text>

                <!-- MIDDLE C (C4) on ledger line at y=86 right between both staves -->
                <line x1="274" y1="86" x2="310" y2="86" stroke="${INK}" stroke-width="2" />
                <ellipse cx="292" cy="86" rx="7.6" ry="5.3" transform="rotate(-18 292 86)" fill="${SAFFRON}" stroke="${INK}" stroke-width="2" />
                <rect x="242" y="69" width="100" height="19" rx="9.5" fill="${SAFFRON}" stroke="${INK}" stroke-width="1.3" transform="translate(0, -21)" />
                <text x="292" y="61" text-anchor="middle" direction="${textDir}" fill="${INK}" font-size="10.5" font-weight="800">${midCLbl}</text>

                <!-- Treble landmark G4 (line 2, y=56) -->
                <ellipse cx="378" cy="56" rx="6.5" ry="4.6" transform="rotate(-18 378 56)" fill="${TEAL}" />
                <line x1="384" y1="54" x2="384" y2="26" stroke="${INK}" stroke-width="1.6" />
                <text x="378" y="81" text-anchor="middle" fill="${TEAL}" font-size="10.5" font-weight="800">G4</text>

                <!-- Treble landmark C5 (space 3, y=41) -->
                <ellipse cx="446" cy="41" rx="6.5" ry="4.6" transform="rotate(-18 446 41)" fill="${INK}" />
                <line x1="440" y1="43" x2="440" y2="71" stroke="${INK}" stroke-width="1.6" />
                <text x="446" y="81" text-anchor="middle" fill="${INK}" font-size="10.5" font-weight="800">C5</text>

                <!-- Bottom Caption -->
                <text x="270" y="177" text-anchor="middle" direction="${textDir}" fill="${INK}" font-family="var(--font-body)" font-size="11.8" font-weight="700">${captionLbl}</text>
              </svg>
            </div>
          `;
        }

        const isFingerDiagram = type === "finger-numbers";
        const isFindC = type === "find-c";
        const isNoteNames = type === "note-names";
        const isScaleC = type === "scale-c-major";
        const isScaleG = type === "scale-g-major";
        const isScaleDiagram = isScaleC || isScaleG;

        if (!isFindC && !isNoteNames && !isFingerDiagram && !isScaleDiagram && !opts.whiteKeys) {
          return "";
        }

        const numWhiteKeys = opts.whiteKeys || (isFingerDiagram ? 5 : 14);
        const highlightC = opts.highlightC !== undefined ? opts.highlightC : (isFindC || isNoteNames);
        const showOnlyCLabel = opts.showOnlyCLabel !== undefined ? opts.showOnlyCLabel : isFindC;
        const showAllLabels = opts.showAllLabels !== undefined ? opts.showAllLabels : (isNoteNames || isFingerDiagram);
        const showPersianSub = opts.showPersianSub !== undefined ? opts.showPersianSub : (state.lang === "fa" && (isNoteNames || isScaleDiagram));
        const showFindCArrows = opts.showFindCArrows !== undefined ? opts.showFindCArrows : isFindC;
        const showFingerBadges = opts.showFingerBadges !== undefined ? opts.showFingerBadges : isFingerDiagram;

        // Scale white-key and black-key highlight sets
        const scaleWhiteSet = isScaleC
          ? new Set([0, 1, 2, 3, 4, 5, 6, 7]) // C4..C5
          : isScaleG
          ? new Set([4, 5, 6, 7, 8, 9, 11])   // G3 A3 B3 C4 D4 E4 (skip F4=10) G4=11
          : null;
        const scaleBlackSet = isScaleG ? new Set([10]) : null; // F#4 is after white key index 10

        const latinNotes = Array.isArray(t("diagrams.latinNotes"))
          ? t("diagrams.latinNotes")
          : ["C", "D", "E", "F", "G", "A", "B"];
        const persianNotes = Array.isArray(t("diagrams.persianNotes"))
          ? t("diagrams.persianNotes")
          : ["دو", "ر", "می", "فا", "سل", "لا", "سی"];

        const wkW = isFingerDiagram ? 56 : 36;
        const wkH = isFingerDiagram ? 142 : 148;
        const bkW = isFingerDiagram ? 34 : 22;
        const bkH = isFingerDiagram ? 86 : 90;

        const padX = isFingerDiagram ? 30 : 14;
        const topY = showFingerBadges ? 76 : isScaleDiagram ? 46 : 14;
        const bottomSpace = showFindCArrows ? 48 : isScaleDiagram ? 50 : 14;
        const totalW = numWhiteKeys * wkW + padX * 2;
        const totalH = topY + wkH + bottomSpace;

        let whiteKeysSvg = "";
        let blackKeysSvg = "";
        let overlaysSvg = "";

        // 1. Draw White Keys starting at C (index 0 = C, 1 = D, 2 = E, 3 = F, 4 = G, 5 = A, 6 = B)
        for (let i = 0; i < numWhiteKeys; i++) {
          const step = i % 7;
          const isC = step === 0;
          const x = padX + i * wkW;
          const isScaleWhite = scaleWhiteSet ? scaleWhiteSet.has(i) : false;
          const fill = isScaleDiagram ? (isScaleWhite ? SAFFRON : PAPER) : (highlightC && isC ? SAFFRON : PAPER);

          whiteKeysSvg += `
            <rect x="${x}" y="${topY}" width="${wkW}" height="${wkH}" rx="5" fill="${fill}" stroke="${INK}" stroke-width="1.6" />
          `;

          if (showOnlyCLabel && isC) {
            const showFaUnderC = state.lang === "fa";
            const faCLbl = persianNotes[0] || "دو";
            const cLabelY = showFaUnderC ? topY + wkH - 29 : topY + wkH - 18;
            whiteKeysSvg += `
              <text x="${x + wkW / 2}" y="${cLabelY}" text-anchor="middle" fill="${INK}" font-family="var(--font-body)" font-size="14" font-weight="700" letter-spacing="0">C</text>
            `;
            if (showFaUnderC) {
              whiteKeysSvg += `
                <text x="${x + wkW / 2}" y="${topY + wkH - 10}" text-anchor="middle" fill="${INK}" font-family="var(--font-body)" font-size="13.5" font-weight="800" style="font-weight:800;" letter-spacing="0">${escapeHtml(faCLbl)}</text>
              `;
            }
          } else if (showAllLabels || (isScaleDiagram && isScaleWhite)) {
            const latinLbl = latinNotes[step] || "";
            const faLbl = persianNotes[step] || "";
            const latinY = showPersianSub ? topY + wkH - 29 : topY + wkH - 16;

            whiteKeysSvg += `
              <text x="${x + wkW / 2}" y="${latinY}" text-anchor="middle" fill="${INK}" font-family="var(--font-body)" font-size="${isFingerDiagram ? 14 : 12.5}" font-weight="700" letter-spacing="0">${escapeHtml(latinLbl)}</text>
            `;
            if (showPersianSub) {
              whiteKeysSvg += `
                <text x="${x + wkW / 2}" y="${topY + wkH - 10}" text-anchor="middle" fill="${INK}" font-family="var(--font-body)" font-size="13.5" font-weight="800" style="font-weight:800;" letter-spacing="0">${escapeHtml(faLbl)}</text>
              `;
            }
          }
        }

        // 2. Draw Black Keys:
        const blackKeyOffsets = {
          0: 0.56, // C# (slightly left of C-D boundary)
          1: 0.44, // D# (slightly right of D-E boundary)
          3: 0.58, // F# (slightly left of F-G boundary)
          4: 0.50, // G# (centered on G-A boundary)
          5: 0.42  // A# (slightly right of A-B boundary)
        };

        const blackKeyCenters = {};
        for (let i = 0; i < numWhiteKeys - 1; i++) {
          const step = i % 7;
          if (blackKeyOffsets[step] !== undefined) {
            const boundaryX = padX + (i + 1) * wkW;
            const bx = Math.round((boundaryX - bkW * blackKeyOffsets[step]) * 10) / 10;
            blackKeyCenters[i] = bx + bkW / 2;
            const isScaleBlack = scaleBlackSet ? scaleBlackSet.has(i) : false;
            const bkFill = isScaleBlack ? SAFFRON : INK;
            blackKeysSvg += `
              <rect x="${bx}" y="${topY}" width="${bkW}" height="${bkH}" rx="3.5" fill="${bkFill}" stroke="${INK}" stroke-width="1.5" />
            `;
            if (isScaleBlack) {
              blackKeysSvg += `
                <text x="${bx + bkW / 2}" y="${topY + bkH - 12}" text-anchor="middle" fill="${INK}" font-family="var(--font-body)" font-size="10.5" font-weight="800">F♯</text>
              `;
            }
          }
        }

        // 3. Diagram 1 ("find-c"): Larger red arrows placed below the keyboard, pointing up to each C key
        if (showFindCArrows) {
          const keyBottomY = topY + wkH;
          for (let octStart = 0; octStart < numWhiteKeys; octStart += 7) {
            const cCenterX = padX + octStart * wkW + wkW / 2;
            const tipY = keyBottomY + 6;
            const tailY = keyBottomY + 38;

            overlaysSvg += `
              <g fill="none" stroke="${RED}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <line x1="${cCenterX}" y1="${tailY}" x2="${cCenterX}" y2="${tipY}" />
                <path d="M ${cCenterX - 8} ${tipY + 9} L ${cCenterX} ${tipY} L ${cCenterX + 8} ${tipY + 9}" />
              </g>
            `;
          }
        }

        // 4. Diagram 3 ("finger-numbers"): Right hand label + 5 circles numbered 1..5 aligned over C D E F G
        if (showFingerBadges) {
          const fingerColors = [
            { bg: RED, fg: PAPER },
            { bg: SAFFRON, fg: INK },
            { bg: TEAL, fg: PAPER },
            { bg: RED, fg: PAPER },
            { bg: SAFFRON, fg: INK }
          ];
          const rightHandText = escapeHtml(t("diagrams.rightHand"));
          overlaysSvg += `
            <text x="${totalW / 2}" y="22" text-anchor="middle" fill="${INK}" font-family="var(--font-body)" font-size="13.5" font-weight="700" letter-spacing="0">${rightHandText}</text>
          `;

          for (let i = 0; i < Math.min(5, numWhiteKeys); i++) {
            const cx = padX + i * wkW + wkW / 2;
            const cy = 48;
            const col = fingerColors[i % fingerColors.length];
            const numStr = toLocaleDigits(i + 1);

            overlaysSvg += `
              <line x1="${cx}" y1="${cy + 15}" x2="${cx}" y2="${topY - 3}" stroke="${INK}" stroke-width="1.3" stroke-dasharray="2.5 2.5" opacity="0.55" />
              <circle cx="${cx}" cy="${cy}" r="15" fill="${col.bg}" stroke="${INK}" stroke-width="1.6" />
              <text x="${cx}" y="${cy + 4.5}" text-anchor="middle" fill="${col.fg}" font-family="var(--font-body)" font-size="13.5" font-weight="700" letter-spacing="0">${escapeHtml(numStr)}</text>
            `;
          }
        }

        // 5. Scale Diagrams ("scale-c-major" & "scale-g-major"): Finger numbers 1-2-3-1-2-3-4-5 above + two red half-step brackets below
        if (isScaleDiagram) {
          const keyBottomY = topY + wkH;
          const halfLbl = escapeHtml(t("diagrams.halfStepShort") || "½");
          const scaleNodes = isScaleC
            ? [
                { cx: padX + 0 * wkW + wkW / 2, finger: 1 },
                { cx: padX + 1 * wkW + wkW / 2, finger: 2 },
                { cx: padX + 2 * wkW + wkW / 2, finger: 3 },
                { cx: padX + 3 * wkW + wkW / 2, finger: 1, thumbUnder: true },
                { cx: padX + 4 * wkW + wkW / 2, finger: 2 },
                { cx: padX + 5 * wkW + wkW / 2, finger: 3 },
                { cx: padX + 6 * wkW + wkW / 2, finger: 4 },
                { cx: padX + 7 * wkW + wkW / 2, finger: 5 }
              ]
            : [
                { cx: padX + 4 * wkW + wkW / 2, finger: 1 },
                { cx: padX + 5 * wkW + wkW / 2, finger: 2 },
                { cx: padX + 6 * wkW + wkW / 2, finger: 3 },
                { cx: padX + 7 * wkW + wkW / 2, finger: 1, thumbUnder: true },
                { cx: padX + 8 * wkW + wkW / 2, finger: 2 },
                { cx: padX + 9 * wkW + wkW / 2, finger: 3 },
                { cx: blackKeyCenters[10] || (padX + 10.6 * wkW), finger: 4 },
                { cx: padX + 11 * wkW + wkW / 2, finger: 5 }
              ];

          for (const nd of scaleNodes) {
            const cy = 22;
            const bgCol = nd.thumbUnder ? TEAL : PAPER;
            const fgCol = nd.thumbUnder ? PAPER : INK;
            overlaysSvg += `
              <line x1="${nd.cx}" y1="${cy + 11}" x2="${nd.cx}" y2="${topY - 2}" stroke="${INK}" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.5" />
              <circle cx="${nd.cx}" cy="${cy}" r="11" fill="${bgCol}" stroke="${INK}" stroke-width="1.4" />
              <text x="${nd.cx}" y="${cy + 4}" text-anchor="middle" fill="${fgCol}" font-family="var(--font-body)" font-size="11.5" font-weight="700">${escapeHtml(toLocaleDigits(nd.finger))}</text>
            `;
          }

          // Two half-step red brackets (steps 3-4 and steps 7-8)
          const halfStepPairs = [
            [scaleNodes[2].cx, scaleNodes[3].cx],
            [scaleNodes[6].cx, scaleNodes[7].cx]
          ];
          for (const [x1, x2] of halfStepPairs) {
            const midX = (x1 + x2) / 2;
            const bTop = keyBottomY + 6;
            const bBot = keyBottomY + 19;
            overlaysSvg += `
              <g fill="none" stroke="${RED}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M ${x1} ${bTop} L ${x1} ${bBot} L ${x2} ${bBot} L ${x2} ${bTop}" />
              </g>
              <text x="${midX}" y="${bBot + 16}" text-anchor="middle" direction="${state.lang === "fa" ? "rtl" : "ltr"}" fill="${RED}" font-family="var(--font-body)" font-size="11.5" font-weight="800">${halfLbl}</text>
            `;
          }
        }

        const ariaKey = isFindC
          ? "diagrams.findCAria"
          : isNoteNames
          ? "diagrams.noteNamesAria"
          : isScaleC
          ? "diagrams.scaleCMajorAria"
          : isScaleG
          ? "diagrams.scaleGMajorAria"
          : "diagrams.fingerNumbersAria";

        return `
          <div class="keyboard-diagram-wrap" dir="ltr" style="direction:ltr;width:100%;max-width:560px;margin:14px auto 0;">
            <svg viewBox="0 0 ${totalW} ${totalH}" width="${totalW}" height="${totalH}" dir="ltr" style="direction:ltr;width:100%;max-width:560px;height:auto;display:block;margin:0 auto;font-family:var(--font-body);" role="img" aria-label="${escapeHtml(t(ariaKey))}">
              ${whiteKeysSvg}
              ${blackKeysSvg}
              ${overlaysSvg}
            </svg>
          </div>
        `;
      }
      window.drawKeyboard = drawKeyboard;

      /* ==========================================================================
         EDUCATIONAL VIRTUAL PIANO ENGINE (Web Audio API + Full 88-Key A0..C8 Range)
         - Practice tool only: no recording, no saving performances, no composing, no export
         - Full 88-key piano (A0 to C8: 52 white keys, 36 black keys)
         - Sliding visible window: 3 octaves on desktop (22 white keys), 2 on tablet (15), 1.5 on mobile (11)
         - Octave buttons ("◀ Octave" / "Octave ▶"), current range label (e.g. "C3–C6"), and interactive 88-key mini-map strip
         - Desktop shortcuts: Z = octave down, X = octave up; key mapping follows the visible window
         ========================================================================== */
      const VPIANO_WHITE_KEYS = [];
      const VPIANO_BLACK_KEYS = [];
      const VPIANO_ALL_BY_NOTE = {};

      (function build88KeyPianoData() {
        const letters = ["C", "D", "E", "F", "G", "A", "B"];
        const semitoneFromC = [0, 2, 4, 5, 7, 9, 11];
        const blackSpecByStep = {
          0: { sharp: "C#", flat: "Db", faLabel: "دو دیز", offsetRatio: 0.56 },
          1: { sharp: "D#", flat: "Eb", faLabel: "ر دیز", offsetRatio: 0.44 },
          3: { sharp: "F#", flat: "Gb", faLabel: "فا دیز", offsetRatio: 0.58 },
          4: { sharp: "G#", flat: "Ab", faLabel: "سل دیز", offsetRatio: 0.50 },
          5: { sharp: "A#", flat: "Bb", faLabel: "لا دیز", offsetRatio: 0.42 }
        };

        // MIDI 21 (A0) to MIDI 108 (C8)
        let whiteIdx = 0;
        for (let octave = 0; octave <= 8; octave++) {
          for (let step = 0; step < 7; step++) {
            const midi = (octave + 1) * 12 + semitoneFromC[step];
            if (midi < 21 || midi > 108) continue;
            const letter = letters[step];
            const note = `${letter}${octave}`;
            const wk = {
              note,
              letter,
              octave,
              step,
              midi,
              whiteIdx
            };
            VPIANO_WHITE_KEYS.push(wk);
            VPIANO_ALL_BY_NOTE[note] = wk;

            // Black key immediately after this white key (if within A0..C8, i.e. midi + 1 < 108)
            const bSpec = blackSpecByStep[step];
            if (bSpec && midi + 1 < 108) {
              const bNote = `${bSpec.sharp}${octave}`;
              const bk = {
                note: bNote,
                flatNote: `${bSpec.flat}${octave}`,
                label: bSpec.sharp,
                faLabel: bSpec.faLabel,
                octave,
                afterWhiteIdx: whiteIdx,
                offsetRatio: bSpec.offsetRatio,
                midi: midi + 1
              };
              VPIANO_BLACK_KEYS.push(bk);
              VPIANO_ALL_BY_NOTE[bNote] = bk;
              VPIANO_ALL_BY_NOTE[bk.flatNote] = bk;
            }
            whiteIdx += 1;
          }
        }
      })();

      // Middle C (C4) is whiteIdx 23; C3 is whiteIdx 16
      const VPIANO_C3_WHITE_IDX = 16;
      const VPIANO_C4_WHITE_IDX = 23;

      function getPianoWindowWhiteCount() {
        const w = typeof window !== "undefined" ? window.innerWidth : 1200;
        if (w >= 1100) return 22; // 3 octaves (e.g. C3–C6)
        if (w >= 700) return 15; // 2 octaves (e.g. C3–C5)
        return 11; // 1.5 octaves (e.g. C4–F5), min 40px white key width
      }

      function getDefaultPianoWindowStart(whiteCount = getPianoWindowWhiteCount()) {
        if (whiteCount >= 15) return VPIANO_C3_WHITE_IDX;
        return VPIANO_C4_WHITE_IDX;
      }

      function clampPianoWindowStart(startIdx, whiteCount = getPianoWindowWhiteCount()) {
        const maxStart = Math.max(0, VPIANO_WHITE_KEYS.length - whiteCount);
        return Math.max(0, Math.min(maxStart, Math.round(startIdx)));
      }

      function getPianoWindowStartWhiteIdx() {
        const count = getPianoWindowWhiteCount();
        if (ui.pianoWindowStartWhiteIdx === null || ui.pianoWindowStartWhiteIdx === undefined) {
          ui.pianoWindowStartWhiteIdx = getDefaultPianoWindowStart(count);
        }
        return clampPianoWindowStart(ui.pianoWindowStartWhiteIdx, count);
      }

      function getPianoWindowRangeLabel(startIdx = getPianoWindowStartWhiteIdx(), count = getPianoWindowWhiteCount()) {
        const firstWk = VPIANO_WHITE_KEYS[startIdx] || VPIANO_WHITE_KEYS[0];
        const lastWk =
          VPIANO_WHITE_KEYS[Math.min(VPIANO_WHITE_KEYS.length - 1, startIdx + count - 1)] ||
          VPIANO_WHITE_KEYS[VPIANO_WHITE_KEYS.length - 1];
        return `${firstWk.note}–${lastWk.note}`;
      }

      // Dynamic computer keyboard mapping that follows the visible window
      function getActiveComputerKeyMap() {
        const count = getPianoWindowWhiteCount();
        const startIdx = getPianoWindowStartWhiteIdx();
        const anchorWhiteIdx =
          count >= 22 && startIdx >= 9 && startIdx + 7 + 10 < VPIANO_WHITE_KEYS.length
            ? startIdx + 7
            : startIdx;

        const whiteKeyChars = ["a", "s", "d", "f", "g", "h", "j", "k", "l", ";", "'"];
        const blackKeyChars = ["w", "e", "r", "t", "y", "u", "i", "o", "p", "["];
        const map = {};

        for (let i = 0; i < whiteKeyChars.length; i++) {
          const wIdx = anchorWhiteIdx + i;
          const wk = VPIANO_WHITE_KEYS[wIdx];
          if (!wk) break;
          map[whiteKeyChars[i]] = wk.note;
          if (i < blackKeyChars.length) {
            const bk = VPIANO_BLACK_KEYS.find((b) => b.afterWhiteIdx === wIdx);
            if (bk) {
              map[blackKeyChars[i]] = bk.note;
            }
          }
        }
        return map;
      }

      function updatePianoWindowDOM(smooth = true) {
        const count = getPianoWindowWhiteCount();
        const startIdx = getPianoWindowStartWhiteIdx();
        const maxStart = Math.max(0, VPIANO_WHITE_KEYS.length - count);
        const rangeLabel = getPianoWindowRangeLabel(startIdx, count);
        const stageWidthPct = (VPIANO_WHITE_KEYS.length / count) * 100;
        const translatePct = (startIdx / VPIANO_WHITE_KEYS.length) * 100;

        document.querySelectorAll(".vpiano-keys-stage").forEach((stage) => {
          stage.style.transition = smooth ? "transform 0.28s cubic-bezier(0.22, 1, 0.36, 1)" : "none";
          stage.style.width = `max(${stageWidthPct.toFixed(4)}%, ${VPIANO_WHITE_KEYS.length * 40}px)`;
          stage.style.transform = `translateX(-${translatePct.toFixed(4)}%)`;
        });

        document.querySelectorAll(".vpiano-minimap-window").forEach((winEl) => {
          winEl.style.transition = smooth
            ? "left 0.24s cubic-bezier(0.22, 1, 0.36, 1), width 0.24s cubic-bezier(0.22, 1, 0.36, 1)"
            : "none";
          winEl.style.left = `${((startIdx / VPIANO_WHITE_KEYS.length) * 100).toFixed(3)}%`;
          winEl.style.width = `${((count / VPIANO_WHITE_KEYS.length) * 100).toFixed(3)}%`;
        });

        document.querySelectorAll(".vpiano-octave-range-badge").forEach((badge) => {
          badge.textContent = rangeLabel;
        });

        document.querySelectorAll("[data-action='vpiano-octave-down']").forEach((btn) => {
          btn.disabled = startIdx <= 0;
        });
        document.querySelectorAll("[data-action='vpiano-octave-up']").forEach((btn) => {
          btn.disabled = startIdx >= maxStart;
        });
      }

      function setPianoWindowStartWhiteIdx(newStartIdx, smooth = true) {
        const count = getPianoWindowWhiteCount();
        ui.pianoWindowStartWhiteIdx = clampPianoWindowStart(newStartIdx, count);
        updatePianoWindowDOM(smooth);
      }

      function shiftPianoOctave(deltaOctaves, smooth = true) {
        const count = getPianoWindowWhiteCount();
        const cur = getPianoWindowStartWhiteIdx();
        const next = clampPianoWindowStart(cur + deltaOctaves * 7, count);
        ui.pianoWindowStartWhiteIdx = next;
        updatePianoWindowDOM(smooth);
      }

      function ensurePianoNoteVisible(noteName, smooth = true) {
        if (!noteName) return;
        const meta = VPIANO_ALL_BY_NOTE[noteName];
        if (!meta) return;
        const count = getPianoWindowWhiteCount();
        const curStart = getPianoWindowStartWhiteIdx();
        const curEnd = curStart + count - 1;

        const noteMinWhite = meta.whiteIdx !== undefined ? meta.whiteIdx : meta.afterWhiteIdx;
        const noteMaxWhite = meta.whiteIdx !== undefined ? meta.whiteIdx : meta.afterWhiteIdx + 1;

        if (noteMinWhite >= curStart && noteMaxWhite <= curEnd) {
          return;
        }

        let desiredStart = curStart;
        if (noteMinWhite < curStart) {
          const targetWk = VPIANO_WHITE_KEYS[noteMinWhite];
          const cIdx = noteMinWhite - (targetWk ? targetWk.step : 0);
          desiredStart = Math.max(0, cIdx);
        } else if (noteMaxWhite > curEnd) {
          const minNeeded = noteMaxWhite - count + 2;
          const octSteps = Math.ceil((minNeeded - curStart) / 7);
          desiredStart = curStart + Math.max(1, octSteps) * 7;
        }
        setPianoWindowStartWhiteIdx(desiredStart, smooth);
      }

      let pianoAudioCtx = null;

      function getOrCreatePianoAudioCtx() {
        if (!pianoAudioCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            pianoAudioCtx = new AudioCtx();
          }
        }
        return pianoAudioCtx;
      }

      function unlockPianoAudio() {
        try {
          const ctx = getOrCreatePianoAudioCtx();
          if (!ctx) return;
          if (ctx.state === "suspended") {
            ctx.resume();
          }
          const buffer = ctx.createBuffer(1, 1, 22050);
          const source = ctx.createBufferSource();
          source.buffer = buffer;
          source.connect(ctx.destination);
          if (source.start) source.start(0);
          if (!ui.pianoAudioUnlocked) {
            ui.pianoAudioUnlocked = true;
            const hintBtns = document.querySelectorAll("[data-action='vpiano-unlock-audio']");
            hintBtns.forEach((btn) => {
              btn.classList.add("unlocked");
              btn.innerHTML = `<span>🔊</span><span>${escapeHtml(t("piano.soundEnabled"))}</span>`;
            });
          }
        } catch (err) {
          // Ignore audio unlock error
        }
      }

      function playPianoNoteSound(noteName, durationSec = 1.35) {
        try {
          unlockPianoAudio();
          const ctx = getOrCreatePianoAudioCtx();
          if (!ctx) return;
          const keyMeta = VPIANO_ALL_BY_NOTE[noteName];
          const midi = keyMeta ? keyMeta.midi : 60;
          const freq = 440 * Math.pow(2, (midi - 69) / 12);
          const now = ctx.currentTime;

          const masterGain = ctx.createGain();
          masterGain.gain.setValueAtTime(0.0001, now);
          masterGain.gain.linearRampToValueAtTime(0.32, now + 0.008);
          masterGain.gain.exponentialRampToValueAtTime(0.11, now + 0.18);
          masterGain.gain.exponentialRampToValueAtTime(0.0001, now + durationSec);

          const filter = ctx.createBiquadFilter();
          filter.type = "lowpass";
          filter.frequency.setValueAtTime(Math.min(9000, freq * 6.5), now);
          filter.frequency.exponentialRampToValueAtTime(Math.max(400, freq * 2.1), now + 0.45);

          const osc1 = ctx.createOscillator();
          osc1.type = "triangle";
          osc1.frequency.setValueAtTime(freq, now);

          const osc2 = ctx.createOscillator();
          osc2.type = "sine";
          osc2.frequency.setValueAtTime(freq * 2, now);
          const gain2 = ctx.createGain();
          gain2.gain.setValueAtTime(0.24, now);
          gain2.gain.exponentialRampToValueAtTime(0.01, now + durationSec * 0.75);

          const osc3 = ctx.createOscillator();
          osc3.type = "sine";
          osc3.frequency.setValueAtTime(freq * 3, now);
          const gain3 = ctx.createGain();
          gain3.gain.setValueAtTime(0.08, now);
          gain3.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

          osc1.connect(filter);
          osc2.connect(gain2);
          gain2.connect(filter);
          osc3.connect(gain3);
          gain3.connect(filter);

          filter.connect(masterGain);
          masterGain.connect(ctx.destination);

          osc1.start(now);
          osc2.start(now);
          osc3.start(now);

          const stopTime = now + durationSec + 0.03;
          osc1.stop(stopTime);
          osc2.stop(stopTime);
          osc3.stop(stopTime);
        } catch (err) {
          // Ignore synthesis error
        }
      }

      function formatNoteWithSolfege(noteName) {
        const meta = VPIANO_ALL_BY_NOTE[noteName];
        if (!meta) return noteName;
        const persianNotes = Array.isArray(t("diagrams.persianNotes"))
          ? t("diagrams.persianNotes")
          : ["دو", "ر", "می", "فا", "سل", "لا", "سی"];
        if (state.lang === "fa") {
          if (meta.step !== undefined) {
            const faName = persianNotes[meta.step] || "";
            return `${noteName} (${faName})`;
          }
          if (meta.faLabel) {
            return `${noteName} (${meta.faLabel})`;
          }
        }
        return noteName;
      }

      function stopMultiPracticeTimers() {
        const mp = ui.multiPractice;
        if (mp.timers && mp.timers.length > 0) {
          for (const tmr of mp.timers) clearTimeout(tmr);
        }
        mp.timers = [];
        mp.playingDemo = false;
        mp.demoIdx = -1;
        if (mp.timerInterval) {
          clearInterval(mp.timerInterval);
          mp.timerInterval = null;
        }
        mp.timerRunning = false;
        if (ui.metronomeInterval) {
          clearInterval(ui.metronomeInterval);
          ui.metronomeInterval = null;
        }
        ui.metronomeRunning = false;
        ui.metronomeBeatIdx = -1;
      }

      function stopPianoWatchDemo() {
        const pp = ui.pianoPractice;
        if (pp.watchTimers && pp.watchTimers.length > 0) {
          for (const tmr of pp.watchTimers) clearTimeout(tmr);
        }
        pp.watchTimers = [];
        pp.watchPlaying = false;
        pp.watchActiveIdx = -1;
        document.querySelectorAll(".vpiano-key.is-pressed").forEach((el) => {
          el.classList.remove("is-pressed");
        });
        stopMultiPracticeTimers();
      }

      const RHYTHM_TOOL_PRESETS = {
        "4/4-steady": { meter: "4/4", tempo: 72, pattern: "1 1 1 1 | 1 1 2" },
        "3/4-waltz": { meter: "3/4", tempo: 76, pattern: "1 1 1 | 2 1" },
        "4/4-rests": { meter: "4/4", tempo: 70, pattern: "1 1 r1 1 | 1 r1 2" },
        "6/8-shirazi": { meter: "6/8", tempo: 84, pattern: "1.5 1.5 | 1 0.5 1.5" }
      };

      function getActivePracticeContextLesson() {
        if (ui.screen === "library" && (ui.libraryTab === "tools" || ui.libraryTab === "piano")) {
          if (ui.activePracticeTool === "rhythm-tap") {
            const preset = RHYTHM_TOOL_PRESETS[ui.toolRhythmPreset] || RHYTHM_TOOL_PRESETS["4/4-steady"];
            return {
              id: `tool-rhythm-${ui.toolRhythmPreset}`,
              practice: {
                type: "rhythm-tap",
                meter: preset.meter,
                tempo: preset.tempo,
                pattern: preset.pattern
              }
            };
          }
          if (ui.activePracticeTool === "ear-game") {
            return {
              id: `tool-ear-${ui.toolEarMode}`,
              practice: {
                type: "ear-choice",
                mode: ui.toolEarMode || "higher-lower",
                rounds: 6
              }
            };
          }
          if (ui.activePracticeTool === "breath-timer") {
            return {
              id: `tool-timer-${ui.toolTimerSeconds}`,
              practice: {
                type: "timer",
                seconds: Number(ui.toolTimerSeconds) || 60,
                cue: {
                  en: t("library.timerDefaultCue"),
                  fa: t("library.timerDefaultCue")
                }
              }
            };
          }
        }
        return LESSONS.find((l) => l.id === Number(ui.activeLessonId)) || LESSONS[0];
      }

      function getPracticeLessonKey(lesson) {
        if (lesson && typeof lesson.id === "string" && lesson.id.startsWith("tool-")) {
          return lesson.id;
        }
        return `${state.activeCourseId || "piano"}-${lesson ? lesson.id : 0}`;
      }

      function markLessonPracticeCompleted(lesson) {
        if (!lesson) return;
        const key = getPracticeLessonKey(lesson);
        ui.pianoPractice.completedByLesson[lesson.id] = true;
        ui.pianoPractice.completedByLesson[key] = true;
        ui.selfCheckState[0] = true;
        ui.selfCheckState[1] = true;
      }

      function isLessonPracticeCompleted(lesson) {
        if (!lesson) return false;
        const key = getPracticeLessonKey(lesson);
        return Boolean(
          ui.pianoPractice.completedByLesson[key] ||
          ((state.activeCourseId || "piano") === "piano" && ui.pianoPractice.completedByLesson[lesson.id])
        );
      }

      function getPracticeType(practice) {
        if (!practice || typeof practice !== "object") return null;
        if (practice.type) return String(practice.type);
        if (Array.isArray(practice.notes)) return "keyboard-follow";
        return null;
      }

      function syncLessonPracticeState(lesson) {
        if (!lesson || !lesson.practice) return;
        const pp = ui.pianoPractice;
        const key = getPracticeLessonKey(lesson);
        if (pp.lessonId !== key) {
          stopPianoWatchDemo();
          pp.lessonId = key;
          pp.tab = lesson.practice.mode === "watch" || lesson.practice.mode === "own" ? lesson.practice.mode : "follow";
          pp.watchPlaying = false;
          pp.watchActiveIdx = -1;
          pp.followIdx = 0;
          pp.followHint = "";
          pp.followDone = false;
          pp.ownPlayed = [];
          pp.ownStatus = "idle";
          ui.pianoWindowStartWhiteIdx = getDefaultPianoWindowStart(getPianoWindowWhiteCount());
          if (Array.isArray(lesson.practice.notes) && lesson.practice.notes[0]) {
            ensurePianoNoteVisible(lesson.practice.notes[0], false);
          }
        }
      }

      function renderVirtualPianoKeyboardHtml({ mode = "free", targetNote = null }) {
        const showLabels = !!ui.pianoShowLabels;
        const isFa = state.lang === "fa";
        const persianNotes = Array.isArray(t("diagrams.persianNotes"))
          ? t("diagrams.persianNotes")
          : ["دو", "ر", "می", "فا", "سل", "لا", "سی"];

        const totalWhite = VPIANO_WHITE_KEYS.length; // 52
        const winCount = getPianoWindowWhiteCount();
        const startIdx = getPianoWindowStartWhiteIdx();
        const maxStart = Math.max(0, totalWhite - winCount);
        const rangeLabel = getPianoWindowRangeLabel(startIdx, winCount);
        const stageWidthPct = (totalWhite / winCount) * 100;
        const translatePct = (startIdx / totalWhite) * 100;

        // 88-key Mini-map strip (52 white keys + 36 black keys + highlighted window)
        const miniWhitesHtml = VPIANO_WHITE_KEYS.map((wk) => {
          const isC4 = wk.note === "C4";
          const isTarget = mode === "follow" && targetNote === wk.note;
          return `<div class="vpiano-minimap-wkey ${isC4 ? "is-c4" : ""} ${isTarget ? "is-target" : ""}" data-white-idx="${wk.whiteIdx}"></div>`;
        }).join("");

        const miniBlacksHtml = VPIANO_BLACK_KEYS.map((bk) => {
          const leftPct = ((bk.afterWhiteIdx + 1) * (100 / totalWhite)) - (0.65 * (100 / totalWhite) * bk.offsetRatio);
          return `<div class="vpiano-minimap-bkey" style="left:${leftPct.toFixed(3)}%;"></div>`;
        }).join("");

        const miniWinLeftPct = (startIdx / totalWhite) * 100;
        const miniWinWidthPct = (winCount / totalWhite) * 100;

        const whiteKeysHtml = VPIANO_WHITE_KEYS.map((wk) => {
          const isTarget = mode === "follow" && targetNote === wk.note;
          const isC = wk.letter === "C";
          const isC4 = wk.note === "C4";
          const latinText = isC ? wk.note : wk.letter;
          const faText = persianNotes[wk.step] || "";
          return `
            <div class="vpiano-key vpiano-white-key ${isTarget ? "is-target-glow" : ""}" data-note="${wk.note}" data-white-idx="${wk.whiteIdx}" role="button" tabindex="0" aria-label="${wk.note}">
              ${isC4 ? `<span class="vpiano-C-dot" title="Middle C (C4)"></span>` : ""}

                showLabels
                  ? `<span class="vpiano-key-labels">
                      <span class="vpiano-lbl-latin">${escapeHtml(latinText)}</span>
                      ${isFa ? `<span class="vpiano-lbl-fa">${escapeHtml(faText)}</span>` : ""}
                    </span>`
                  : ""
              }
            </div>
          `;
        }).join("");

        const singleWhitePct = 100 / totalWhite;
        const blackWidthPct = singleWhitePct * 0.64;

        const blackKeysHtml = VPIANO_BLACK_KEYS.map((bk) => {
          const isTarget = mode === "follow" && (targetNote === bk.note || targetNote === bk.flatNote);
          const boundaryPct = (bk.afterWhiteIdx + 1) * singleWhitePct;
          const leftPct = boundaryPct - blackWidthPct * bk.offsetRatio;
          return `
            <div class="vpiano-key vpiano-black-key ${isTarget ? "is-target-glow" : ""}" style="left:${leftPct.toFixed(4)}%;width:${blackWidthPct.toFixed(4)}%;" data-note="${bk.note}" role="button" tabindex="0" aria-label="${bk.note}">
              ${
                showLabels
                  ? `<span class="vpiano-key-labels">
                      <span class="vpiano-lbl-latin">${escapeHtml(bk.label)}</span>
                    </span>`
                  : ""
              }
            </div>
          `;
        }).join("");

        return `
          <div class="vpiano-minimap-wrap" dir="ltr">
            <div class="vpiano-minimap" dir="ltr" role="slider" aria-label="${escapeHtml(t("piano.minimapAria"))}" aria-valuemin="0" aria-valuemax="${maxStart}" aria-valuenow="${startIdx}">
              <div class="vpiano-minimap-whites">${miniWhitesHtml}</div>
              <div class="vpiano-minimap-blacks">${miniBlacksHtml}</div>
              <div class="vpiano-minimap-window" style="left:${miniWinLeftPct.toFixed(3)}%;width:${miniWinWidthPct.toFixed(3)}%;"></div>
            </div>
          </div>

          <div class="vpiano-octave-bar" dir="ltr">
            <button type="button" class="vpiano-octave-btn" data-action="vpiano-octave-down" ${startIdx <= 0 ? "disabled" : ""}>

            </div>

              <span>${escapeHtml(t("piano.octaveUpBtn"))}</span>
            </button>
          </div>

          <div class="vpiano-scroll-wrap" dir="ltr">
            <div class="vpiano-keyboard" dir="ltr">
              <div class="vpiano-keys-stage" dir="ltr" style="width:max(${stageWidthPct.toFixed(4)}%, ${totalWhite * 40}px);transform:translateX(-${translatePct.toFixed(4)}%);">
                ${whiteKeysHtml}
                ${blackKeysHtml}
              </div>
            </div>
          </div>
        `;
      }
