      function refreshLessonPianoMount(autoCenterSmooth = true) {
        const mount = document.getElementById("vpiano-lesson-mount");
        if (!mount) return;
        const lesson = getActivePracticeContextLesson();
        if (!lesson || !lesson.practice) return;
        const prevStartIdx = getPianoWindowStartWhiteIdx();
        const wrapper = document.createElement("div");
        wrapper.innerHTML = renderLessonPracticeCard(lesson);
        const newCard = wrapper.firstElementChild;
        if (newCard) {
          const nextStartIdx = getPianoWindowStartWhiteIdx();
          mount.replaceWith(newCard);
          if (autoCenterSmooth && nextStartIdx !== prevStartIdx) {
            const stage = newCard.querySelector(".vpiano-keys-stage");
            const miniWin = newCard.querySelector(".vpiano-minimap-window");
            const totalWhite = VPIANO_WHITE_KEYS.length;
            if (stage) {
              stage.style.transition = "none";
              stage.style.transform = `translateX(-${((prevStartIdx / totalWhite) * 100).toFixed(4)}%)`;
            }
            if (miniWin) {
              miniWin.style.transition = "none";
              miniWin.style.left = `${((prevStartIdx / totalWhite) * 100).toFixed(3)}%`;
            }
            requestAnimationFrame(() => {
              requestAnimationFrame(() => updatePianoWindowDOM(true));
            });
          } else {
            updatePianoWindowDOM(autoCenterSmooth);
          }
        }
      }

      function startPianoWatchDemo() {
        const lesson = LESSONS.find((l) => l.id === Number(ui.activeLessonId)) || LESSONS[0];
        if (!lesson || !lesson.practice || !Array.isArray(lesson.practice.notes)) return;
        stopPianoWatchDemo();

        const notes = lesson.practice.notes;
        const tempo = Number(lesson.practice.tempo) || 60;
        const beatMs = Math.max(350, Math.round((60 / tempo) * 1000));
        const pp = ui.pianoPractice;
        pp.watchPlaying = true;
        pp.watchActiveIdx = 0;
        if (notes[0]) ensurePianoNoteVisible(notes[0], true);
        refreshLessonPianoMount(true);

        notes.forEach((noteName, idx) => {
          const tOn = setTimeout(() => {
            if (!pp.watchPlaying) return;
            pp.watchActiveIdx = idx;
            ensurePianoNoteVisible(noteName, true);
            refreshLessonPianoMount(true);
            playPianoNoteSound(noteName, Math.min(1.2, (beatMs / 1000) * 0.92));
            const keyEl = document.querySelector(`.vpiano-key[data-note="${noteName}"]`);
            if (keyEl) keyEl.classList.add("is-pressed");
          }, idx * beatMs);

          const tOff = setTimeout(() => {
            const keyEl = document.querySelector(`.vpiano-key[data-note="${noteName}"]`);
            if (keyEl) keyEl.classList.remove("is-pressed");
          }, idx * beatMs + Math.round(beatMs * 0.78));

          pp.watchTimers.push(tOn, tOff);
        });

        const tEnd = setTimeout(() => {
          pp.watchPlaying = false;
          pp.watchActiveIdx = -1;
          pp.watchTimers = [];
          refreshLessonPianoMount(false);
        }, notes.length * beatMs + 80);

        pp.watchTimers.push(tEnd);
      }

      function handlePianoNoteTriggered(noteName) {
        const keyMeta = VPIANO_ALL_BY_NOTE[noteName];
        if (!noteName || !keyMeta) return;
        const canonicalNote = keyMeta.note;
        playPianoNoteSound(canonicalNote);

        if (ui.screen !== "lesson" || ui.lessonStepIndex !== 0) return;
        const lesson = LESSONS.find((l) => l.id === Number(ui.activeLessonId)) || LESSONS[0];
        if (!lesson || !lesson.practice || getPracticeType(lesson.practice) !== "keyboard-follow") return;

        const notes = lesson.practice.notes;
        const pp = ui.pianoPractice;

        if (pp.tab === "follow") {
          if (pp.followDone) return;
          const targetNote = notes[pp.followIdx];
          if (!targetNote) return;
          const targetCanonical = VPIANO_ALL_BY_NOTE[targetNote]?.note || targetNote;

          if (canonicalNote === targetCanonical) {
            pp.followHint = "";
            pp.followIdx += 1;
            if (pp.followIdx >= notes.length) {
              pp.followDone = true;
              markLessonPracticeCompleted(lesson);
            } else if (notes[pp.followIdx]) {
              ensurePianoNoteVisible(notes[pp.followIdx], true);
            }
            refreshLessonPianoMount(true);
            const pressedNow = document.querySelector(`.vpiano-key[data-note="${canonicalNote}"]`);
            if (pressedNow) {
              pressedNow.classList.add("is-pressed");
              setTimeout(() => pressedNow.classList.remove("is-pressed"), 220);
            }
          } else {
            const pressedMidi = keyMeta.midi || 60;
            const targetMidi = VPIANO_ALL_BY_NOTE[targetNote]?.midi || 60;
            pp.followHint = pressedMidi < targetMidi ? "higher" : "lower";
            ensurePianoNoteVisible(targetNote, true);
            refreshLessonPianoMount(true);
            const wrongEl = document.querySelector(`.vpiano-key[data-note="${canonicalNote}"]`);
            if (wrongEl) {
              wrongEl.classList.add("is-wrong-flash");
              setTimeout(() => wrongEl.classList.remove("is-wrong-flash"), 450);
            }
          }
        } else if (pp.tab === "own") {
          if (pp.ownStatus === "success") return;
          if (pp.ownStatus === "fail") {
            pp.ownPlayed = [];
            pp.ownStatus = "idle";
          }
          pp.ownPlayed.push(canonicalNote);
          if (pp.ownPlayed.length >= notes.length) {
            const allMatch = notes.every((expected, i) => {
              const expCanon = VPIANO_ALL_BY_NOTE[expected]?.note || expected;
              return pp.ownPlayed[i] === expCanon;
            });
            if (allMatch) {
              pp.ownStatus = "success";
              markLessonPracticeCompleted(lesson);
            } else {
              pp.ownStatus = "fail";
            }
          }
          refreshLessonPianoMount(false);
          const pressedNow = document.querySelector(`.vpiano-key[data-note="${canonicalNote}"]`);
          if (pressedNow) {
            pressedNow.classList.add("is-pressed");
            setTimeout(() => pressedNow.classList.remove("is-pressed"), 220);
          }
        }
      }

      /* ==========================================================================
         SECTION 1 MULTI-COURSE PRACTICE ENGINE (Web Audio API Only, No Mic/Recording)
         Supports:
         - rhythm-tap
         - ear-choice
         - listen-sing
         - timer
         - fretboard (guitar | violin | setar | tar)
         - chord-diagram (guitar)
         - santur-map
         ========================================================================== */
      function noteToFreq(noteName, octaveOffset = 0, quarterToneShift = 0) {
        if (typeof noteName === "number") return noteName;
        const clean = String(noteName || "C4").trim();
        // Support quarter-tone koron suffix like "E4k" or "Ak3"
        const isKoron = /k/i.test(clean);
        const match = clean.replace(/k/gi, "").match(/^([A-Ga-g])([#b]?)(\d)$/);
        if (!match) return 261.63;
        const letterMap = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
        let semitone = letterMap[match[1].toUpperCase()] ?? 0;
        if (match[2] === "#") semitone += 1;
        if (match[2] === "b") semitone -= 1;
        const octave = Number(match[3]) + octaveOffset;
        const midi = (octave + 1) * 12 + semitone + (isKoron ? -0.5 : 0) + quarterToneShift;
        return 440 * Math.pow(2, (midi - 69) / 12);
      }

      function playMetronomeClickSound(isAccent = false) {
        try {
          unlockPianoAudio();
          const ctx = getOrCreatePianoAudioCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(isAccent ? 980 : 680, now);
          osc.frequency.exponentialRampToValueAtTime(220, now + 0.045);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(isAccent ? 0.25 : 0.16, now + 0.004);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.055);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.06);
        } catch (err) {}
      }

      function playRhythmDrumHitSound(accent = false) {
        try {
          unlockPianoAudio();
          const ctx = getOrCreatePianoAudioCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          // Warm Tombak / Frame-drum membrane thump + crisp snap
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(accent ? 195 : 155, now);
          osc.frequency.exponentialRampToValueAtTime(62, now + 0.14);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.38, now + 0.005);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.19);

          const snapOsc = ctx.createOscillator();
          const snapGain = ctx.createGain();
          snapOsc.type = "triangle";
          snapOsc.frequency.setValueAtTime(420, now);
          snapOsc.frequency.exponentialRampToValueAtTime(140, now + 0.035);
          snapGain.gain.setValueAtTime(0.18, now);
          snapGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.04);
          snapOsc.connect(snapGain);
          snapGain.connect(ctx.destination);
          snapOsc.start(now);
          snapOsc.stop(now + 0.045);
        } catch (err) {}
      }

      function playVocalGuideTone(noteName, durationSec = 0.85, octaveLow = false) {
        try {
          unlockPianoAudio();
          const ctx = getOrCreatePianoAudioCtx();
          if (!ctx) return;
          const freq = noteToFreq(noteName, octaveLow ? -1 : 0);
          const now = ctx.currentTime;

          const master = ctx.createGain();
          master.gain.setValueAtTime(0.0001, now);
          master.gain.linearRampToValueAtTime(0.26, now + 0.06);
          master.gain.setValueAtTime(0.24, now + Math.max(0.08, durationSec - 0.12));
          master.gain.exponentialRampToValueAtTime(0.0001, now + durationSec);

          const osc1 = ctx.createOscillator();
          osc1.type = "sine";
          osc1.frequency.setValueAtTime(freq, now);

          const osc2 = ctx.createOscillator();
          osc2.type = "triangle";
          osc2.frequency.setValueAtTime(freq, now);
          const g2 = ctx.createGain();
          g2.gain.setValueAtTime(0.35, now);

          // Gentle natural vocal vibrato (5.2 Hz)
          const lfo = ctx.createOscillator();
          const lfoGain = ctx.createGain();
          lfo.frequency.setValueAtTime(5.2, now);
          lfoGain.gain.setValueAtTime(2.2, now);
          lfo.connect(lfoGain);
          lfoGain.connect(osc1.frequency);
          lfoGain.connect(osc2.frequency);

          const filter = ctx.createBiquadFilter();
          filter.type = "lowpass";
          filter.frequency.setValueAtTime(freq * 3.5, now);

          osc1.connect(filter);
          osc2.connect(g2);
          g2.connect(filter);
          filter.connect(master);
          master.connect(ctx.destination);

          osc1.start(now);
          osc2.start(now);
          lfo.start(now);
          const stopAt = now + durationSec + 0.04;
          osc1.stop(stopAt);
          osc2.stop(stopAt);
          lfo.stop(stopAt);
        } catch (err) {}
      }

      function playStringInstrumentSound(instrument, freq, durationSec = 1.1) {
        try {
          unlockPianoAudio();
          const ctx = getOrCreatePianoAudioCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const master = ctx.createGain();
          const filter = ctx.createBiquadFilter();
          filter.type = "lowpass";

          if (instrument === "violin") {
            // Bowed string: smooth swell attack, warm harmonic sustain
            master.gain.setValueAtTime(0.0001, now);
            master.gain.linearRampToValueAtTime(0.24, now + 0.085);
            master.gain.setValueAtTime(0.21, now + Math.max(0.1, durationSec - 0.15));
            master.gain.exponentialRampToValueAtTime(0.0001, now + durationSec);

            filter.frequency.setValueAtTime(Math.min(4800, freq * 4.8), now);
            const osc1 = ctx.createOscillator();
            osc1.type = "sawtooth";
            osc1.frequency.setValueAtTime(freq, now);

            const lfo = ctx.createOscillator();
            const lfoGain = ctx.createGain();
            lfo.frequency.setValueAtTime(5.5, now);
            lfoGain.gain.setValueAtTime(2.4, now);
            lfo.connect(lfoGain);
            lfoGain.connect(osc1.frequency);

            osc1.connect(filter);
            filter.connect(master);
            master.connect(ctx.destination);
            osc1.start(now);
            lfo.start(now);
            osc1.stop(now + durationSec + 0.03);
            lfo.stop(now + durationSec + 0.03);
          } else {
            // Plucked string (guitar, setar, tar): crisp attack, resonant decay
            const isPersianLute = instrument === "setar" || instrument === "tar";
            master.gain.setValueAtTime(0.0001, now);
            master.gain.linearRampToValueAtTime(0.3, now + 0.006);
            master.gain.exponentialRampToValueAtTime(0.09, now + 0.2);
            master.gain.exponentialRampToValueAtTime(0.0001, now + durationSec);

            filter.frequency.setValueAtTime(isPersianLute ? freq * 7.5 : freq * 5.2, now);
            filter.frequency.exponentialRampToValueAtTime(freq * 1.8, now + 0.45);

            const osc1 = ctx.createOscillator();
            osc1.type = isPersianLute ? "sawtooth" : "triangle";
            osc1.frequency.setValueAtTime(freq, now);

            const osc2 = ctx.createOscillator();
            osc2.type = "sine";
            osc2.frequency.setValueAtTime(freq * 2, now);
            const g2 = ctx.createGain();
            g2.gain.setValueAtTime(isPersianLute ? 0.32 : 0.2, now);
            g2.gain.exponentialRampToValueAtTime(0.005, now + durationSec * 0.65);

            osc1.connect(filter);
            osc2.connect(g2);
            g2.connect(filter);
            filter.connect(master);
            master.connect(ctx.destination);

            osc1.start(now);
            osc2.start(now);
            osc1.stop(now + durationSec + 0.03);
            osc2.stop(now + durationSec + 0.03);
          }
        } catch (err) {}
      }

      function playSanturNoteSound(noteName, durationSec = 1.45) {
        try {
          unlockPianoAudio();
          const ctx = getOrCreatePianoAudioCtx();
          if (!ctx) return;
          const freq = noteToFreq(noteName);
          const now = ctx.currentTime;

          const master = ctx.createGain();
          master.gain.setValueAtTime(0.0001, now);
          master.gain.linearRampToValueAtTime(0.3, now + 0.004);
          master.gain.exponentialRampToValueAtTime(0.12, now + 0.16);
          master.gain.exponentialRampToValueAtTime(0.0001, now + durationSec);

          // Dual slightly-detuned strings per kharak course + metallic mezrab ping
          const oscA = ctx.createOscillator();
          oscA.type = "triangle";
          oscA.frequency.setValueAtTime(freq - 0.6, now);

          const oscB = ctx.createOscillator();
          oscB.type = "sawtooth";
          oscB.frequency.setValueAtTime(freq + 0.6, now);
          const gB = ctx.createGain();
          gB.gain.setValueAtTime(0.18, now);
          gB.gain.exponentialRampToValueAtTime(0.005, now + 0.35);

          const oscPing = ctx.createOscillator();
          oscPing.type = "sine";
          oscPing.frequency.setValueAtTime(freq * 3, now);
          const gPing = ctx.createGain();
          gPing.gain.setValueAtTime(0.14, now);
          gPing.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

          const filter = ctx.createBiquadFilter();
          filter.type = "lowpass";
          filter.frequency.setValueAtTime(Math.min(10000, freq * 8), now);
          filter.frequency.exponentialRampToValueAtTime(freq * 2.5, now + 0.6);

          oscA.connect(filter);
          oscB.connect(gB);
          gB.connect(filter);
          oscPing.connect(gPing);
          gPing.connect(filter);
          filter.connect(master);
          master.connect(ctx.destination);

          oscA.start(now);
          oscB.start(now);
          oscPing.start(now);
          const stopAt = now + durationSec + 0.04;
          oscA.stop(stopAt);
          oscB.stop(stopAt);
          oscPing.stop(stopAt);
        } catch (err) {}
      }

      function syncMultiPracticeState(lesson) {
        if (!lesson || !lesson.practice) return;
        const mp = ui.multiPractice;
        const key = getPracticeLessonKey(lesson);
        if (mp.lessonKey !== key) {
          stopMultiPracticeTimers();
          mp.lessonKey = key;
          mp.tab = "follow";
          mp.playingDemo = false;
          mp.demoIdx = -1;
          mp.rhythmStepIdx = 0;
          mp.rhythmLastTapTime = 0;
          mp.rhythmFeedback = "";
          mp.rhythmFeedbackType = "";
          mp.rhythmDone = false;
          mp.earRoundIdx = 0;
          mp.earChallenges = buildEarChallenges(lesson.practice);
          mp.earSelected = null;
          mp.earAnswered = false;
          mp.earIsRight = false;
          mp.earDone = false;
          mp.singOctaveLow = false;
          mp.singPlayedOnce = false;
          mp.singDone = false;
          const secs = Math.max(5, Number(lesson.practice.seconds) || 30);
          mp.timerTotalSec = secs;
          mp.timerRemainSec = secs;
          mp.timerRunning = false;
          mp.timerDone = false;
          mp.fretIdx = 0;
          mp.fretHint = "";
          mp.fretDone = false;
          mp.chordActiveIdx = 0;
          mp.strumIdx = 0;
          mp.strumDone = false;
          mp.santurIdx = 0;
          mp.santurHint = "";
          mp.santurDone = false;
        }
      }

      /* 1. RHYTHM-TAP ENGINE */
      function parseRhythmPattern(patternStr) {
        const rawTokens = String(patternStr || "1 1 1 1")
          .trim()
          .split(/\s+/)
          .filter(Boolean);
        const items = [];
        let eventIdx = 0;
        let beatCursor = 0;
        for (const tok of rawTokens) {
          if (tok === "|") {
            items.push({ kind: "bar" });
          } else if (/^r/i.test(tok)) {
            const beats = parseFloat(tok.slice(1)) || 1;
            items.push({ kind: "rest", beats, eventIdx, startBeat: beatCursor });
            beatCursor += beats;
            eventIdx += 1;
          } else {
            const beats = parseFloat(tok) || 1;
            items.push({ kind: "note", beats, eventIdx, startBeat: beatCursor });
            beatCursor += beats;
            eventIdx += 1;
          }
        }
        return {
          items,
          events: items.filter((it) => it.kind === "note" || it.kind === "rest"),
          totalBeats: beatCursor
        };
      }

      function formatBeatValueDisplay(beats) {
        if (Math.abs(beats - 0.33) < 0.04) return "⅓";
        if (Math.abs(beats - 0.5) < 0.04) return "½";
        return String(beats);
      }

      function scheduleRhythmAutoRestIfNeeded(lesson) {
        const mp = ui.multiPractice;
        if (!lesson || !lesson.practice || mp.rhythmDone) return;
        const parsed = parseRhythmPattern(lesson.practice.pattern);
        const curEv = parsed.events[mp.rhythmStepIdx];
        if (!curEv || curEv.kind !== "rest") return;

        const tempo = Number(lesson.practice.tempo) || 70;
        const beatMs = Math.round((60 / tempo) * 1000);
        const waitMs = Math.max(350, Math.round(curEv.beats * beatMs));
        const tmr = setTimeout(() => {
          if ((ui.screen !== "lesson" && ui.screen !== "library") || mp.rhythmDone) return;
          const checkEv = parsed.events[mp.rhythmStepIdx];
          if (!checkEv || checkEv.kind !== "rest") return;
          playMetronomeClickSound(false);
          mp.rhythmFeedback = t("practice.rhythmRestHold");
          mp.rhythmFeedbackType = "good";
          mp.rhythmStepIdx += 1;
          mp.rhythmLastTapTime = Date.now();
          if (mp.rhythmStepIdx >= parsed.events.length) {
            mp.rhythmDone = true;
            markLessonPracticeCompleted(lesson);
          } else {
            scheduleRhythmAutoRestIfNeeded(lesson);
          }
          refreshLessonPianoMount(false);
        }, waitMs);
        mp.timers.push(tmr);
      }

      function handleRhythmTapAction() {
        const lesson = getActivePracticeContextLesson();
        if (!lesson || !lesson.practice || getPracticeType(lesson.practice) !== "rhythm-tap") return;
        syncMultiPracticeState(lesson);
        const mp = ui.multiPractice;
        if (mp.playingDemo) stopMultiPracticeTimers();
        if (mp.rhythmDone) return;

        const parsed = parseRhythmPattern(lesson.practice.pattern);
        const events = parsed.events;
        if (events.length === 0) return;

        const tempo = Number(lesson.practice.tempo) || 70;
        const beatMs = Math.round((60 / tempo) * 1000);
        const curEv = events[mp.rhythmStepIdx];
        if (!curEv) return;

        if (curEv.kind === "rest") {
          mp.rhythmFeedback = t("practice.rhythmEarly");
          mp.rhythmFeedbackType = "warn";
          refreshLessonPianoMount(false);
          return;
        }

        playRhythmDrumHitSound(mp.rhythmStepIdx === 0);
        const now = Date.now();
        if (mp.rhythmStepIdx > 0 && mp.rhythmLastTapTime > 0) {
          const prevEv = events[mp.rhythmStepIdx - 1];
          const expectedMs = (prevEv ? prevEv.beats : 1) * beatMs;
          const actualMs = now - mp.rhythmLastTapTime;
          const diff = actualMs - expectedMs;
          if (Math.abs(diff) <= Math.max(220, expectedMs * 0.38)) {
            mp.rhythmFeedback = t("practice.rhythmOnTime");
            mp.rhythmFeedbackType = "good";
          } else if (diff < 0) {
            mp.rhythmFeedback = t("practice.rhythmEarly");
            mp.rhythmFeedbackType = "warn";
          } else {
            mp.rhythmFeedback = t("practice.rhythmLate");
            mp.rhythmFeedbackType = "warn";
          }
        } else {
          mp.rhythmFeedback = t("practice.rhythmOnTime");
          mp.rhythmFeedbackType = "good";
        }

        mp.rhythmLastTapTime = now;
        mp.rhythmStepIdx += 1;

        if (mp.rhythmStepIdx >= events.length) {
          mp.rhythmDone = true;
          markLessonPracticeCompleted(lesson);
        } else {
          scheduleRhythmAutoRestIfNeeded(lesson);
        }
        refreshLessonPianoMount(false);
      }

      function startRhythmDemo() {
        const lesson = getActivePracticeContextLesson();
        if (!lesson || !lesson.practice) return;
        stopMultiPracticeTimers();
        const mp = ui.multiPractice;
        const parsed = parseRhythmPattern(lesson.practice.pattern);
        const tempo = Number(lesson.practice.tempo) || 70;
        const beatMs = Math.max(320, Math.round((60 / tempo) * 1000));

        mp.playingDemo = true;
        mp.demoIdx = 0;
        refreshLessonPianoMount(false);

        parsed.events.forEach((ev, idx) => {
          const delayMs = Math.round(ev.startBeat * beatMs);
          const tmr = setTimeout(() => {
            if (!mp.playingDemo) return;
            mp.demoIdx = idx;
            if (ev.kind === "rest") {
              playMetronomeClickSound(false);
            } else {
              playMetronomeClickSound(idx === 0);
              playRhythmDrumHitSound(idx === 0);
            }
            refreshLessonPianoMount(false);
          }, delayMs);
          mp.timers.push(tmr);
        });

        const endTmr = setTimeout(() => {
          mp.playingDemo = false;
          mp.demoIdx = -1;
          refreshLessonPianoMount(false);
        }, Math.round(parsed.totalBeats * beatMs) + 120);
        mp.timers.push(endTmr);
      }

      function renderRhythmTapPracticeCard(lesson) {
        syncMultiPracticeState(lesson);
        const mp = ui.multiPractice;
        const practice = lesson.practice;
        const tempo = Number(practice.tempo) || 70;
        const meter = practice.meter || "4/4";
        const parsed = parseRhythmPattern(practice.pattern);
        const isCompleted = isLessonPracticeCompleted(lesson);

        const tokensHtml = parsed.items
          .map((it) => {
            if (it.kind === "bar") {
              return `<span class="rhythm-barline" aria-hidden="true"></span>`;
            }
            const idx = it.eventIdx;
            const isDemoActive = mp.playingDemo && mp.demoIdx === idx;
            const isDone = mp.rhythmDone || (!mp.playingDemo && idx < mp.rhythmStepIdx);
            const isCurrent = !mp.playingDemo && !mp.rhythmDone && idx === mp.rhythmStepIdx;
            const cls = [
              "rhythm-token-box",
              it.kind === "rest" ? "is-rest" : "",
              isDemoActive ? "active-demo" : "",
              isDone ? "done" : "",
              isCurrent ? "current" : ""
            ]
              .filter(Boolean)
              .join(" ");
            const iconSym = it.kind === "rest" ? "𝄽" : it.beats >= 2 ? "𝅗𝅥" : it.beats < 1 ? "♪" : "♩";
            const beatStr = formatBeatValueDisplay(it.beats);
            const lbl =
              it.kind === "rest"
                ? t("practice.rhythmRestLabel", { beats: beatStr })
                : t("practice.rhythmBeatLabel", { beats: beatStr });
            return `
              <div class="${cls}">
                <span style="font-size:1.15rem;line-height:1;">${iconSym}</span>
                <span>${escapeHtml(lbl)}</span>
              </div>
            `;
          })
          .join("");

        return `
          <div id="vpiano-lesson-mount" class="m-card vpiano-card">
            <div class="vpiano-header-row">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <span class="serif-heading" style="font-size:1.12rem;font-weight:700;">🥁 ${escapeHtml(t("practice.rhythmTitle"))}</span>
                <span style="font-size:0.8rem;font-weight:700;color:var(--secondary);background:var(--secondary-soft);border:1px solid rgba(31,111,107,0.28);border-radius:999px;padding:3px 10px;">
                  ${escapeHtml(t("practice.rhythmMeter", { meter, tempo }))}
                </span>
                ${
                  isCompleted
                    ? `<span class="badge-saffron" style="padding:3px 10px;font-size:0.74rem;background-color:var(--secondary);color:#FFF;">✓ ${escapeHtml(t("practice.completedBadge"))}</span>`
                    : ""
                }
              </div>
              <div class="vpiano-controls-row">
                <button type="button" class="btn-pill ${mp.playingDemo ? "btn-surface" : "btn-secondary"}" style="min-height:36px;padding:5px 14px;font-size:0.82rem;" data-action="mp-rhythm-demo">
                  <span>${mp.playingDemo ? "■" : "▶"}</span>
                  <span>${escapeHtml(mp.playingDemo ? t("practice.stopDemoBtn") : t("practice.playDemoBtn"))}</span>
                </button>
              </div>
            </div>

            <div class="vpiano-status-box">
              <p style="font-size:0.88rem;line-height:1.5;margin-bottom:8px;">${escapeHtml(t("practice.rhythmInstruction"))}</p>
              <div class="rhythm-pattern-row">${tokensHtml}</div>
              ${
                mp.rhythmFeedback
                  ? `<div style="margin-top:6px;font-size:0.86rem;font-weight:700;color:${mp.rhythmFeedbackType === "good" ? "var(--secondary)" : "var(--primary)"};">
                      ${escapeHtml(mp.rhythmFeedback)}
                    </div>`
                  : ""
              }
              ${
                mp.rhythmDone
                  ? `<div class="vpiano-well-done">
                      <span>🎉 ${escapeHtml(t("practice.wellDone"))} · ${escapeHtml(t("practice.completedBadge"))}</span>
                      <button type="button" class="vpiano-pill-btn" data-action="mp-reset">
                        ↻ ${escapeHtml(t("practice.playAgainBtn"))}
                      </button>
                    </div>`
                  : ""
              }
            </div>

            <button type="button" class="rhythm-tap-pad" data-action="mp-rhythm-tap">
              <span>🥁</span>
              <span>${escapeHtml(t("practice.rhythmTapBtn"))}</span>
            </button>
            <div class="vpiano-footer-hint">
              <span>${escapeHtml(t("practice.rhythmSpaceHint"))}</span>
            </div>
          </div>
        `;
      }

      /* 2. EAR-CHOICE ENGINE */
      function buildEarChallenges(practice) {
        const mode = practice.mode || "higher-lower";
        const rounds = Math.max(1, Number(practice.rounds) || 6);
        const list = [];

        const presets = {
          "higher-lower": [
            { notes: ["C4", "G4"], answer: "higher" },
            { notes: ["G4", "D4"], answer: "lower" },
            { notes: ["D4", "A4"], answer: "higher" },
            { notes: ["A4", "E4"], answer: "lower" },
            { notes: ["E4", "B4"], answer: "higher" },
            { notes: ["F4", "C4"], answer: "lower" }
          ],
          "same-different": [
            { notes: ["C4", "C4"], answer: "same" },
            { notes: ["C4", "E4"], answer: "different" },
            { notes: ["G4", "G4"], answer: "same" },
            { notes: ["D4", "F4"], answer: "different" },
            { notes: ["E4", "E4"], answer: "same" },
            { notes: ["A4", "F4"], answer: "different" }
          ],
          "step-skip": [
            { notes: ["C4", "D4"], answer: "step" },
            { notes: ["C4", "E4"], answer: "skip" },
            { notes: ["E4", "F4"], answer: "step" },
            { notes: ["D4", "G4"], answer: "skip" },
            { notes: ["G4", "A4"], answer: "step" },
            { notes: ["E4", "C4"], answer: "skip" }
          ],
          "melody-direction": [
            { notes: ["C4", "D4", "E4"], answer: "up" },
            { notes: ["G4", "F4", "E4"], answer: "down" },
            { notes: ["C4", "E4", "C4"], answer: "arch" },
            { notes: ["D4", "E4", "F4"], answer: "up" },
            { notes: ["E4", "G4", "E4"], answer: "arch" },
            { notes: ["A4", "G4", "F4"], answer: "down" }
          ],
          "small-intervals": [
            { notes: ["E4", "F4"], answer: "half" },
            { notes: ["C4", "D4"], answer: "whole" },
            { notes: ["C4", "E4"], answer: "third" },
            { notes: ["B3", "C4"], answer: "half" },
            { notes: ["F4", "G4"], answer: "whole" },
            { notes: ["G4", "B4"], answer: "third" }
          ],
          "big-intervals": [
            { notes: ["C4", "G4"], answer: "fifth" },
            { notes: ["C4", "C5"], answer: "octave" },
            { notes: ["D4", "A4"], answer: "fifth" },
            { notes: ["D4", "D5"], answer: "octave" },
            { notes: ["F4", "C5"], answer: "fifth" },
            { notes: ["E4", "E5"], answer: "octave" }
          ],
          "major-minor": [
            { chord: ["C4", "E4", "G4"], answer: "major" },
            { chord: ["D4", "F4", "A4"], answer: "minor" },
            { chord: ["G3", "B3", "D4"], answer: "major" },
            { chord: ["A3", "C4", "E4"], answer: "minor" },
            { chord: ["F3", "A3", "C4"], answer: "major" },
            { chord: ["E3", "G3", "B3"], answer: "minor" }
          ],
          "semitone-koron": [
            { notes: ["E4", "F4"], answer: "half" },
            { notes: ["D4", "E4k"], answer: "neutral" },
            { notes: ["C4", "D4"], answer: "whole" },
            { notes: ["G4", "A4k"], answer: "neutral" },
            { notes: ["B3", "C4"], answer: "half" },
            { notes: ["F4", "G4"], answer: "whole" }
          ],
          interval: [
            { notes: ["E4", "F4"], answer: "half" },
            { notes: ["C4", "D4"], answer: "whole" },
            { notes: ["D4", "E4k"], answer: "neutral" },
            { notes: ["C4", "G4"], answer: "fifth" },
            { notes: ["B3", "C4"], answer: "half" },
            { notes: ["F4", "G4"], answer: "whole" }
          ]
        };

        if (Array.isArray(practice.subModes) && practice.subModes.length > 0) {
          for (let i = 0; i < rounds; i++) {
            const subMode = practice.subModes[Math.floor((i / rounds) * practice.subModes.length)] || practice.subModes[0];
            const subPool = presets[subMode] || presets["higher-lower"];
            list.push({ ...subPool[i % subPool.length], subMode });
          }
          return list;
        }

        const pool = presets[mode] || presets["higher-lower"];
        for (let i = 0; i < rounds; i++) {
          list.push({ ...pool[i % pool.length], subMode: mode });
        }
        return list;
      }

      function playCurrentEarChallenge(lesson) {
        if (!lesson || !lesson.practice) return;
        syncMultiPracticeState(lesson);
        stopMultiPracticeTimers();
        const mp = ui.multiPractice;
        const ch = mp.earChallenges[mp.earRoundIdx];
        if (!ch) return;

        if (ch.chord) {
          ch.chord.forEach((n, idx) => {
            const t1 = setTimeout(() => playPianoNoteSound(n, 0.9), idx * 240);
            mp.timers.push(t1);
          });
          const tAll = setTimeout(() => {
            ch.chord.forEach((n) => playPianoNoteSound(n, 1.35));
          }, ch.chord.length * 240 + 260);
          mp.timers.push(tAll);
        } else if (Array.isArray(ch.notes)) {
          ch.notes.forEach((n, idx) => {
            const t1 = setTimeout(() => {
              if (/k/i.test(n)) {
                playStringInstrumentSound("setar", noteToFreq(n), 0.95);
              } else {
                playPianoNoteSound(n, 0.85);
              }
            }, idx * 520);
            mp.timers.push(t1);
          });
        }
      }

      function renderEarChoicePracticeCard(lesson) {
        syncMultiPracticeState(lesson);
        const mp = ui.multiPractice;
        const practice = lesson.practice;
        const curCh = mp.earChallenges[mp.earRoundIdx];
        const mode = (curCh && curCh.subMode) || practice.mode || "higher-lower";
        const total = mp.earChallenges.length || 6;
        const curRound = Math.min(mp.earRoundIdx + 1, total);

                    return `

      /* 4. TIMER ENGINE */
      function togglePracticeTimer() {
        const lesson = getActivePracticeContextLesson();
        if (!lesson || !lesson.practice) return;
        syncMultiPracticeState(lesson);
        const mp = ui.multiPractice;

        if (mp.timerRunning) {
          if (mp.timerInterval) clearInterval(mp.timerInterval);
          mp.timerInterval = null;
          mp.timerRunning = false;
          refreshLessonPianoMount(false);
          return;
        }

        if (mp.timerRemainSec <= 0) {
          mp.timerRemainSec = mp.timerTotalSec;
          mp.timerDone = false;
        }

        playPianoNoteSound("C4", 0.7);
        mp.timerRunning = true;
        refreshLessonPianoMount(false);

        mp.timerInterval = setInterval(() => {
          if (ui.screen !== "lesson" && !(ui.screen === "library" && (ui.libraryTab === "tools" || ui.libraryTab === "piano"))) {
            stopMultiPracticeTimers();
            return;
          }
          mp.timerRemainSec = Math.max(0, mp.timerRemainSec - 1);
          if (mp.timerRemainSec <= 0) {
            clearInterval(mp.timerInterval);
            mp.timerInterval = null;
            mp.timerRunning = false;
            mp.timerDone = true;
            playPianoNoteSound("C4", 0.5);
            setTimeout(() => playPianoNoteSound("G4", 0.9), 220);
            markLessonPracticeCompleted(lesson);
          }
          refreshLessonPianoMount(false);
        }, 1000);
      }

        const remain = mp.timerRemainSec;

        const mins = String(Math.floor(remain / 60)).padStart(2, "0");
        const secs = String(remain % 60).padStart(2, "0");

        return `

              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">

                ${

                    ? `<span class="badge-saffron" style="padding:3px 10px;font-size:0.74rem;background-color:var(--secondary);color:#FFF;">✓ ${escapeHtml(t("practice.completedBadge"))}</span>`

                  <span>${mp.timerRunning ? "❚❚" : "▶"}</span>

      /* 5. FRETBOARD ENGINE (guitar | violin | setar | tar) */
      const FRETBOARD_TUNINGS = {
        guitar: [
          { string: 1, name: "E4", midi: 64 },
          { string: 2, name: "B3", midi: 59 },
          { string: 3, name: "G3", midi: 55 },
          { string: 4, name: "D3", midi: 50 },
          { string: 5, name: "A2", midi: 45 },
          { string: 6, name: "E2", midi: 40 }
        ],
        violin: [
          { string: 1, name: "E5", midi: 76 },
          { string: 2, name: "A4", midi: 69 },
          { string: 3, name: "D4", midi: 62 },
          { string: 4, name: "G3", midi: 55 }
        ],
        setar: [
          { string: 1, name: "C4", midi: 60 },
          { string: 2, name: "G3", midi: 55 },
          { string: 3, name: "C4", midi: 60 },
          { string: 4, name: "C3", midi: 48 }
        ],
        tar: [
          { string: 1, name: "C4", midi: 60 },
          { string: 2, name: "G3", midi: 55 },
          { string: 3, name: "C4", midi: 60 },
          { string: 4, name: "C3", midi: 48 }
        ]
      };

      function getFretboardPosFreq(instrument, posStr) {
        const [sRaw, fRaw] = String(posStr || "1:0").split(":");
        const sNum = Math.max(1, Number(sRaw) || 1);
        const fNum = Math.max(0, parseFloat(fRaw) || 0);
        const tuning = FRETBOARD_TUNINGS[instrument] || FRETBOARD_TUNINGS.guitar;
        const strMeta = tuning.find((t) => t.string === sNum) || tuning[0];
        const midi = strMeta.midi + fNum;
        return 440 * Math.pow(2, (midi - 69) / 12);
      }

      function startFretboardDemo() {
        const lesson = LESSONS.find((l) => l.id === Number(ui.activeLessonId)) || LESSONS[0];
        if (!lesson || !lesson.practice || !Array.isArray(lesson.practice.positions)) return;
        stopMultiPracticeTimers();
        const mp = ui.multiPractice;
        const positions = lesson.practice.positions;
        const inst = lesson.practice.instrument || state.activeCourseId || "guitar";
        const beatMs = 700;

        mp.playingDemo = true;
        mp.demoIdx = 0;
        refreshLessonPianoMount(false);

        positions.forEach((pos, idx) => {
          const tmr = setTimeout(() => {
            if (!mp.playingDemo) return;
            mp.demoIdx = idx;
            playStringInstrumentSound(inst, getFretboardPosFreq(inst, pos), 0.9);
            refreshLessonPianoMount(false);
          }, idx * beatMs);
          mp.timers.push(tmr);
        });

        const endTmr = setTimeout(() => {
          mp.playingDemo = false;
          mp.demoIdx = -1;
          refreshLessonPianoMount(false);
        }, positions.length * beatMs + 100);
        mp.timers.push(endTmr);
      }

      function handleFretboardTap(posStr) {
        const lesson = LESSONS.find((l) => l.id === Number(ui.activeLessonId)) || LESSONS[0];
        if (!lesson || !lesson.practice) return;
        syncMultiPracticeState(lesson);
        const mp = ui.multiPractice;
        const inst = lesson.practice.instrument || state.activeCourseId || "guitar";
        playStringInstrumentSound(inst, getFretboardPosFreq(inst, posStr), 0.95);

        if (mp.fretDone) return;
        const positions = lesson.practice.positions || [];
        const targetPos = positions[mp.fretIdx];
        if (!targetPos) return;

        if (posStr === targetPos) {
          mp.fretHint = "";
          mp.fretIdx += 1;
          if (mp.fretIdx >= positions.length) {
            mp.fretDone = true;
            markLessonPracticeCompleted(lesson);
          }
        } else {
          const [targetS] = String(targetPos).split(":");
          mp.fretHint = t("practice.fretboardWrongHint", { string: targetS });
        }
        refreshLessonPianoMount(false);
      }

      function renderFretboardPracticeCard(lesson) {
        syncMultiPracticeState(lesson);
        const mp = ui.multiPractice;
        const practice = lesson.practice;
        const inst = practice.instrument || state.activeCourseId || "guitar";
        const positions = Array.isArray(practice.positions) ? practice.positions : ["1:0"];
        const tuning = FRETBOARD_TUNINGS[inst] || FRETBOARD_TUNINGS.guitar;
        const maxFret = Math.max(
          5,
          ...positions.map((p) => Math.ceil(parseFloat(String(p).split(":")[1]) || 0))
        );
        const isCompleted = isLessonPracticeCompleted(lesson);

        const targetPos = mp.playingDemo
          ? positions[mp.demoIdx]
          : !mp.fretDone
          ? positions[mp.fretIdx]
          : null;
        const [targetS, targetF] = targetPos ? String(targetPos).split(":") : ["1", "0"];

        const vbW = 560;
        const padL = 72;
        const padR = 24;
        const topY = 28;
        const rowGap = tuning.length <= 4 ? 32 : 24;
        const vbH = topY * 2 + (tuning.length - 1) * rowGap + 22;
        const neckW = vbW - padL - padR;
        const fretW = neckW / maxFret;

        let fretsSvg = `
          <rect x="${padL}" y="${topY - 10}" width="${neckW}" height="${(tuning.length - 1) * rowGap + 20}" rx="6" fill="#F4ECDD" stroke="#1F1A2E" stroke-width="2" />
          <line x1="${padL}" y1="${topY - 10}" x2="${padL}" y2="${topY + (tuning.length - 1) * rowGap + 10}" stroke="#1F1A2E" stroke-width="5" />
        `;

        for (let f = 1; f <= maxFret; f++) {
          const fx = Math.round(padL + f * fretW);
          fretsSvg += `
            <line x1="${fx}" y1="${topY - 8}" x2="${fx}" y2="${topY + (tuning.length - 1) * rowGap + 8}" stroke="#1F1A2E" stroke-width="${inst === "violin" ? "1.2" : "1.8"}" stroke-dasharray="${inst === "violin" ? "3 3" : "none"}" opacity="0.65" />
            <text x="${fx - fretW / 2}" y="${vbH - 6}" text-anchor="middle" fill="#6F677D" font-size="11" font-weight="700">${toLocaleDigits(f)}</text>
          `;
        }

        let stringsSvg = "";
        let nodesSvg = "";
        tuning.forEach((st, sIdx) => {
          const sy = topY + sIdx * rowGap;
          const strokeW = 1.2 + sIdx * 0.35;
          stringsSvg += `
            <text x="${padL - 36}" y="${sy + 4}" text-anchor="middle" fill="#1F1A2E" font-size="11.5" font-weight="700">S${st.string} (${st.name})</text>
            <line x1="${padL}" y1="${sy}" x2="${padL + neckW}" y2="${sy}" stroke="#1F1A2E" stroke-width="${strokeW.toFixed(2)}" />
          `;

          for (let f = 0; f <= maxFret; f++) {
            const posKey = `${st.string}:${f}`;
            const isTarget = targetPos === posKey;
            const nx = f === 0 ? padL - 12 : Math.round(padL + (f - 0.5) * fretW);
            const r = isTarget ? 11.5 : 8.5;
            const fill = isTarget ? (mp.playingDemo ? "#F2B33D" : "#1F6F6B") : "#FBF7F0";
            const fg = isTarget ? (mp.playingDemo ? "#1F1A2E" : "#FFFFFF") : "#1F1A2E";
            const stroke = isTarget ? "#1F1A2E" : "rgba(31,26,46,0.35)";

            nodesSvg += `
              <g style="cursor:pointer;" data-action="mp-fret-tap" data-pos="${posKey}">
                <circle cx="${nx}" cy="${sy}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${isTarget ? 2.2 : 1.3}" />
                <text x="${nx}" y="${sy + 3.8}" text-anchor="middle" fill="${fg}" font-size="10" font-weight="800">${f}</text>
              </g>
            `;
          }
        });

        const seqBadges = positions
          .map((p, idx) => {
            const cls =
              (mp.playingDemo && mp.demoIdx === idx) || (!mp.playingDemo && !mp.fretDone && idx === mp.fretIdx)
                ? "current"
                : mp.fretDone || idx < mp.fretIdx
                ? "done"
                : "";
            return `<span class="vpiano-seq-badge ${cls}">${escapeHtml(p)}</span>`;
          })
          .join("");

        return `
          <div id="vpiano-lesson-mount" class="m-card vpiano-card">
            <div class="vpiano-header-row">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <span class="serif-heading" style="font-size:1.12rem;font-weight:700;">🎸 ${escapeHtml(t("practice.fretboardTitle"))}</span>
                ${
                  isCompleted
                    ? `<span class="badge-saffron" style="padding:3px 10px;font-size:0.74rem;background-color:var(--secondary);color:#FFF;">✓ ${escapeHtml(t("practice.completedBadge"))}</span>`
                    : ""
                }
              </div>
              <button type="button" class="btn-pill ${mp.playingDemo ? "btn-surface" : "btn-secondary"}" style="min-height:36px;padding:5px 14px;font-size:0.82rem;" data-action="mp-fret-demo">
                <span>${mp.playingDemo ? "■" : "▶"}</span>
                <span>${escapeHtml(mp.playingDemo ? t("practice.stopDemoBtn") : t("practice.playDemoBtn"))}</span>
              </button>
            </div>

            <div class="vpiano-status-box">
              ${
                mp.fretDone
                  ? `<div class="vpiano-well-done">
                      <span>🎉 ${escapeHtml(t("practice.wellDone"))} · ${escapeHtml(t("practice.completedBadge"))}</span>
                      <button type="button" class="vpiano-pill-btn" data-action="mp-reset">
                        ↻ ${escapeHtml(t("practice.playAgainBtn"))}
                      </button>
                    </div>`
                  : `<div style="font-size:0.9rem;font-weight:700;color:var(--secondary);">
                      ${escapeHtml(t("practice.fretboardFollowHint", { string: targetS, fret: targetF }))}
                    </div>`
              }
              <div class="vpiano-notes-seq">${seqBadges}</div>
              ${mp.fretHint ? `<div class="vpiano-hint-alert">${escapeHtml(mp.fretHint)}</div>` : ""}
            </div>

            <div class="practice-svg-scroll" dir="ltr">
              <svg viewBox="0 0 ${vbW} ${vbH}" width="${vbW}" height="${vbH}" style="width:100%;min-width:460px;height:auto;display:block;" dir="ltr">
                ${fretsSvg}
                ${stringsSvg}
                ${nodesSvg}
              </svg>
            </div>
          </div>
        `;
      }

      /* 6. CHORD-DIAGRAM ENGINE */
      const GUITAR_CHORD_SHAPES = {
        Em: { frets: [0, 2, 2, 0, 0, 0], fingers: [0, 2, 3, 0, 0, 0] },
        Am: { frets: [-1, 0, 2, 2, 1, 0], fingers: [0, 0, 2, 3, 1, 0] },
        C: { frets: [-1, 3, 2, 0, 1, 0], fingers: [0, 3, 2, 0, 1, 0] },
        G: { frets: [3, 2, 0, 0, 0, 3], fingers: [2, 1, 0, 0, 0, 3] },
        D: { frets: [-1, -1, 0, 2, 3, 2], fingers: [0, 0, 0, 1, 3, 2] },
        Dm: { frets: [-1, -1, 0, 2, 3, 1], fingers: [0, 0, 0, 2, 3, 1] },
        E: { frets: [0, 2, 2, 1, 0, 0], fingers: [0, 2, 3, 1, 0, 0] },
        A: { frets: [-1, 0, 2, 2, 2, 0], fingers: [0, 0, 1, 2, 3, 0] },
        Fmaj7: { frets: [-1, -1, 3, 2, 1, 0], fingers: [0, 0, 3, 2, 1, 0] }
      };

      function playGuitarChordStrum(chordName, direction = "D") {
        const shape = GUITAR_CHORD_SHAPES[chordName] || GUITAR_CHORD_SHAPES.Em;
        // Strings from low E2 (index 0 -> string 6) to high E4 (index 5 -> string 1)
        const baseMidis = [40, 45, 50, 55, 59, 64];
        const activeNotes = [];
        shape.frets.forEach((f, idx) => {
          if (f >= 0) {
            const midi = baseMidis[idx] + f;
            activeNotes.push(440 * Math.pow(2, (midi - 69) / 12));
          }
        });
        if (direction === "U") activeNotes.reverse();
        activeNotes.forEach((freq, idx) => {
          setTimeout(() => playStringInstrumentSound("guitar", freq, 1.25), idx * 28);
        });
      }

      function renderSingleChordSvg(chordName) {
        const shape = GUITAR_CHORD_SHAPES[chordName] || GUITAR_CHORD_SHAPES.Em;
        const w = 132;
        const h = 152;
        const padX = 21;
        const topY = 30;
        const strGap = 18;
        const fretGap = 24;

        let svg = `<rect x="${padX}" y="${topY}" width="${strGap * 5}" height="${fretGap * 4}" fill="#FBF7F0" stroke="#1F1A2E" stroke-width="1.6" />`;
        svg += `<line x1="${padX}" y1="${topY}" x2="${padX + strGap * 5}" y2="${topY}" stroke="#1F1A2E" stroke-width="4" />`;

        for (let f = 1; f <= 4; f++) {
          const fy = topY + f * fretGap;
          svg += `<line x1="${padX}" y1="${fy}" x2="${padX + strGap * 5}" y2="${fy}" stroke="#1F1A2E" stroke-width="1.3" />`;
        }

        for (let s = 0; s < 6; s++) {
          const sx = padX + s * strGap;
          svg += `<line x1="${sx}" y1="${topY}" x2="${sx}" y2="${topY + fretGap * 4}" stroke="#1F1A2E" stroke-width="1.3" />`;
          const fret = shape.frets[s];
          const finger = shape.fingers[s];
          if (fret === -1) {
            svg += `<text x="${sx}" y="${topY - 8}" text-anchor="middle" fill="#D9473F" font-size="11" font-weight="800">✕</text>`;
          } else if (fret === 0) {
            svg += `<circle cx="${sx}" cy="${topY - 11}" r="4.5" fill="none" stroke="#1F6F6B" stroke-width="1.6" />`;
          } else {
            const cy = topY + (fret - 0.5) * fretGap;
            svg += `
              <circle cx="${sx}" cy="${cy}" r="7.5" fill="#1F1A2E" />
              <text x="${sx}" y="${cy + 3.5}" text-anchor="middle" fill="#FBF7F0" font-size="9.5" font-weight="800">${finger || ""}</text>
            `;
          }
        }

        return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block;margin:0 auto;">${svg}</svg>`;
      }

      function handleChordStrumTap(dir) {
        const lesson = LESSONS.find((l) => l.id === Number(ui.activeLessonId)) || LESSONS[0];
        if (!lesson || !lesson.practice) return;
        syncMultiPracticeState(lesson);
        const mp = ui.multiPractice;
        const chords = Array.isArray(lesson.practice.chords) && lesson.practice.chords.length > 0 ? lesson.practice.chords : ["Em"];
        const curChord = chords[mp.chordActiveIdx % chords.length] || chords[0];
        playGuitarChordStrum(curChord, dir);

        const pattern = String(lesson.practice.strum || "D D D D")
          .trim()
          .split(/\s+/)
          .filter(Boolean);
        if (mp.strumDone || pattern.length === 0) return;

        const expectedDir = pattern[mp.strumIdx].toUpperCase();
        if (dir === expectedDir) {
          mp.strumIdx += 1;
          if (mp.strumIdx % 2 === 0 && chords.length > 1) {
            mp.chordActiveIdx = (mp.chordActiveIdx + 1) % chords.length;
          }
          if (mp.strumIdx >= pattern.length) {
            mp.strumDone = true;
            markLessonPracticeCompleted(lesson);
          }
        }
        refreshLessonPianoMount(false);
      }

      function renderChordDiagramPracticeCard(lesson) {
        syncMultiPracticeState(lesson);
        const mp = ui.multiPractice;
        const chords = Array.isArray(lesson.practice.chords) && lesson.practice.chords.length > 0 ? lesson.practice.chords : ["Em"];
        const pattern = String(lesson.practice.strum || "D D D D")
          .trim()
          .split(/\s+/)
          .filter(Boolean);
        const isCompleted = isLessonPracticeCompleted(lesson);
        const nextDir = pattern[mp.strumIdx] || "D";

        const chordsHtml = chords
          .map((chName, idx) => {
            const active = mp.chordActiveIdx === idx;
            return `
              <div class="chord-card-item ${active ? "active" : ""}" data-action="mp-select-chord" data-index="${idx}" data-chord="${escapeHtml(chName)}">
                <div class="serif-heading" style="font-size:1.15rem;font-weight:700;margin-bottom:2px;">${escapeHtml(chName)}</div>
                ${renderSingleChordSvg(chName)}
              </div>
            `;
          })
          .join("");

        const patternHtml = pattern
          .map((d, idx) => {
            const cls = mp.strumDone || idx < mp.strumIdx ? "done" : idx === mp.strumIdx ? "current" : "";
            const arrow = d.toUpperCase() === "U" ? "↑ U" : "↓ D";
            return `<span class="vpiano-seq-badge ${cls}">${arrow}</span>`;
          })
          .join("");

        return `
          <div id="vpiano-lesson-mount" class="m-card vpiano-card">
            <div class="vpiano-header-row">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <span class="serif-heading" style="font-size:1.12rem;font-weight:700;">🎸 ${escapeHtml(t("practice.chordTitle"))}</span>
                ${
                  isCompleted
                    ? `<span class="badge-saffron" style="padding:3px 10px;font-size:0.74rem;background-color:var(--secondary);color:#FFF;">✓ ${escapeHtml(t("practice.completedBadge"))}</span>`
                    : ""
                }
              </div>
            </div>

            <div class="chord-boxes-row">${chordsHtml}</div>

            <div class="vpiano-status-box">
              ${
                mp.strumDone
                  ? `<div class="vpiano-well-done">
                      <span>🎉 ${escapeHtml(t("practice.wellDone"))} · ${escapeHtml(t("practice.completedBadge"))}</span>
                      <button type="button" class="vpiano-pill-btn" data-action="mp-reset">
                        ↻ ${escapeHtml(t("practice.playAgainBtn"))}
                      </button>
                    </div>`
                  : `<div style="font-size:0.9rem;font-weight:700;color:var(--secondary);">
                      ${escapeHtml(t("practice.chordFollowInstruction", { current: mp.strumIdx + 1, total: pattern.length, dir: nextDir }))}
                    </div>`
              }
              <div class="vpiano-notes-seq">${patternHtml}</div>
            </div>

            <div class="strum-btns-row">
              <button type="button" class="btn-pill btn-secondary" style="min-height:48px;" data-action="mp-chord-strum" data-dir="D">
                ${escapeHtml(t("practice.chordDownBtn"))}
              </button>
              <button type="button" class="btn-pill btn-surface" style="min-height:48px;" data-action="mp-chord-strum" data-dir="U">
                ${escapeHtml(t("practice.chordUpBtn"))}
              </button>
            </div>
          </div>
        `;
      }

      /* 7. SANTUR-MAP ENGINE */
      const SANTUR_KHARAKS = [
        { note: "E4", fa: "می" },
        { note: "F4", fa: "فا" },
        { note: "G4", fa: "سل" },
        { note: "A4", fa: "لا" },
        { note: "B4", fa: "سی" },
        { note: "C5", fa: "دو" },
        { note: "D5", fa: "ر" },
        { note: "E5", fa: "می" },
        { note: "F5", fa: "فا" }
      ];

      function startSanturDemo() {
        const lesson = LESSONS.find((l) => l.id === Number(ui.activeLessonId)) || LESSONS[0];
        if (!lesson || !lesson.practice || !Array.isArray(lesson.practice.notes)) return;
        stopMultiPracticeTimers();
        const mp = ui.multiPractice;
        const notes = lesson.practice.notes;
        const beatMs = 640;

        mp.playingDemo = true;
        mp.demoIdx = 0;
        refreshLessonPianoMount(false);

        notes.forEach((n, idx) => {
          const tmr = setTimeout(() => {
            if (!mp.playingDemo) return;
            mp.demoIdx = idx;
            playSanturNoteSound(n, 1.15);
            refreshLessonPianoMount(false);
          }, idx * beatMs);
          mp.timers.push(tmr);
        });

        const endTmr = setTimeout(() => {
          mp.playingDemo = false;
          mp.demoIdx = -1;
          refreshLessonPianoMount(false);
        }, notes.length * beatMs + 100);
        mp.timers.push(endTmr);
      }

      function handleSanturBridgeTap(noteName) {
        const lesson = LESSONS.find((l) => l.id === Number(ui.activeLessonId)) || LESSONS[0];
        if (!lesson || !lesson.practice) return;
        syncMultiPracticeState(lesson);
        const mp = ui.multiPractice;
        playSanturNoteSound(noteName, 1.25);

        if (mp.santurDone) return;
        const notes = lesson.practice.notes || [];
        const targetNote = notes[mp.santurIdx];
        if (!targetNote) return;

        if (noteName === targetNote) {
          mp.santurHint = "";
          mp.santurIdx += 1;
          if (mp.santurIdx >= notes.length) {
            mp.santurDone = true;
            markLessonPracticeCompleted(lesson);
          }
        } else {
          mp.santurHint = t("practice.santurWrongHint", { note: formatNoteWithSolfege(targetNote) });
        }
        refreshLessonPianoMount(false);
      }

      function renderSanturMapPracticeCard(lesson) {
        syncMultiPracticeState(lesson);
        const mp = ui.multiPractice;
        const notes = Array.isArray(lesson.practice.notes) ? lesson.practice.notes : ["E4", "F4", "G4"];
        const isCompleted = isLessonPracticeCompleted(lesson);

        const targetNote = mp.playingDemo
          ? notes[mp.demoIdx]
          : !mp.santurDone
          ? notes[mp.santurIdx]
          : null;

        // Build kharak list (include any extra note from lesson.practice.notes if outside default 9)
        const kharaks = [...SANTUR_KHARAKS];
        for (const n of notes) {
          if (!kharaks.some((k) => k.note === n)) {
            kharaks.unshift({ note: n, fa: n });
          }
        }

        const vbW = 540;
        const vbH = 236;
        const topY = 22;
        const botY = 214;
        const rowCount = kharaks.length;
        const rowStep = (botY - topY - 24) / Math.max(1, rowCount - 1);

        let coursesSvg = "";
        kharaks.forEach((kh, idx) => {
          // Bottom kharak = index 0 (E4), top kharak = highest note
          const revIdx = rowCount - 1 - idx;
          const y = Math.round(topY + 12 + revIdx * rowStep);
          const ratio = (y - topY) / (botY - topY);
          const leftX = Math.round(92 - ratio * 58);
          const rightX = Math.round(448 + ratio * 58);
          const kharakX = Math.round(350 + ratio * 28);
          const isTarget = targetNote === kh.note;
          const strokeCol = isTarget ? "#1F6F6B" : "#1F1A2E";
          const bridgeFill = isTarget ? (mp.playingDemo ? "#F2B33D" : "#1F6F6B") : "#FBF7F0";
          const bridgeFg = isTarget ? (mp.playingDemo ? "#1F1A2E" : "#FFFFFF") : "#1F1A2E";

          coursesSvg += `
            <g style="cursor:pointer;" data-action="mp-santur-tap" data-note="${kh.note}">
              <line x1="${leftX}" y1="${y}" x2="${rightX}" y2="${y}" stroke="${strokeCol}" stroke-width="${isTarget ? 2.6 : 1.3}" />
              <circle cx="${kharakX}" cy="${y}" r="${isTarget ? 11 : 8.5}" fill="${bridgeFill}" stroke="#1F1A2E" stroke-width="1.6" />
              <text x="${kharakX}" y="${y + 3.5}" text-anchor="middle" fill="${bridgeFg}" font-size="9.5" font-weight="800">${kh.note}</text>
              <text x="${rightX + 24}" y="${y + 4}" text-anchor="middle" fill="#1F1A2E" font-size="10.5" font-weight="700">${kh.fa}</text>
            </g>
          `;
        });

        const seqBadges = notes
          .map((n, idx) => {
            const cls =
              (mp.playingDemo && mp.demoIdx === idx) || (!mp.playingDemo && !mp.santurDone && idx === mp.santurIdx)
                ? "current"
                : mp.santurDone || idx < mp.santurIdx
                ? "done"
                : "";
            return `<span class="vpiano-seq-badge ${cls}">${escapeHtml(formatNoteWithSolfege(n))}</span>`;
          })
          .join("");

        return `
          <div id="vpiano-lesson-mount" class="m-card vpiano-card">
            <div class="vpiano-header-row">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <span class="serif-heading" style="font-size:1.12rem;font-weight:700;">🎶 ${escapeHtml(t("practice.santurTitle"))}</span>
                ${
                  isCompleted
                    ? `<span class="badge-saffron" style="padding:3px 10px;font-size:0.74rem;background-color:var(--secondary);color:#FFF;">✓ ${escapeHtml(t("practice.completedBadge"))}</span>`
                    : ""
                }
              </div>
              <button type="button" class="btn-pill ${mp.playingDemo ? "btn-surface" : "btn-secondary"}" style="min-height:36px;padding:5px 14px;font-size:0.82rem;" data-action="mp-santur-demo">
                <span>${mp.playingDemo ? "■" : "▶"}</span>
                <span>${escapeHtml(mp.playingDemo ? t("practice.stopDemoBtn") : t("practice.playDemoBtn"))}</span>
              </button>
            </div>

            <div class="vpiano-status-box">
              ${
                mp.santurDone
                  ? `<div class="vpiano-well-done">
                      <span>🎉 ${escapeHtml(t("practice.wellDone"))} · ${escapeHtml(t("practice.completedBadge"))}</span>
                      <button type="button" class="vpiano-pill-btn" data-action="mp-reset">
                        ↻ ${escapeHtml(t("practice.playAgainBtn"))}
                      </button>
                    </div>`
                  : `<div style="font-size:0.9rem;font-weight:700;color:var(--secondary);">
                      ${escapeHtml(t("practice.santurFollowHint", { note: formatNoteWithSolfege(targetNote || "") }))}
                    </div>`
              }
              <div class="vpiano-notes-seq">${seqBadges}</div>
              ${mp.santurHint ? `<div class="vpiano-hint-alert">${escapeHtml(mp.santurHint)}</div>` : ""}
            </div>

            <div class="practice-svg-scroll" dir="ltr">
              <svg viewBox="0 0 ${vbW} ${vbH}" width="${vbW}" height="${vbH}" style="width:100%;min-width:460px;height:auto;display:block;" dir="ltr">
                <polygon points="92,${topY} 448,${topY} 506,${botY} 34,${botY}" fill="#EFE5D4" stroke="#1F1A2E" stroke-width="2.2" stroke-linejoin="round" />
                ${coursesSvg}
              </svg>
            </div>
          </div>
        `;
      }

      function renderLessonPracticeCard(lesson) {
        if (!lesson || !lesson.practice) return "";
        const pType = getPracticeType(lesson.practice);
        switch (pType) {
          case "rhythm-tap":
            return renderRhythmTapPracticeCard(lesson);
          case "ear-choice":
            return renderEarChoicePracticeCard(lesson);
          case "listen-sing":
            return renderListenSingPracticeCard(lesson);
          case "timer":
            return renderTimerPracticeCard(lesson);
          case "fretboard":
            return renderFretboardPracticeCard(lesson);
          case "chord-diagram":
            return renderChordDiagramPracticeCard(lesson);
          case "santur-map":
            return renderSanturMapPracticeCard(lesson);
          case "keyboard-follow":
          default:
            return renderKeyboardFollowPracticeCard(lesson);
        }
      }

      /* ==========================================================================
         FIRST-RUN ONBOARDING FLOW (Steps 1..7)
         ========================================================================== */
      function renderOnboardingScreen() {
        const step = state.onboardingStep || 1;
        const totalSteps = 7;

        const dotsHtml = Array.from({ length: totalSteps }, (_, idx) => {
          const s = idx + 1;
          const cls = s === step ? "active" : s < step ? "done" : "";
          return `<span class="progress-dot ${cls}"></span>`;
        }).join("");

        let stepContent = "";

        if (step === 1) {
          const visibleInstCourses = getVisibleCourses();
          const instruments =
            visibleInstCourses.length > 0
              ? visibleInstCourses.map((c) => ({ id: c.id, active: true }))
              : [{ id: "piano", active: true }];

          stepContent = `
            <h1 class="serif-heading" style="font-size:1.55rem;margin-bottom:16px;">${escapeHtml(t("onboarding.instTitle"))}</h1>
            <div style="display:grid;grid-template-columns:${instruments.length === 1 ? "1fr" : "1fr 1fr"};gap:16px;margin-bottom:18px;">
              ${instruments
                .map((inst) => {
                  const isSelected = inst.active && state.instrument === inst.id;
                  return `
                    <button type="button" class="m-card interactive" style="text-align:center;padding:18px 14px;border-color:${isSelected ? "var(--primary)" : "var(--border-color)"};background-color:${isSelected ? "var(--primary-soft)" : "var(--bg-elevated)"};" data-action="select-onboard-inst" data-inst="${inst.id}" data-active="${inst.active}">
                      <div style="width:44px;height:44px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;color:var(--ink);">
                        ${getInstrumentSvg(inst.id)}
                      </div>
                      <div class="one-line-ellipsis" style="font-weight:700;font-size:1rem;margin-bottom:6px;">${escapeHtml(t(`instruments.${inst.id}`))}</div>
                      <span class="badge-saffron" style="font-size:0.72rem;padding:3px 10px;background-color:var(--secondary);color:#FFF;">
                        ${escapeHtml(t("onboarding.instReady"))}
                      </span>
                    </button>
                  `;
                })
                .join("")}
            </div>
            <button type="button" class="btn-pill btn-primary btn-block" data-action="onboard-next">
              ${escapeHtml(t("onboarding.instContinuePianoBtn"))}
            </button>
          `;
        } else if (step === 2) {
          const opts = [
            { id: "yes", label: t("onboarding.accessYes"), helper: t("onboarding.accessYesHelper") },
            { id: "phone", label: t("onboarding.accessPhone"), helper: t("onboarding.accessPhoneHelper") },
            { id: "no", label: t("onboarding.accessNo"), helper: t("onboarding.accessNoHelper") }
          ];
          const activeHelper = opts.find((o) => o.id === state.access)?.helper || "";

          stepContent = `
            <h1 class="serif-heading" style="font-size:1.55rem;margin-bottom:16px;">${escapeHtml(t("onboarding.accessTitle"))}</h1>
            ${opts
              .map(
                (o) => `
                  <button type="button" class="m-card choice-card ${state.access === o.id ? "selected" : ""}" data-action="set-onboard-field" data-field="access" data-value="${o.id}">
                    <span style="font-weight:700;">${escapeHtml(o.label)}</span>
                    <span>${state.access === o.id ? "●" : "○"}</span>
                  </button>
                `
              )
              .join("")}
            <div class="m-card surface-fill" style="margin:12px 0 20px;padding:12px 16px;font-size:0.88rem;color:var(--secondary);font-weight:600;">
              💡 ${escapeHtml(activeHelper)}
            </div>
            <button type="button" class="btn-pill btn-primary btn-block" data-action="onboard-next">
              ${escapeHtml(t("onboarding.continue"))}
            </button>
          `;
        } else if (step === 3) {
          const opts = [
            { id: "none", label: t("onboarding.expNone") },
            { id: "little", label: t("onboarding.expLittle") },
            { id: "notes", label: t("onboarding.expNotes") }
          ];
          const showSkipHelper = state.experience === "little" || state.experience === "notes";

          stepContent = `
            <h1 class="serif-heading" style="font-size:1.55rem;margin-bottom:16px;">${escapeHtml(t("onboarding.expTitle"))}</h1>
            ${opts
              .map(
                (o) => `
                  <button type="button" class="m-card choice-card ${state.experience === o.id ? "selected" : ""}" data-action="set-onboard-field" data-field="experience" data-value="${o.id}">
                    <span style="font-weight:700;">${escapeHtml(o.label)}</span>
                    <span>${state.experience === o.id ? "●" : "○"}</span>
                  </button>
                `
              )
              .join("")}
            ${
              showSkipHelper
                ? `<div class="m-card surface-fill" style="margin:12px 0 20px;padding:12px 16px;font-size:0.88rem;color:var(--secondary);font-weight:600;">
                    ✨ ${escapeHtml(t("onboarding.expSkipHelper"))}
                  </div>`
                : `<div style="height:12px;"></div>`
            }
            <button type="button" class="btn-pill btn-primary btn-block" data-action="onboard-next">
              ${escapeHtml(t("onboarding.continue"))}
            </button>
          `;
        } else if (step === 4) {
          const goals = [
            { val: 5, title: t("onboarding.goal5"), desc: t("onboarding.goal5Desc") },
            { val: 15, title: t("onboarding.goal15"), desc: t("onboarding.goal15Desc") },
            { val: 30, title: t("onboarding.goal30"), desc: t("onboarding.goal30Desc") }
          ];

          stepContent = `
            <h1 class="serif-heading" style="font-size:1.55rem;margin-bottom:16px;">${escapeHtml(t("onboarding.goalTitle"))}</h1>
            ${goals
              .map(
                (g) => `
                  <button type="button" class="m-card choice-card ${Number(state.dailyGoal) === g.val ? "selected" : ""}" data-action="set-onboard-field" data-field="dailyGoal" data-value="${g.val}">
                    <div>
                      <div style="font-weight:700;font-size:1rem;">${escapeHtml(g.title)}</div>
                      <div style="font-size:0.83rem;color:var(--muted);">${escapeHtml(g.desc)}</div>
                    </div>
                    <span>${Number(state.dailyGoal) === g.val ? "●" : "○"}</span>
                  </button>
                `
              )
              .join("")}
            <button type="button" class="btn-pill btn-primary btn-block" style="margin-top:14px;" data-action="onboard-next">
              ${escapeHtml(t("onboarding.continue"))}
            </button>
          `;
        } else if (step === 5) {
          const motives = [
            { id: "self", label: t("onboarding.motiveSelf") },
            { id: "song", label: t("onboarding.motiveSong") },
            { id: "pro", label: t("onboarding.motivePro") },
            { id: "child", label: t("onboarding.motiveChild") }
          ];
          const curM = state.motivations || [];

          stepContent = `
            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
              <h1 class="serif-heading" style="font-size:1.5rem;">${escapeHtml(t("onboarding.motiveTitle"))}</h1>
              <button type="button" style="color:var(--secondary);font-weight:700;font-size:0.88rem;text-decoration:underline;" data-action="onboard-next">${escapeHtml(t("onboarding.skip"))}</button>
            </div>
            <p style="font-size:0.88rem;color:var(--muted);margin-bottom:18px;">${escapeHtml(t("onboarding.motiveSub"))}</p>
            <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px;">
              ${motives
                .map((m) => {
                  const sel = curM.includes(m.id);
                  return `
                    <button type="button" class="chip-btn ${sel ? "selected" : ""}" data-action="toggle-motive" data-motive="${m.id}">
                      <span>${sel ? "✓" : "+"}</span>
                      <span>${escapeHtml(m.label)}</span>
                    </button>
                  `;
                })
                .join("")}
            </div>
            <button type="button" class="btn-pill btn-primary btn-block" data-action="onboard-next">
              ${escapeHtml(t("onboarding.continue"))}
            </button>
          `;
        } else if (step === 6) {
          stepContent = `
            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
              <h1 class="serif-heading" style="font-size:1.5rem;">${escapeHtml(t("onboarding.reminderTitle"))}</h1>
              <button type="button" style="color:var(--secondary);font-weight:700;font-size:0.88rem;text-decoration:underline;" data-action="skip-reminder">${escapeHtml(t("onboarding.later"))}</button>
            </div>
            <p style="font-size:0.88rem;color:var(--muted);margin-bottom:18px;">${escapeHtml(t("onboarding.reminderSub"))}</p>
            <div class="m-card" style="margin-bottom:20px;text-align:center;">
              <label style="display:block;font-size:0.85rem;font-weight:700;color:var(--muted);margin-bottom:10px;">
                ${escapeHtml(t("onboarding.reminderLabel"))}
              </label>
              <input type="time" id="onboard-reminder-input" class="m-input" style="max-width:180px;margin:0 auto;text-align:center;font-size:1.25rem;font-weight:700;" value="${escapeHtml(state.reminderTime || "19:00")}" />
            </div>
            <button type="button" class="btn-pill btn-primary btn-block" data-action="save-onboard-reminder">
              ${escapeHtml(t("onboarding.reminderSaveBtn"))}
            </button>
          `;
        } else {
          const accessLabel =
            state.access === "yes"
              ? t("onboarding.accessYes")
              : state.access === "phone"
              ? t("onboarding.accessPhone")
              : t("onboarding.accessNo");

      function getNextUnlockedLesson() {
        for (const lesson of LESSONS) {
          if (!state.completedLessons.includes(lesson.id)) {
            return lesson;
          }
        }
        return null;
      }

      function getLessonChapterIndex(lesson) {
        if (!lesson || !Array.isArray(LESSONS) || LESSONS.length === 0) return 0;
        const seen = [];
        for (const l of LESSONS) {
          const chName = lField(l.chapter);
          if (!seen.includes(chName)) seen.push(chName);
          if (l.id === lesson.id) return Math.max(0, seen.indexOf(chName));
        }
        return Math.floor(((lesson.id || 1) - 1) / 4);
      }

        // Weekly streak dots (7 days)

          const dKey = getLocalDateKey(d);
          const isDone = state.activeDaysHistory.includes(dKey);
          const isToday = dKey === todayKey;
          const lbl = Array.isArray(dayLabels) ? dayLabels[i] : "";
          const dotClass = isDone ? "active" : isToday ? "today-dot" : "";
          return `
            <div class="week-day-col">
              <span>${escapeHtml(lbl)}</span>
              <span class="week-dot ${dotClass}"></span>

        const streakCount = state.streakCount || 0;

                              <div>

                                  <span>${escapeHtml(t("home.startLessonBtn"))}</span>

                            <div style="min-width:0;">
