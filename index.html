      /* ==========================================================================
         MOBILE LEARNING PATH SCREEN (MOCKUP 4)
         - Course picker bar across all 9 courses
         - Chapter headings
         - Lesson cards with line-art instrument/music icons, teal checkmarks,
           pomegranate border + saffron "NOW" badge on current lesson, padlock on locked
         - Decorative 5-line staves with colored notes & pomegranates between chapters
         ========================================================================== */
      function renderPathScreen() {
        const activeCourse = getCourseMeta(state.activeCourseId);
        const nextLesson = getNextUnlockedLesson();
        const currentLessonId = nextLesson ? nextLesson.id : -1;

        const chapters = [];
        for (const lesson of LESSONS) {
          const chName = lField(lesson.chapter);
          let group = chapters.find((c) => c.name === chName);
          if (!group) {
            group = { name: chName, lessons: [] };
            chapters.push(group);
          }
          group.lessons.push(lesson);
        }

        const chaptersHtml = chapters
          .map((ch, chIdx) => {
            const totalMin = ch.lessons.reduce((sum, l) => sum + (Number(l.minutes) || 5), 0);
            const chapterMetaText = t("path.chapterMeta", {
              count: ch.lessons.length,
              min: totalMin
            });

            const cards = ch.lessons
              .map((lesson) => {
                const isDone = state.completedLessons.includes(lesson.id);
                const isCurrent = lesson.id === currentLessonId;
                const isUnlocked = isLessonUnlocked(lesson, state.completedLessons, currentLessonId);
                const statusClass = isCurrent ? "current" : !isUnlocked ? "locked" : "";

                let statusBadge = "";
                if (isDone) {
                  statusBadge = `<span class="path-status-circle done" title="${escapeHtml(t("path.statusDone"))}">✓</span>`;
                } else if (isCurrent) {
                  statusBadge = `<span class="path-status-circle current" title="${escapeHtml(t("path.statusCurrent"))}"><span class="dir-flip">▶</span></span>`;
                } else if (isUnlocked) {
                  statusBadge = `<span class="path-status-circle open"><span class="dir-flip">▶</span></span>`;
                } else {
                  statusBadge = `
                    <span class="path-status-circle locked" title="${escapeHtml(t("path.statusLocked"))}">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2Zm-7-2a2 2 0 1 1 4 0v2h-4V7Z"/></svg>
                    </span>
                  `;
                }

                return `
                  <button type="button" class="m-card path-lesson-card ${statusClass}" data-action="path-lesson-tap" data-lesson-id="${lesson.id}" data-unlocked="${isUnlocked}">
                    ${
                      isCurrent
                        ? `<div class="panel-girih path-now-strip">
                            <span class="saffron-accent" aria-hidden="true">♪</span>
                            <span class="saffron-accent">${escapeHtml(t("path.statusCurrent"))}</span>
                          </div>`
                        : ""
                    }
                    <div class="path-icon-box">
                      ${renderArchPlaceholder({
                        imageUrl: lesson.imageUrl || (state.activeCourseId === "piano" ? getDefaultLessonImage(lesson.id) : ""),
                        ratio: "compact",
                        uid: `path-lesson-${state.activeCourseId}-${lesson.id}`,
                        lessonId: lesson.id,
                        courseId: state.activeCourseId,
                        chapterIndex: chIdx
                      })}
                    </div>
                    <div style="flex:1;min-width:0;">
                      <div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:5px;">
                        <span class="lesson-num-badge">${escapeHtml(t("lesson.kicker", { id: lesson.id }))}</span>
                        <span style="font-size:0.8rem;color:var(--muted);font-weight:500;">
                          · ${toLocaleDigits(lesson.minutes)} ${escapeHtml(t("path.minutesUnit"))}
                        </span>
                        ${renderTeacherReviewBadge(lesson, activeCourse)}
                      </div>
                      <div class="serif-heading one-line-ellipsis" style="font-size:1.1rem;font-weight:600;">
                        ${escapeHtml(lField(lesson.title))}
                      </div>
                    </div>
                    ${statusBadge}
                  </button>
                `;
              })
              .join("");

            return `
              <section class="chapter-block">
                <div class="chapter-header-row">
                  <h2 class="chapter-heading serif-heading">${escapeHtml(ch.name)}</h2>
                  <span class="chapter-meta-badge">${escapeHtml(chapterMetaText)}</span>
                </div>
                <div class="chapter-lessons-grid">
                  ${cards}
                </div>
              </section>
            `;
          })
          .join("");

        return `
          <div class="mobile-shell">
            <header class="mobile-topbar">
              <div class="brand-logo">MUSICHER</div>
              <button type="button" class="lang-switch-pill" style="min-height:44px;padding:6px 12px;font-size:0.78rem;" data-action="toggle-lang">
                ${escapeHtml(t("nav.langToggle"))}
              </button>
            </header>
            <main class="screen-body">
              <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;">
                <h1 class="serif-heading" style="font-size:clamp(1.65rem, 2.5vw, 2.15rem);margin:0;">${escapeHtml(t("path.title"))}</h1>
                ${LESSONS.length > 0 ? renderTeacherReviewBadge(null, activeCourse) : ""}
              </div>
              ${renderCoursePickerBar()}
              ${chaptersHtml}
            </main>
            ${renderBottomNav("path")}
          </div>
        `;
      }

      function renderCornerOrnamentSvg(posClass) {

        const stepsArr = lField(lesson.steps) || [];

        let rightColHtml = "";

        if (stepIdx === 0) {

              <span>${escapeHtml(t("lesson.nextBtn"))}</span>

              </button>
            </div>
          `;
        } else if (stepIdx === 1) {
          // Step 1: See & Hear + Self-Check
          rightColHtml = `
            <div class="kicker-staff-row">
              <span class="kicker-label underlined">${escapeHtml(t("lesson.stepSeeTitle"))}</span>
              <div class="staff-5lines-bar"></div>

              <p style="font-size:0.98rem;line-height:1.6;">${formatBidiText(lField(lesson.see))}</p>

              <div class="staff-5lines-bar"></div>

      function findAdvisorReply(queryText) {
        const norm = String(queryText || "").trim().toLowerCase();
        for (const item of MISTAKES) {
          const matched = (item.keywords || []).some((kw) => norm.includes(String(kw).toLowerCase()));
          if (matched) {
            return {
              found: true,
              cause: lField(item.cause),
              fix: lField(item.fix),
              lessonId: item.lessonId,
              courseId: item.courseId || "piano"
            };
          }
        }
        return { found: false };
      }

      function startStandaloneMetronomeLoop() {
        if (ui.metronomeTimerId) {
          clearInterval(ui.metronomeTimerId);
          ui.metronomeTimerId = null;
        }
        unlockPianoAudio();
        const bpm = Math.max(40, Math.min(160, Number(ui.metronomeBpm) || 76));
        const meterStr = String(ui.metronomeMeter || "4/4");
        const beatsPerBar = meterStr === "3/4" ? 3 : meterStr === "2/4" ? 2 : meterStr === "6/8" ? 6 : 4;
        const intervalMs = meterStr === "6/8" ? Math.round(30000 / bpm) : Math.round(60000 / bpm);

        ui.metronomeRunning = true;
        ui.metronomeBeatIdx = 0;
        playMetronomeTickSound(true);
        render();

        ui.metronomeTimerId = setInterval(() => {
          ui.metronomeBeatIdx = (ui.metronomeBeatIdx + 1) % beatsPerBar;
          playMetronomeTickSound(ui.metronomeBeatIdx === 0);
          const dots = document.querySelectorAll(".metronome-beat-dot");
          dots.forEach((el, idx) => {
            el.classList.toggle("active", idx === ui.metronomeBeatIdx);
          });
        }, intervalMs);
      }

      function toggleStandaloneMetronome() {
        if (ui.metronomeRunning) {
          if (ui.metronomeTimerId) {
            clearInterval(ui.metronomeTimerId);
            ui.metronomeTimerId = null;
          }
          ui.metronomeRunning = false;
          ui.metronomeBeatIdx = -1;
          render();
        } else {
          startStandaloneMetronomeLoop();
        }
      }

            icon: getInstrumentSvg("ear"),

            desc: t("library.toolEarGameDesc")
          },
          {
            id: "breath-timer",
            icon: `<svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="20" r="10"/><path d="M18 14v6l4 2"/><path d="M15 6h6"/></svg>`,
            title: t("library.toolBreathTimer"),
            desc: t("library.toolBreathTimerDesc")
          }

        const activeTool = ui.activePracticeTool;
        let activeToolHtml = "";

        if (activeTool === "free-piano") {
          activeToolHtml = `
            <div style="margin-top:16px;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">

          const meter = ui.metronomeMeter || "4/4";
          const beatsCount = meter === "3/4" ? 3 : meter === "2/4" ? 2 : meter === "6/8" ? 6 : 4;
          const dotsHtml = Array.from({ length: beatsCount }, (_, idx) => {
            const isAct = ui.metronomeRunning && ui.metronomeBeatIdx === idx;
            return `<div class="metronome-beat-dot ${idx === 0 ? "accent" : ""} ${isAct ? "active" : ""}">${toLocaleDigits(idx + 1)}</div>`;
          }).join("");

          activeToolHtml = `
            <div class="m-card vpiano-card" style="margin-top:16px;">
              <div class="vpiano-header-row">
                <span class="serif-heading" style="font-size:1.18rem;font-weight:700;">⏱ ${escapeHtml(t("library.toolMetronome"))}</span>
                <button type="button" class="vpiano-pill-btn" data-action="close-practice-tool">✕ ${escapeHtml(t("library.toolBackToList"))}</button>
              </div>
              <div style="text-align:center;padding:8px 0 14px;">
                <div class="serif-heading" style="font-size:2.1rem;font-weight:700;color:var(--ink);margin-bottom:6px;">

                <div style="display:flex;align-items:center;justify-content:center;gap:12px;max-width:340px;margin:0 auto 14px;">

                </div>
                <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:14px;">
                  <span style="font-size:0.84rem;font-weight:700;color:var(--muted);">${escapeHtml(t("library.metronomeMeterLabel"))}:</span>
                  ${["2/4", "3/4", "4/4", "6/8"]
                    .map(
                      (m) => `
                        <button type="button" class="vpiano-pill-btn ${meter === m ? "active" : ""}" data-action="metronome-set-meter" data-meter="${m}" dir="ltr">
                          ${m}
                        </button>
                      `

                <div class="metronome-beats-row" dir="ltr">
                  ${dotsHtml}

                <div style="margin-top:12px;">

                    <span>${ui.metronomeRunning ? "■" : "▶"}</span>
                    <span>${escapeHtml(ui.metronomeRunning ? t("library.metronomeStopBtn") : t("library.metronomeStartBtn"))}</span>
                  </button>
                </div>
              </div>
            </div>
          `;
        } else if (activeTool === "rhythm-tap") {
          const toolLesson = getActivePracticeContextLesson();
          const presets = [
            { id: "4/4-steady", label: "4/4 (1 · 1 · 1 · 1)" },
            { id: "3/4-waltz", label: "3/4 (2 · 1)" },
            { id: "4/4-eighth", label: "4/4 (0.5 × 4 · 1 · 1)" },
            { id: "6/8-persian", label: "6/8 (1 · 0.5 · 1 · 0.5)" }
          ];
          activeToolHtml = `
            <div style="margin-top:16px;">
              <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
                <div style="display:flex;gap:6px;flex-wrap:wrap;" dir="ltr">
                  ${presets
                    .map(
                      (pr) => `
                        <button type="button" class="vpiano-pill-btn ${ui.toolRhythmPreset === pr.id ? "active" : ""}" data-action="set-tool-rhythm-preset" data-preset="${pr.id}">
                          ${escapeHtml(pr.label)}
                        </button>
                      `
                    )
                    .join("")}
                </div>
                <button type="button" class="vpiano-pill-btn" data-action="close-practice-tool">✕ ${escapeHtml(t("library.toolBackToList"))}</button>
              </div>
              ${renderRhythmTapPracticeCard(toolLesson)}
            </div>
          `;
        } else if (activeTool === "ear-game") {
          const toolLesson = getActivePracticeContextLesson();
          const modes = [
            { id: "higher-lower", label: `${t("practice.choiceHigher")} / ${t("practice.choiceLower")}` },
            { id: "same-different", label: `${t("practice.choiceSame")} / ${t("practice.choiceDifferent")}` },
            { id: "step-leap", label: `${t("practice.choiceStep")} / ${t("practice.choiceLeap")}` },
            { id: "major-minor", label: `${t("practice.choiceMajor")} / ${t("practice.choiceMinor")}` }

          activeToolHtml = `
            <div style="margin-top:16px;">
              <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
                <div style="display:flex;gap:6px;flex-wrap:wrap;">
                  ${modes
                    .map(
                      (m) => `
                        <button type="button" class="vpiano-pill-btn ${ui.toolEarMode === m.id ? "active" : ""}" data-action="set-tool-ear-mode" data-mode="${m.id}">
                          ${escapeHtml(m.label)}
                        </button>
                      `
                    )
                    .join("")}
                </div>
                <button type="button" class="vpiano-pill-btn" data-action="close-practice-tool">✕ ${escapeHtml(t("library.toolBackToList"))}</button>
              </div>
              ${renderEarChoicePracticeCard(toolLesson)}
            </div>
          `;
        } else if (activeTool === "breath-timer") {
          const toolLesson = getActivePracticeContextLesson();
          activeToolHtml = `
            <div style="margin-top:16px;">
              <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
                <div style="display:flex;gap:6px;">
                  ${[30, 60, 90]
                    .map(
                      (s) => `
                        <button type="button" class="vpiano-pill-btn ${Number(ui.toolTimerSeconds) === s ? "active" : ""}" data-action="set-tool-timer-sec" data-sec="${s}">
                          ${toLocaleDigits(s)}s
                        </button>
                      `
                    )
                    .join("")}
                </div>
                <button type="button" class="vpiano-pill-btn" data-action="close-practice-tool">✕ ${escapeHtml(t("library.toolBackToList"))}</button>
              </div>
              ${renderTimerPracticeCard(toolLesson)}
            </div>
          `;
        }

        return `
          <div>
            <p style="font-size:0.9rem;color:var(--muted);margin-bottom:14px;">
              ${escapeHtml(t("library.practiceToolsSub"))}
            </p>
            <div class="practice-tools-grid">
              ${tools
                .map(
                  (tl) => `
                    <button type="button" class="m-card practice-tool-tile ${activeTool === tl.id ? "active" : ""}" data-action="open-practice-tool" data-tool="${tl.id}">

                      <div style="min-width:0;flex:1;">
                        <div class="serif-heading" style="font-size:1.06rem;font-weight:700;margin-bottom:3px;">${escapeHtml(tl.title)}</div>

                      </div>
                    </button>
                  `
                )
                .join("")}
            </div>
            ${activeToolHtml}
          </div>
        `;
      }

      function renderLibraryScreen() {
        const search = (ui.librarySearch || "").trim().toLowerCase();
        const visibleCourses = getVisibleCourses();
        const curTab = ui.libraryTab === "piano" ? "tools" : ui.libraryTab || "lessons";

        const groupedCoursesHtml = visibleCourses
          .map((course) => {
            const cLessons = getCourseLessons(course.id).filter((l) => {
              if (!search) return true;
              const title = String(lField(l.title)).toLowerCase();
              const ch = String(lField(l.chapter)).toLowerCase();
              return title.includes(search) || ch.includes(search);
            });
            if (cLessons.length === 0) return "";
            const doneList = state.courseProgress?.[course.id]?.completedLessons || [];

            return `
              <section style="margin-bottom:24px;">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;">
                  <div style="display:flex;align-items:center;gap:8px;">
                    <span style="width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;">${getInstrumentSvg(course.icon)}</span>
                    <h2 class="serif-heading" style="font-size:1.3rem;margin:0;">${escapeHtml(lField(course.title))}</h2>
                  </div>
                  <span class="chapter-meta-badge">${escapeHtml(t("courses.progressShort", { done: doneList.length, total: getCourseLessons(course.id).length }))}</span>
                </div>
                <div class="library-lessons-grid">
                  ${cLessons
                    .map(
                      (l) => `
                        <div class="m-card" style="display:flex;flex-direction:column;justify-content:space-between;gap:12px;">
                          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">
                            <div style="min-width:0;flex:1;">
                              <div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px;">
                                <span class="lesson-num-badge">${escapeHtml(t("lesson.kicker", { id: l.id }))}</span>
                                <span style="font-size:0.78rem;color:var(--muted);">
                                  ${escapeHtml(lField(l.chapter))} · ${toLocaleDigits(l.minutes)} ${escapeHtml(t("path.minutesUnit"))}
                                </span>
                                ${renderTeacherReviewBadge(l, course)}
                              </div>
                              <div class="serif-heading" style="font-size:1.1rem;">
                                ${escapeHtml(lField(l.title))}
                              </div>
                            </div>
                            <button type="button" class="btn-pill btn-surface" style="min-height:44px;padding:8px 16px;font-size:0.84rem;flex-shrink:0;" data-action="open-course-lesson" data-course-id="${escapeHtml(course.id)}" data-lesson-id="${l.id}">
                              ${escapeHtml(t("library.openBtn"))}
                            </button>
                          </div>
                          <div style="font-size:0.86rem;line-height:1.55;color:var(--ink);border-top:1px solid var(--border-subtle);padding-top:10px;">
                            <p>${formatBidiText(lField(l.see))}</p>
                            ${l.diagram ? drawKeyboard(l.diagram) : ""}
                          </div>
                        </div>
                      `
                    )
                    .join("")}
                </div>
              </section>
            `;
          })
          .filter(Boolean)
          .join("");

        return `
          <div class="mobile-shell">
            <header class="mobile-topbar">
              <div class="brand-logo">MUSICHER</div>
              <button type="button" class="lang-switch-pill" style="min-height:44px;padding:6px 12px;font-size:0.78rem;" data-action="toggle-lang">
                ${escapeHtml(t("nav.langToggle"))}
              </button>
            </header>
            <main class="screen-body">
              <div class="centered-800-container">
                <h1 class="serif-heading" style="font-size:clamp(1.6rem, 2.4vw, 2.05rem);margin-bottom:14px;">${escapeHtml(t("library.title"))}</h1>

                <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px;margin-bottom:18px;">
                  <button type="button" class="btn-pill ${curTab === "lessons" ? "btn-primary" : "btn-surface"}" style="min-height:44px;padding:8px 10px;" data-action="set-library-tab" data-tab="lessons">
                    ${escapeHtml(t("library.tabMyLessons"))}
                  </button>
                  <button type="button" class="btn-pill ${curTab === "tools" ? "btn-primary" : "btn-surface"}" style="min-height:44px;padding:8px 10px;" data-action="set-library-tab" data-tab="tools">
                    🎹 ${escapeHtml(t("library.tabPracticeTools"))}
                  </button>
                  <button type="button" class="btn-pill ${curTab === "teachers" ? "btn-primary" : "btn-surface"}" style="min-height:44px;padding:8px 10px;" data-action="set-library-tab" data-tab="teachers">
                    ${escapeHtml(t("library.tabTeachers"))}
                  </button>
                </div>

                ${
                  curTab === "lessons"
                    ? `<div>
                        <input type="search" id="library-search-input" class="m-input" style="margin-bottom:18px;" placeholder="${escapeHtml(t("library.searchPlaceholder"))}" value="${escapeHtml(ui.librarySearch)}" />
                        ${
                          groupedCoursesHtml
                            ? groupedCoursesHtml
                            : `<div class="m-card surface-fill" style="text-align:center;">${escapeHtml(t("library.noResults"))}</div>`
                        }
                      </div>`
                    : curTab === "tools"
                    ? renderPracticeToolsSection()
                    : renderTeachersSection()
                }
              </div>
            </main>
            ${renderBottomNav("library")}
          </div>
        `;
      }

                  <div class="profile-setting-row">
                    <span style="font-size:0.9rem;font-weight:700;">${escapeHtml(t("profile.instLabel"))}</span>

                  </div>

                  <div class="profile-setting-row">
                    <span style="font-size:0.9rem;font-weight:700;">${escapeHtml(t("profile.accessLabel"))}</span>

                      <option value="5" ${Number(state.dailyGoal) === 5 ? "selected" : ""}>${escapeHtml(t("onboarding.goal5"))}</option>
                      <option value="15" ${Number(state.dailyGoal) === 15 ? "selected" : ""}>${escapeHtml(t("onboarding.goal15"))}</option>
                      <option value="30" ${Number(state.dailyGoal) === 30 ? "selected" : ""}>${escapeHtml(t("onboarding.goal30"))}</option>

                </div>
              </div>
            </main>
            ${renderBottomNav("profile")}
          </div>
        `;

      /* ==========================================================================
         MODALS

      function renderModal() {
        if (!ui.modal) return "";

        if (ui.modal === "about") {
          return `
            <div class="modal-backdrop" role="dialog" aria-modal="true">
              <div class="modal-card">
                <h2 class="serif-heading" style="font-size:1.45rem;margin-bottom:8px;">${escapeHtml(t("profile.aboutTitle"))}</h2>
                <p style="font-size:0.92rem;margin-bottom:10px;">${escapeHtml(t("profile.aboutBody"))}</p>
                <p style="font-size:0.8rem;color:var(--muted);margin-bottom:18px;">${escapeHtml(t("profile.aboutNote"))}</p>
                <button type="button" class="btn-pill btn-primary btn-block" data-action="close-modal">
                  ${escapeHtml(t("profile.closeBtn"))}
                </button>
              </div>
            </div>
          `;
        }

        if (ui.modal === "account") {
          return `
            <div class="modal-backdrop" role="dialog" aria-modal="true">
              <div class="modal-card">
                <h2 class="serif-heading" style="font-size:1.4rem;margin-bottom:12px;">${escapeHtml(t("lesson.l1SignupTitle"))}</h2>
                <form id="modal-account-form" style="display:flex;flex-direction:column;gap:12px;">
                  <div>
                    <label style="display:block;font-size:0.84rem;font-weight:700;margin-bottom:4px;">${escapeHtml(t("lesson.l1NameLabel"))}</label>
                    <input type="text" name="userName" class="m-input" value="${escapeHtml(state.userName)}" placeholder="${escapeHtml(t("lesson.l1NamePlaceholder"))}" />
                  </div>
                  <div>
                    <label style="display:block;font-size:0.84rem;font-weight:700;margin-bottom:4px;">${escapeHtml(t("lesson.l1EmailLabel"))}</label>
                    <input type="email" name="userEmail" class="m-input" value="${escapeHtml(state.userEmail)}" placeholder="name@example.com" />
                  </div>
                  <div style="display:flex;gap:8px;margin-top:6px;">
                    <button type="button" class="btn-pill btn-surface" style="flex:1;" data-action="close-modal">${escapeHtml(t("profile.cancelBtn"))}</button>
                    <button type="submit" class="btn-pill btn-primary" style="flex:1;">${escapeHtml(t("lesson.l1SaveBtn"))}</button>
                  </div>
                </form>
              </div>
            </div>
          `;
        }

        if (ui.modal === "reset") {
          return `
            <div class="modal-backdrop" role="dialog" aria-modal="true">
              <div class="modal-card">
                <h2 class="serif-heading" style="font-size:1.4rem;margin-bottom:8px;">${escapeHtml(t("profile.resetTitle"))}</h2>
                <p style="font-size:0.9rem;color:var(--muted);margin-bottom:18px;">${escapeHtml(t("profile.resetBody"))}</p>
                <div style="display:flex;gap:8px;">
                  <button type="button" class="btn-pill btn-surface" style="flex:1;" data-action="close-modal">${escapeHtml(t("profile.cancelBtn"))}</button>
                  <button type="button" class="btn-pill btn-primary" style="flex:1;" data-action="confirm-reset">${escapeHtml(t("profile.resetConfirmBtn"))}</button>
                </div>
              </div>
            </div>
          `;
        }

        return "";

      /* ==========================================================================
         MAIN RENDER & EVENT HANDLERS
         ========================================================================== */
      function render() {
        applyDocumentLangAndTheme();
        const root = document.getElementById("app-root");
        if (!root) return;

        let screenHtml = "";
        switch (ui.screen) {
          case "splash":
            screenHtml = renderSplashScreen();
            break;
          case "welcome":
            screenHtml = renderWelcomeScreen();
            break;
          case "signin":
            screenHtml = renderSignInScreen();
            break;
          case "onboarding":
            screenHtml = renderOnboardingScreen();
            break;
          case "home":
            screenHtml = renderHomeScreen();
            break;
          case "path":
            screenHtml = renderPathScreen();
            break;
          case "lesson":
            screenHtml = renderLessonScreen();
            break;
          case "skipQuiz":
            screenHtml = renderSkipQuizScreen();
            break;
          case "advisor":
            screenHtml = renderAdvisorScreen();
            break;
          case "library":
            screenHtml = renderLibraryScreen();
            break;
          case "profile":
            screenHtml = renderProfileScreen();
            break;
          default:
            screenHtml = renderHomeScreen();
        }

        const toastHtml = ui.toastMessage
          ? `<div class="toast-banner" role="status">${escapeHtml(ui.toastMessage)}</div>`
          : "";

        root.innerHTML = screenHtml + renderModal() + toastHtml;
        requestAnimationFrame(() => centerTargetKeyInScroll(false));
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && ui.modal) {
          ui.modal = null;
          render();
        }
      });

      document.addEventListener("click", (e) => {
        if (ui.modal && e.target && e.target.classList && e.target.classList.contains("modal-backdrop")) {
          ui.modal = null;
          render();
          return;
        }
        const btn = e.target.closest("[data-action]");
        if (!btn) return;
        const action = btn.getAttribute("data-action");

        switch (action) {
          case "toggle-lang":
            toggleLanguage();
            break;

          case "set-lang": {
            const newLang = btn.getAttribute("data-lang");
            if (newLang === "en" || newLang === "fa") {
              state.lang = newLang;
              saveState();
              render();
            }
            break;
          }

          case "start-onboarding":
            state.onboardingStep = 1;
            ui.pendingOtherInstrument = null;
            ui.screen = "onboarding";
            saveState();
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
            break;

          case "go-signin":
            ui.screen = "signin";
            render();
            break;

          case "back-to-welcome":
            ui.screen = "welcome";
            render();
            break;

          case "continue-guest":
            state.isGuest = true;
            ui.screen = state.onboardingComplete ? "home" : "onboarding";
            saveState();
            render();
            break;

          case "onboard-back":
            if (state.onboardingStep > 1) {
              state.onboardingStep -= 1;
              saveState();
              render();
            } else {
              ui.screen = "welcome";
              render();
            }
            break;

          case "select-onboard-inst": {
            const isAct = btn.getAttribute("data-active") === "true";
            if (isAct) {
              state.instrument = "piano";
              ui.pendingOtherInstrument = null;
            } else {
              ui.pendingOtherInstrument = btn.getAttribute("data-inst");
            }
            saveState();
            render();
            break;
          }

          case "onboard-next":
            state.instrument = "piano";
            ui.pendingOtherInstrument = null;
            if (state.onboardingStep < 7) {
              state.onboardingStep += 1;
            }
            saveState();
            render();
            break;

          case "set-onboard-field": {
            const field = btn.getAttribute("data-field");
            const val = btn.getAttribute("data-value");
            state[field] = field === "dailyGoal" ? Number(val) : val;
            saveState();
            render();
            break;
          }

          case "toggle-motive": {
            const m = btn.getAttribute("data-motive");
            const list = state.motivations || [];
            if (list.includes(m)) {
              state.motivations = list.filter((x) => x !== m);
            } else {
              state.motivations = [...list, m];
            }
            saveState();
            render();
            break;
          }

          case "save-onboard-reminder": {
            const inp = document.getElementById("onboard-reminder-input");
            if (inp && inp.value) state.reminderTime = inp.value;
            state.onboardingStep = 7;
            saveState();
            render();
            break;
          }

          case "skip-reminder":
            state.reminderTime = "";
            state.onboardingStep = 7;
            saveState();
            render();
            break;

          case "finish-onboarding":
            state.onboardingComplete = true;
            ui.screen = "home";
            saveState();
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
            break;

          case "nav-tab": {
            stopPianoWatchDemo();
            stopMultiPracticeTimers();
            const tab = btn.getAttribute("data-tab");
            ui.screen = tab;

            window.scrollTo({ top: 0, behavior: "smooth" });

            break;

          case "open-course-lesson": {

            ui.multiPractice.lessonKey = null;
            ui.screen = "lesson";
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });

            stopMultiPracticeTimers();
            const lid = Number(btn.getAttribute("data-lesson-id")) || 1;
            ui.activeLessonId = lid;
            ui.lessonStepIndex = 0;
            ui.selfCheckState = {};
            ui.quizSelected = null;
            ui.quizAnswered = false;
            ui.pianoPractice.lessonId = null;
            ui.multiPractice.lessonKey = null;
            ui.screen = "lesson";

            stopMultiPracticeTimers();

            ui.lessonStepIndex = 0;
            ui.selfCheckState = {};
            ui.quizSelected = null;
            ui.quizAnswered = false;

            ui.screen = "lesson";

          case "lesson-next-step":
            stopPianoWatchDemo();

            const choice = btn.getAttribute("data-choice");

            const curChallenge = mp.earChallenges[mp.earRoundIdx];
            if (!curChallenge) break;
            mp.earSelected = choice;
            mp.earAnswered = true;
            mp.earIsRight = choice === curChallenge.answer;
            if (mp.earIsRight && mp.earRoundIdx + 1 >= mp.earChallenges.length) {
              mp.earDone = true;
              markLessonPracticeCompleted(lesson);
            }
            refreshLessonPianoMount(false);
            break;
          }

          case "mp-ear-next": {
            const lesson = getActivePracticeContextLesson();
            if (!lesson) break;
            const mp = ui.multiPractice;
            if (mp.earRoundIdx + 1 < mp.earChallenges.length) {
              mp.earRoundIdx += 1;
              mp.earSelected = null;
              mp.earAnswered = false;
              mp.earIsRight = false;

            stopMultiPracticeTimers();

            stopMultiPracticeTimers();
            ui.activePracticeTool = btn.getAttribute("data-tool") || "free-piano";

            window.scrollTo({ top: 0, behavior: "smooth" });

            if (nameInp && nameInp.value.trim()) {

      /* ==========================================================================
         VIRTUAL PIANO MULTI-TOUCH, MOUSE, MINI-MAP & COMPUTER KEYBOARD LISTENERS
         ========================================================================== */
      let isMouseDownOnPiano = false;
      let isDraggingPianoMinimap = false;
      let activeMinimapEl = null;
      let activeMousePianoNote = null;
      let lastPianoTouchTime = 0;
      const activeTouchMap = new Map();
      const activeComputerKeys = new Set();

      function jumpPianoWindowFromMinimapClientX(minimapEl, clientX, animate = false) {
        if (!minimapEl) return;
        const rect = minimapEl.getBoundingClientRect();
        if (!rect.width) return;
        const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        const winCols = getPianoVisibleWhiteCount();
        const centerWhite = ratio * VPIANO_TOTAL_WHITE_KEYS;
        const targetStart = Math.round(centerWhite - winCols / 2);
        setPianoWindowStartWhiteIdx(targetStart, animate);
      }

      document.addEventListener("mousedown", (e) => {
        if (Date.now() - lastPianoTouchTime < 650) return;
        if (e.button !== undefined && e.button !== 0) return;

        const minimapEl = e.target.closest(".vpiano-minimap");
        if (minimapEl) {
          e.preventDefault();
          isDraggingPianoMinimap = true;
          activeMinimapEl = minimapEl;
          jumpPianoWindowFromMinimapClientX(minimapEl, e.clientX, true);
          return;
        }

        const keyEl = e.target.closest(".vpiano-key");
        if (!keyEl) return;
        e.preventDefault();
        isMouseDownOnPiano = true;
        const note = keyEl.getAttribute("data-note");
        activeMousePianoNote = note;
        keyEl.classList.add("is-pressed");
        handlePianoNoteTriggered(note);
      });

      document.addEventListener("mousemove", (e) => {
        if (!isDraggingPianoMinimap || !activeMinimapEl) return;
        e.preventDefault();
        jumpPianoWindowFromMinimapClientX(activeMinimapEl, e.clientX, false);
      });

      document.addEventListener("mouseover", (e) => {
        if (!isMouseDownOnPiano || Date.now() - lastPianoTouchTime < 650) return;
        // Only glide across keys in free-play mode so holding mouse during practice step transitions doesn't double-trigger
        if (ui.screen === "lesson") return;
        const keyEl = e.target.closest(".vpiano-key");
        if (!keyEl) return;
        const note = keyEl.getAttribute("data-note");
        if (note && note !== activeMousePianoNote) {
          document.querySelectorAll(".vpiano-key.is-pressed").forEach((el) => el.classList.remove("is-pressed"));
          activeMousePianoNote = note;
          keyEl.classList.add("is-pressed");
          handlePianoNoteTriggered(note);
        }
      });

      window.addEventListener("mouseup", () => {
        if (isDraggingPianoMinimap) {
          isDraggingPianoMinimap = false;
          activeMinimapEl = null;
        }
        if (isMouseDownOnPiano) {
          isMouseDownOnPiano = false;
          activeMousePianoNote = null;
          document.querySelectorAll(".vpiano-key.is-pressed").forEach((el) => el.classList.remove("is-pressed"));
        }
      });

      document.addEventListener("touchstart", (e) => {
        if (!ui.pianoAudioUnlocked) {
          unlockPianoAudio();
        }
        const minimapEl = e.target.closest(".vpiano-minimap");
        if (minimapEl && e.touches.length > 0) {
          lastPianoTouchTime = Date.now();
          e.preventDefault();
          isDraggingPianoMinimap = true;
          activeMinimapEl = minimapEl;
          jumpPianoWindowFromMinimapClientX(minimapEl, e.touches[0].clientX, true);
          return;
        }

        const keyEl = e.target.closest(".vpiano-key");
        if (!keyEl) return;
        lastPianoTouchTime = Date.now();

        for (let i = 0; i < e.changedTouches.length; i++) {
          const tPoint = e.changedTouches[i];
          const el = document.elementFromPoint(tPoint.clientX, tPoint.clientY);
          const touchedKey = (el ? el.closest(".vpiano-key") : null) || keyEl;
          const note = touchedKey ? touchedKey.getAttribute("data-note") : null;
          if (note) {
            activeTouchMap.set(tPoint.identifier, note);
            touchedKey.classList.add("is-pressed");
            handlePianoNoteTriggered(note);
          }
        }
      }, { passive: false });

      document.addEventListener("touchmove", (e) => {
        if (isDraggingPianoMinimap && activeMinimapEl && e.touches.length > 0) {
          lastPianoTouchTime = Date.now();
          e.preventDefault();
          jumpPianoWindowFromMinimapClientX(activeMinimapEl, e.touches[0].clientX, false);
          return;
        }
        if (activeTouchMap.size === 0) return;
        lastPianoTouchTime = Date.now();
        // Only glide on touchmove in free-play mode; in lesson practice mode allow discrete taps
        if (ui.screen === "lesson") return;
        if (!e.target.closest(".vpiano-keyboard")) return;
        e.preventDefault();

        for (let i = 0; i < e.changedTouches.length; i++) {
          const tPoint = e.changedTouches[i];
          const prevNote = activeTouchMap.get(tPoint.identifier);
          const el = document.elementFromPoint(tPoint.clientX, tPoint.clientY);
          const touchedKey = el ? el.closest(".vpiano-key") : null;
          const nextNote = touchedKey ? touchedKey.getAttribute("data-note") : null;
          if (nextNote && nextNote !== prevNote) {
            if (prevNote) {
              const oldEl = document.querySelector(`.vpiano-key[data-note="${prevNote}"]`);
              if (oldEl) oldEl.classList.remove("is-pressed");
            }
            activeTouchMap.set(tPoint.identifier, nextNote);
            touchedKey.classList.add("is-pressed");
            handlePianoNoteTriggered(nextNote);
          }
        }
      }, { passive: false });

      document.addEventListener("touchend", (e) => {
        if (isDraggingPianoMinimap) {
          isDraggingPianoMinimap = false;
          activeMinimapEl = null;
        }
        if (activeTouchMap.size === 0) return;
        lastPianoTouchTime = Date.now();
        for (let i = 0; i < e.changedTouches.length; i++) {
          const tPoint = e.changedTouches[i];
          const note = activeTouchMap.get(tPoint.identifier);
          activeTouchMap.delete(tPoint.identifier);
          if (note) {
            const oldEl = document.querySelector(`.vpiano-key[data-note="${note}"]`);
            if (oldEl) oldEl.classList.remove("is-pressed");
          }
        }
      }, { passive: false });

      document.addEventListener("touchcancel", () => {
        isDraggingPianoMinimap = false;
        activeMinimapEl = null;
        activeTouchMap.clear();
        document.querySelectorAll(".vpiano-key.is-pressed").forEach((el) => el.classList.remove("is-pressed"));
      });

      window.addEventListener("resize", () => {
        if (document.querySelector(".vpiano-keyboard")) {
          updatePianoWindowDOM(false);
        }
      });

      document.addEventListener("keydown", (e) => {
        if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
        const tag = (e.target && e.target.tagName ? e.target.tagName : "").toLowerCase();
        if (tag === "input" || tag === "textarea" || tag === "select") return;

        if ((e.code === "Space" || e.key === " ") && document.querySelector(".rhythm-tap-pad")) {
          e.preventDefault();
          handleRhythmTapAction();
          return;
        }

        if (!document.querySelector(".vpiano-keyboard")) return;

        const k = String(e.key || "").toLowerCase();
        if (k === "z") {
          e.preventDefault();
          shiftPianoOctave(-1, true);
          return;
        }
        if (k === "x") {
          e.preventDefault();
          shiftPianoOctave(1, true);
          return;
        }

        const keyMap = getActiveComputerKeyMap();
        const mappedNote = keyMap[k];
        if (mappedNote && !activeComputerKeys.has(k)) {
          activeComputerKeys.add(k);
          const keyEl = document.querySelector(`.vpiano-key[data-note="${mappedNote}"]`);
          if (keyEl) keyEl.classList.add("is-pressed");
          handlePianoNoteTriggered(mappedNote, keyEl);
        }
      });

      document.addEventListener("keyup", (e) => {
        const k = String(e.key || "").toLowerCase();
        if (activeComputerKeys.has(k)) {
          activeComputerKeys.delete(k);
        }
        const keyMap = getActiveComputerKeyMap();
        const mappedNote = keyMap[k];
        if (mappedNote) {
          const keyEl = document.querySelector(`.vpiano-key[data-note="${mappedNote}"]`);
          if (keyEl) keyEl.classList.remove("is-pressed");
        } else {
          document.querySelectorAll(".vpiano-key.is-pressed").forEach((el) => el.classList.remove("is-pressed"));
        }
      });

      document.addEventListener("change", (e) => {
        const sel = e.target.closest("[data-action='profile-select']");
        if (!sel) return;
        const field = sel.getAttribute("data-field");
        if (field === "dailyGoal") {
          state[field] = Number(sel.value);
        } else if (field === "reminderTime") {
          const normalized = String(sel.value || "")
            .trim()
            .replace(/[۰-۹]/g, (d) => String(FA_DIGITS.indexOf(d)));
          if (/^([01]?\d|2[0-3]):[0-5]\d$/.test(normalized)) {
            const [hh, mm] = normalized.split(":");
            state.reminderTime = `${hh.padStart(2, "0")}:${mm}`;
          }
          render();
        } else {
          state[field] = sel.value;
        }
        saveState();
        showToast(t("profile.savedToast"));
      });

      document.addEventListener("input", (e) => {
        if (e.target.id === "library-search-input") {
          ui.librarySearch = e.target.value;
          render();
          const inp = document.getElementById("library-search-input");
          if (inp) {
            inp.focus();
            inp.setSelectionRange(inp.value.length, inp.value.length);
          }
        } else if (e.target.id === "metronome-bpm-slider") {
          ui.metronomeBpm = Math.max(40, Math.min(160, Number(e.target.value) || 76));
          if (ui.metronomeRunning) {
            startStandaloneMetronomeLoop();
          } else {
            render();
          }
        }
      });

      document.addEventListener("submit", (e) => {
        if (e.target.id === "signin-form") {
          e.preventDefault();
          const fd = new FormData(e.target);
          const email = String(fd.get("email") || "").trim();
          if (email) state.userEmail = email;
          state.isGuest = true;
          saveState();
          ui.screen = state.onboardingComplete ? "home" : "onboarding";
          render();
        } else if (e.target.id === "advisor-form") {
          e.preventDefault();
          const inp = document.getElementById("advisor-input");
          const q = inp ? inp.value.trim() : "";
          if (!q) return;
          const res = findAdvisorReply(q);
          state.advisorHistory = [...(state.advisorHistory || []), { query: q, ...res }];
          saveState();
          render();
        } else if (e.target.id === "modal-account-form") {
          e.preventDefault();
          const fd = new FormData(e.target);
          state.userName = String(fd.get("userName") || "").trim();
          state.userEmail = String(fd.get("userEmail") || "").trim();
          state.isGuest = !state.userName && !state.userEmail;
          saveState();
          ui.modal = null;
          showToast(t("profile.savedToast"));
        }
      });

      /* ==========================================================================
         BOOTSTRAP
         ========================================================================== */
      async function bootstrapApp() {
        loadState();
        applyDocumentLangAndTheme();

        try {
          const [enRes, faRes, mistakesRes, coursesRes] = await Promise.all([
            fetch("locales/en.json", { cache: "no-store" }),
            fetch("locales/fa.json", { cache: "no-store" }),
            fetch("content/mistakes.json", { cache: "no-store" }),
            fetch("content/courses.json", { cache: "no-store" })
          ]);
          if (enRes.ok) {
            const enData = await enRes.json();
            LOCALES.en = mergeLocaleData(FALLBACK_LOCALES.en, enData);
          }
          if (faRes.ok) {
            const faData = await faRes.json();
            LOCALES.fa = mergeLocaleData(FALLBACK_LOCALES.fa, faData);
          }
          if (mistakesRes.ok) MISTAKES = await mistakesRes.json();
          if (coursesRes.ok) {
            const cData = await coursesRes.json();
            if (Array.isArray(cData) && cData.length > 0) {
              COURSES = cData.slice().sort((a, b) => (a.order || 99) - (b.order || 99));
            }
          }

          const pianoCount = Number(getCourseMeta("piano")?.lessonCount) || 36;
          const lessonPromises = Array.from({ length: pianoCount }, (_, idx) => {
            const num = String(idx + 1).padStart(2, "0");
            return fetch(`content/lessons/lesson-${num}.json`).then((r) => (r.ok ? r.json() : null));
          });
          const loadedLessons = (await Promise.all(lessonPromises)).filter(Boolean);
          if (loadedLessons.length > 0) {
            COURSE_LESSONS.piano = loadedLessons.sort((a, b) => a.id - b.id);
          }

          // Load lessons for any additional course in content/courses/<courseId>/lesson-NN.json
          const otherCourses = COURSES.filter((c) => c.id !== "piano" && (Number(c.lessonCount) > 0 || c.status === "active" || c.status === "ready"));
          for (const course of otherCourses) {
            const maxLessons = Number(course.lessonCount) || 12;
            const cPromises = Array.from({ length: maxLessons }, (_, idx) => {
              const num = String(idx + 1).padStart(2, "0");
              return fetch(`content/courses/${course.id}/lesson-${num}.json`)
                .then((r) => (r.ok ? r.json() : null))
                .catch(() => null);
            });
            const cLoaded = (await Promise.all(cPromises)).filter(Boolean);
            COURSE_LESSONS[course.id] = cLoaded.sort((a, b) => a.id - b.id);
          }
        } catch (err) {
          // Offline safety
        }

        ensureCourseProgressMap();
        setActiveCourse(state.activeCourseId || "piano", false);
        evaluateStreakOnLoad();

        if (state.onboardingComplete) {
          ui.screen = "home";
          render();
        } else {
          ui.screen = "splash";
          render();
          setTimeout(() => {
            if (ui.screen === "splash") {
              ui.screen = "welcome";
              render();
            }
          }, 950);
        }
      }

      bootstrapApp();
    </script>
  </body>
</html>
